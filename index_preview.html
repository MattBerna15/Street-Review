                    <p className="font-bold text-slate-400 uppercase text-[10px] mb-2">Comuni abilitati nel test:</p>
                    <div className="flex flex-wrap justify-center gap-1">
                      {['San Benedetto del Tronto', 'Porto d\'Ascoli', 'Grottammare', 'Monteprandone', 'Centobuchi', 'Acquaviva Picena'].map(c => (
                        <span key={c} className="bg-white px-2 py-0.5 rounded-md border border-slate-200 text-slate-700 font-medium">📍 {c}</span>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      setIsOutOfAreaOpen(false);
                      if (mapEngine === 'google' && googleMapRef.current) {
                        googleMapRef.current.panTo(GEOFENCE.center);
                      } else if (leafletMapRef.current) {
                        leafletMapRef.current.setView([GEOFENCE.center.lat, GEOFENCE.center.lng], GEOFENCE.defaultZoom, { animate: true });
                      }
                    }}
                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md text-xs"
                  >
                    Torna alla Riviera delle Palme
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- SOTTORAPPRESENTAZIONE MODALE RECENSIONE INTERATTIVA ---
    function ReviewModal({ streetName, currentUser, initialData, onClose, onSubmit }) {
      const isEditing = Boolean(initialData);
      const defaultRatings = {
        roadSurface: 4, groundSignage: 4, verticalSignage: 4,
        parkingQuantity: 3, sidewalkQuality: 4, lighting: 4,
        cleanliness: 4, accessibility: 4, rainDrainage: 4,
        greeneryShade: 4, quietness: 4, intersectionVisibility: 4,
        laneWidth: 4
      };
      const [ratings, setRatings] = useState(
        initialData?.ratings ? { ...defaultRatings, ...initialData.ratings } : defaultRatings
      );
      const [parkingTypes, setParkingTypes] = useState(initialData?.parkingTypes || ['FREE']);
      const [hasCyclePath, setHasCyclePath] = useState(initialData?.hasCyclePath || false);
      const [amenities, setAmenities] = useState(initialData?.amenities || []);
      const [comment, setComment] = useState(initialData?.comment || '');

      useEffect(() => {
        if (initialData) {
          setRatings({
            ...defaultRatings,
            ...initialData.ratings
          });
          setParkingTypes(initialData.parkingTypes || []);
          setHasCyclePath(initialData.hasCyclePath || false);
          setAmenities(initialData.amenities || []);
          setComment(initialData.comment || '');
        } else {
          setRatings(defaultRatings);
          setParkingTypes(['FREE']);
          setHasCyclePath(false);
          setAmenities([]);
          setComment('');
        }
      }, [initialData]);

      const overall = Number(
        (Object.values(ratings).reduce((a, b) => a + b, 0) / 13).toFixed(1)
      );

      const handleStarClick = (categoryKey, starVal) => {
        setRatings(prev => ({ ...prev, [categoryKey]: starVal }));
      };

      const toggleParking = (type) => {
        setParkingTypes(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
      };

      const toggleAmenity = (val) => {
        setAmenities(prev => prev.includes(val) ? prev.filter(a => a !== val) : [...prev, val]);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-bold text-slate-900">
                    {isEditing ? 'Modifica la tua recensione' : 'Nuova Recensione'}
                  </h3>
                  {isEditing && (
                    <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                      ✏️ Modifica
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-500">{streetName}</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">★ {overall}</span>
                <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 cursor-pointer">
                  <IconClose size={20} />
                </button>
              </div>
            </div>

            {currentUser && (
              <div className="px-6 py-2 bg-blue-50/70 border-b border-blue-100 flex items-center gap-2.5 text-xs">
                <img
                  src={currentUser.avatarUrl}
                  alt={currentUser.name}
                  className="w-5 h-5 rounded-full border border-blue-400 object-cover"
                  referrerPolicy="no-referrer"
                />
                <span className="text-slate-600">
                  Pubblichi come: <strong className="text-slate-900">{currentUser.name}</strong> ({currentUser.email})
                </span>
              </div>
            )}

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSubmit({
                  userName: currentUser ? currentUser.name : 'Tu (Cittadino)',
                  ratings,
                  overallRating: overall,
                  comment: comment.trim() || 'Recensione pubblicata con successo.',
                  parkingTypes,
                  hasCyclePath,
                  amenities,
                });
              }}
              className="flex-1 overflow-y-auto px-6 py-4 space-y-4 text-xs"
            >
              <p className="text-slate-500 font-semibold uppercase text-[10px]">Valuta le 13 categorie obbligatorie:</p>

              {[
                ['roadSurface', 'Manto Stradale (asfalto, buche)'],
                ['groundSignage', 'Segnaletica a terra (strisce, stop)'],
                ['verticalSignage', 'Segnaletica verticale (cartelli visibili)'],
                ['parkingQuantity', 'Quantità di parcheggi'],
                ['sidewalkQuality', 'Qualità dei marciapiedi'],
                ['lighting', 'Illuminazione notturna'],
                ['cleanliness', 'Pulizia e decoro urbano'],
                ['accessibility', 'Accessibilità (passeggini / PMR)'],
                ['rainDrainage', 'Drenaggio piovano (caditoie, tombini)'],
                ['greeneryShade', 'Ombreggiatura e verde (alberi, radici)'],
                ['quietness', 'Tranquillità e silenziosità (rumore)'],
                ['intersectionVisibility', 'Visibilità incroci (specchi, visuale)'],
                ['laneWidth', 'Larghezza carreggiata (manovra, spazio)'],
              ].map(([key, label]) => (
                <div key={key} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  <span className="font-semibold text-slate-700 truncate pr-2">{label}</span>
                  <div className="flex gap-1 text-amber-400 select-none">
                    {[1, 2, 3, 4, 5].map(star => (
                      <span
                        key={star}
                        onClick={() => handleStarClick(key, star)}
                        className={`cursor-pointer text-base transition-transform hover:scale-125 ${
                          star <= (ratings[key] || 0) ? 'text-amber-400' : 'text-slate-200'
                        }`}
                      >
                        ★
                      </span>
                    ))}
                  </div>
                </div>
              ))}

              {/* Tag Parcheggi */}
              <div className="space-y-1.5 pt-1">
                <p className="font-semibold text-slate-700">Tipologia parcheggio presente:</p>
                <div className="flex flex-wrap gap-2">
                  {[
                    ['FREE', 'Parcheggio Gratuito', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-blue-600 text-white border-blue-600 shadow-xs'],
                    ['PAID', 'A Pagamento (Blu)', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-blue-600 text-white border-blue-600 shadow-xs'],
                    ['PARKING_DISC', '⏱️ Disco Orario', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-slate-800 text-white border-slate-800 shadow-xs'],
                    ['DISABLED', '♿ Posti Disabili', 'bg-amber-50 text-amber-900 border-amber-300', 'bg-amber-500 text-slate-950 font-black border-amber-600 shadow-xs'],
                    ['PINK', '🌸 Posti Rosa', 'bg-pink-50 text-pink-900 border-pink-300', 'bg-pink-500 text-white font-black border-pink-600 shadow-xs'],
                    ['LOADING_UNLOADING', '🚚 Carico / Scarico', 'bg-orange-50 text-orange-900 border-orange-300', 'bg-orange-500 text-white font-black border-orange-600 shadow-xs'],
                  ].map(([val, name, unselCls, selCls]) => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => toggleParking(val)}
                      className={`px-3 py-1.5 rounded-xl font-bold border transition-all cursor-pointer ${
                        parkingTypes.includes(val) ? selCls : unselCls
                      }`}
                    >
                      {name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Tag Dotazioni e Arredo Urbano */}
              <div className="space-y-1.5 pt-1">
                <p className="font-semibold text-slate-700">Dotazioni e Arredo Urbano (Tag rapidi):</p>
                <div className="flex flex-wrap gap-2">
                  {[
                    ['EV_CHARGING', '⚡ Colonnine EV'],
                    ['BIKE_RACKS', '🚲 Rastrelliere Bici'],
                    ['SPEED_BUMPS', '⚠️ Dossi / Dissuasori'],
                    ['COBBLESTONE', '🏛️ Pavimentazione Speciale'],
                    ['DRINKING_FOUNTAIN', '💧 Fontanella'],
                    ['BENCHES', '🪑 Panchine'],
                    ['TRASH_BINS', '🗑️ Cestini'],
                  ].map(([val, name]) => {
                    const isSelected = amenities.includes(val);
                    return (
                      <button
                        key={val}
                        type="button"
                        onClick={() => toggleAmenity(val)}
                        className={`px-3 py-1.5 rounded-xl font-bold border transition-all cursor-pointer ${
                          isSelected
                            ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {name} {isSelected && '✓'}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Tag Pista Ciclabile */}
              <div className="space-y-1.5">
                <p className="font-semibold text-slate-700">Pista ciclabile presente?</p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setHasCyclePath(true)}
                    className={`flex-1 py-2 rounded-xl font-bold border ${hasCyclePath ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    Sì, presente
                  </button>
                  <button
                    type="button"
                    onClick={() => setHasCyclePath(false)}
                    className={`flex-1 py-2 rounded-xl font-bold border ${!hasCyclePath ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    No, assente
                  </button>
                </div>
              </div>

              {/* Commento Libero */}
              <div className="space-y-1 pt-1">
                <label className="font-bold text-slate-700">Commento libero:</label>
                <textarea 
                  value={comment}
                  onChange={(e) => setComment(e.target.value)}
                  rows={3} 
                  placeholder="Aggiungi dettagli utili per i residenti (es. 'Zona tranquilla, marciapiedi larghi ma pochi parcheggi la sera')..."
                  className="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
                />
              </div>

              <button
                type="submit"
                className={`w-full py-3.5 text-white font-bold rounded-2xl shadow-lg active:scale-[0.99] text-sm cursor-pointer transition-all ${
                  isEditing
                    ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/25'
                    : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/25'
                }`}
              >
                {isEditing ? '💾 Aggiorna recensione' : 'Pubblica Recensione'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- MODALE AUTENTICAZIONE GOOGLE OAUTH 2.0 ---
    const GOOGLE_CLIENT_ID = "512832291400-m97714l26jqki67cjr9bkmr7cfaibq1b.apps.googleusercontent.com";

    function AuthModal({ isOpen, onClose, onLoginSuccess }) {
      const googleBtnRef = useRef(null);
      const isFileProtocol = window.location.protocol === 'file:';
      const currentOrigin = window.location.origin;

      useEffect(() => {
        if (!isOpen) return;

        // Inizializza Google Identity Services se lo script è pronto
        if (window.google && window.google.accounts && window.google.accounts.id) {
          try {
            window.google.accounts.id.initialize({
              client_id: GOOGLE_CLIENT_ID,
              callback: async (response) => {
                try {
                  if (response && response.credential && window.firebase && window.firebase.auth) {
                    try {
                      const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
                      const userCredential = await firebase.auth().signInWithCredential(credential);
                      const fUser = userCredential.user;
                      console.log("Firebase Auth signInWithCredential riuscito. UID:", fUser.uid);
                      onLoginSuccess({
                        id: fUser.uid,
                        name: fUser.displayName || 'Utente Google',
                        email: fUser.email || '',
                        avatarUrl: fUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
                      });
                      return;
                    } catch (authErr) {
                      console.error("Errore signInWithCredential:", authErr);
                      alert("Attenzione: autenticazione Firebase fallita: " + (authErr.message || authErr) + "\nVerifica che il provider 'Google' sia abilitato nella Firebase Console (Authentication > Sign-in method).");
                      return;
                    }
                  }

                  // Fallback se Firebase Auth non è disponibile
                  const base64Url = response.credential.split('.')[1];
                  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                  const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                  const payload = JSON.parse(jsonPayload);

                  onLoginSuccess({
                    id: payload.sub,
                    name: payload.name,
                    email: payload.email,
                    avatarUrl: payload.picture,
                  });
                } catch (err) {
                  console.error('Errore decodifica credenziale Google', err);
                }
              },
              auto_select: false,
              cancel_on_tap_outside: true,
              ux_mode: 'popup',
            });

            if (googleBtnRef.current && !isFileProtocol) {
              window.google.accounts.id.renderButton(googleBtnRef.current, {
                theme: 'filled_blue',
                size: 'large',
                width: 320,
                text: 'continue_with',
                shape: 'pill',
              });
            }
          } catch (e) {
            console.warn('GIS Init notice', e);
          }
        }
      }, [isOpen, isFileProtocol]);

      const handleGooglePopup = async () => {
        try {
          if (!window.firebase || !window.firebase.auth) {
            alert("SDK Firebase Auth non disponibile.");
            return;
          }
          const provider = new firebase.auth.GoogleAuthProvider();
          const userCredential = await firebase.auth().signInWithPopup(provider);
          const fUser = userCredential.user;
          console.log("Firebase Auth signInWithPopup riuscito. UID:", fUser.uid);
          onLoginSuccess({
            id: fUser.uid,
            name: fUser.displayName || 'Utente Google',
            email: fUser.email || '',
            avatarUrl: fUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
          });
        } catch (err) {
          console.error("Errore Google Popup:", err);
          alert("Errore accesso Google con Firebase: " + (err.message || err));
        }
      };

      const handleDemoLogin = async (demoProfile) => {
        if (window.firebase && window.firebase.auth) {
          try {
            const anon = await firebase.auth().signInAnonymously();
            const fUser = anon.user;
            console.log("Firebase Auth Anonymous SignIn per demo:", fUser.uid);
            onLoginSuccess({
              id: fUser.uid,
              name: demoProfile.name,
              email: demoProfile.email,
              avatarUrl: demoProfile.avatarUrl,
            });
            return;
          } catch (e) {
            console.warn("Anonymous auth non disponibile:", e);
          }
        }
        onLoginSuccess(demoProfile);
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fade-in">
          <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-slide-up relative">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 z-10 cursor-pointer"
            >
              <IconClose size={18} />
            </button>

            <div className="p-6 text-center space-y-4">
              <div className="w-16 h-16 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-lg border border-slate-100 overflow-hidden p-1">
                <img src="assets/logo.jpg" alt="Street Review" className="w-full h-full object-contain rounded-xl" />
              </div>

              <div>
                <h3 className="text-xl font-black text-slate-900">Accedi a Street Review</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Accedi con il tuo account Google per autenticarti su Firebase e pubblicare recensioni.
                </p>
              </div>

              {/* BOX DIAGNOSTICO ORIGIN */}
              {isFileProtocol ? (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-left space-y-1 text-xs">
                  <div className="flex items-center gap-1.5 text-amber-800 font-bold text-[11px]">
                    <span>⚠️ Stai aprendo con file://</span>
                  </div>
                  <p className="text-[10px] text-amber-700 leading-relaxed">
                    Google OAuth rifiuta le richieste con origine <code>null / file://</code> generando l'<strong>Errore 400</strong>.
                  </p>
                  <p className="text-[10px] text-amber-800 font-semibold pt-0.5">
                    👉 Usa l'indirizzo del server locale: <br/>
                    <a href="http://localhost:3000/index_preview.html" className="text-blue-600 underline font-mono text-[11px]">
                      http://localhost:3000/index_preview.html
                    </a>
                  </p>
                </div>
              ) : (
                <div className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-left text-[11px] space-y-1">
                  <div className="flex justify-between items-center text-slate-500">
                    <span>Origine inviata a Google:</span>
                    <code className="font-mono font-bold text-emerald-700 bg-white px-1.5 py-0.5 rounded border border-slate-200">
                      {currentOrigin}
                    </code>
                  </div>
                  <p className="text-[9px] text-slate-400">
                    Verifica che <code>{currentOrigin}</code> sia in "Origini JavaScript autorizzate" su Google Cloud e "Domini autorizzati" su Firebase Console.
                  </p>
                </div>
              )}

              <div className="pt-1 flex flex-col items-center gap-2.5">
                {/* Contenitore pulsante ufficiale Google GIS */}
                {!isFileProtocol && (
                  <div ref={googleBtnRef} className="w-full flex justify-center min-h-[40px]"></div>
                )}

                {/* Pulsante alternativo diretto Popup Firebase Auth */}
                <button
                  onClick={handleGooglePopup}
                  className="w-full py-2.5 px-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] rounded-2xl shadow-md text-white font-bold text-xs flex items-center justify-center gap-2.5 transition-all cursor-pointer"
                >
                  <svg className="w-4 h-4 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                  </svg>
                  <span>Accedi con Google (Popup Diretto)</span>
                </button>

                {/* Separatore */}
                <div className="w-full flex items-center gap-2 text-slate-300 text-[10px] my-1">
                  <div className="flex-1 h-px bg-slate-200"></div>
                  <span className="text-slate-400 font-semibold">oppure test rapido</span>
                  <div className="flex-1 h-px bg-slate-200"></div>
                </div>

                {/* Simulatore Google Profile con sessione Firebase */}
                <button
                  onClick={() => handleDemoLogin({
                    id: 'g-resident-101',
                    name: 'Marco Rossi',
                    email: 'marco.rossi.sbt@gmail.com',
                    avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
                  })}
                  className="w-full py-2 px-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-[0.99] rounded-2xl shadow-xs flex items-center justify-center gap-2 text-slate-700 font-bold text-xs transition-all cursor-pointer"
                >
                  <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80" className="w-4 h-4 rounded-full" />
                  <span>Marco Rossi (Demo)</span>
                </button>

                <button
                  onClick={() => handleDemoLogin({
                    id: 'g-resident-102',
                    name: 'Giulia Bianchi',
                    email: 'giulia.bianchi@gmail.com',
                    avatarUrl: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80',
                  })}
                  className="w-full py-2 px-3 bg-slate-50 hover:bg-slate-100 rounded-xl text-slate-600 font-semibold text-[11px] transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" className="w-4 h-4 rounded-full" />
                  <span>Giulia Bianchi (Demo)</span>
                </button>
              </div>

              <div className="text-[10px] text-slate-400 border-t border-slate-100 pt-2.5">
                Modalità Ospite: puoi sempre navigare e consultare i voti delle strade senza effettuare il login.
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
