          alert("Non hai i permessi per eliminare questa recensione.");
          return false;
        }

        const confirmed = window.confirm(
          "Sei sicuro di voler eliminare definitivamente questa recensione? Verranno ricalcolate le medie della via e i punti XP."
        );
        if (!confirmed) return false;

        const firestore = window.db;
        if (!firestore) {
          alert("Impossibile connettersi a Firestore ('street-review-database').");
          return false;
        }

        const reviewDocId = String(review.id || '').trim();
        const targetStreet = selectedStreet || (streetsRef.current || []).find(s =>
          (review.streetKey && s.streetKey === review.streetKey) ||
          isSameStreet(s, {
            name: review.streetName,
            city: review.streetCity,
            province: review.streetProvince,
            lat: review.latitude,
            lng: review.longitude,
          })
        );

        const canonicalAnchor = getCanonicalStreetAnchor(
          targetStreet?.name || review.streetName || '',
          targetStreet?.city || review.streetCity || '',
          targetStreet?.latitude || review.latitude || GEOFENCE.center.lat,
          targetStreet?.longitude || review.longitude || GEOFENCE.center.lng,
          targetStreet?.province || review.streetProvince || ''
        );
        const finalLat = canonicalAnchor.lat || targetStreet?.latitude || review.latitude || GEOFENCE.center.lat;
        const finalLng = canonicalAnchor.lng || targetStreet?.longitude || review.longitude || GEOFENCE.center.lng;
        const finalCity = canonicalAnchor.city || resolveCanonicalCityName(targetStreet?.city || review.streetCity, finalLat, finalLng);
        const finalProvince = canonicalAnchor.province || normalizeProvinceCode(targetStreet?.province || review.streetProvince || '');
        const finalPostal = canonicalAnchor.postalCode || targetStreet?.postalCode || resolveDefaultPostalCode(normalizeCityKey(finalCity, finalLat, finalLng));
        const canonicalStreetName = canonicalAnchor.canonicalName || targetStreet?.name || review.streetName || '';
        const streetCompKey = review.streetKey || targetStreet?.streetKey || createStreetCompositeKey(canonicalStreetName, finalCity, finalLat, finalLng, finalProvince);
        const previousPioneerAuthorId = targetStreet?.pioneerAuthorId ? String(targetStreet.pioneerAuthorId) : null;

        // Se il modulo di modifica era aperto per questa recensione, chiudilo subito
        if (isReviewOpen) {
          setIsReviewOpen(false);
          setEditingReview(null);
        }

        // Oggetto "Strada Vuota / Nuova" pronto per il Caso 2 (0 recensioni rimaste)
        const emptyResetStreet = {
          id: targetStreet?.id || ('street-' + streetCompKey.replace(/[^a-z0-9]/g, '-')),
          streetKey: streetCompKey,
          name: canonicalStreetName,
          city: finalCity,
          province: finalProvince,
          postalCode: finalPostal,
          latitude: finalLat,
          longitude: finalLng,
          placeId: targetStreet?.placeId || null,
          streetType: detectStreetTypeFromStreetName(canonicalStreetName),
          avgOverallRating: 0,
          reviewsCount: 0,
          hasCyclePath: false,
          commonParkingTypes: [],
          amenities: [],
          roadObstacles: [],
          pioneerAuthorId: null,
          pioneerReviewId: null,
          pioneerAuthorName: '',
          categoryAverages: {
            roadSurface: null, groundSignage: null, verticalSignage: null,
            parkingQuantity: null, sidewalkQuality: null, lighting: null,
            cleanliness: null, accessibility: null, rainDrainage: null,
            greeneryShade: null, quietness: null, intersectionVisibility: null,
            laneWidth: null,
          },
          reviews: [],
          reviewsLoaded: true,
        };

        // Aggiornamento ottimistico immediato della scheda strada e dei PIN mappa
        const optimisticStreets = [];
        (streetsRef.current || []).forEach(s => {
          const isTarget = (targetStreet && s.id === targetStreet.id) || s.streetKey === streetCompKey || isSameStreet(s, emptyResetStreet);
          if (!isTarget) {
            optimisticStreets.push(s);
            return;
          }

          const remainingRevs = (s.reviews || []).filter(r => String(r.id) !== reviewDocId);
          if (remainingRevs.length === 0) {
            // Caso 2: 0 recensioni rimaste -> riporta il PIN e la scheda aperta allo stato neutro "Strada Vuota / Nuova"
            optimisticStreets.push(emptyResetStreet);
          } else {
            // Caso 1: Rimangono altre recensioni -> ricalcola medie, tipologia prevalente e tag
            const {
              streetType: prevalentStreetType,
              ratingOverall: newAvg,
              categoryAverages: updatedCat,
              parkingTypes: mergedParking,
              hasCyclePath: mergedCycle,
              amenities: mergedAmenities,
              roadObstacles: mergedObstacles,
            } = computeStreetAggregatesFromReviews(remainingRevs, canonicalStreetName, s.streetType);

            let oldestRev = remainingRevs[remainingRevs.length - 1] || null;
            let minTime = oldestRev ? parseReviewTimestampMs(oldestRev) : Number.MAX_SAFE_INTEGER;
            for (let i = remainingRevs.length - 1; i >= 0; i--) {
              const cand = remainingRevs[i];
              const t = parseReviewTimestampMs(cand);
              if (t < minTime) {
                minTime = t;
                oldestRev = cand;
              }
            }
            const nextPioneerId = oldestRev ? String(oldestRev.userId || oldestRev.authorId || '') : null;

            optimisticStreets.push({
              ...s,
              streetKey: streetCompKey,
              streetType: prevalentStreetType,
              reviewsCount: remainingRevs.length,
              avgOverallRating: newAvg,
              categoryAverages: updatedCat,
              commonParkingTypes: mergedParking,
              hasCyclePath: mergedCycle,
              amenities: mergedAmenities,
              roadObstacles: mergedObstacles,
              pioneerAuthorId: nextPioneerId,
              pioneerReviewId: oldestRev?.id || null,
              pioneerAuthorName: oldestRev?.user || oldestRev?.authorName || '',
              reviews: remainingRevs,
              reviewsLoaded: true,
            });
          }
        });

        streetsRef.current = optimisticStreets;
        setStreets(optimisticStreets);
        const updatedSel = optimisticStreets.find(s => s.streetKey === streetCompKey || isSameStreet(s, emptyResetStreet));
        if (updatedSel && selectedStreet && (selectedStreet.streetKey === streetCompKey || isSameStreet(selectedStreet, emptyResetStreet))) {
          setSelectedStreet(updatedSel);
        }

        // Esecuzione asincrona a cascata su Firestore (A: delete review -> B: update/delete street -> C: recalculate/delete user)
        (async () => {
          try {
            // STEP A: Elimina il documento corrispondente dalla collezione 'reviews'
            if (reviewDocId) {
              await firestore.collection('reviews').doc(reviewDocId).delete();
              console.log('[Delete Step A/C] Documento recensione eliminato da reviews/' + reviewDocId);
            }
            if (reviewAuthorId && streetCompKey) {
              const compositeDocId = `${reviewAuthorId}_${streetCompKey}`;
              if (compositeDocId !== reviewDocId) {
                await firestore.collection('reviews').doc(compositeDocId).delete().catch(() => {});
              }
            }

            // STEP B: Interroga le recensioni superstiti per quella streetKey nella collezione 'reviews'
            const streetRevsMap = new Map();
            const byKeySnap = await firestore.collection('reviews')
              .where('streetKey', '==', streetCompKey)
              .get();
            byKeySnap.docs.forEach(d => {
              if (d.id !== reviewDocId) {
                streetRevsMap.set(d.id, { id: d.id, ...d.data() });
              }
            });

            if (canonicalStreetName) {
              const byNameSnap = await firestore.collection('reviews')
                .where('streetName', '==', canonicalStreetName)
                .get();
              byNameSnap.docs.forEach(d => {
                if (d.id !== reviewDocId && !streetRevsMap.has(d.id)) {
                  const rData = d.data();
                  if (isSameStreet(
                    { name: canonicalStreetName, city: finalCity, province: finalProvince, lat: finalLat, lng: finalLng },
                    { name: rData.streetName, city: rData.streetCity, province: rData.streetProvince || rData.province, lat: rData.latitude, lng: rData.longitude }
                  )) {
                    streetRevsMap.set(d.id, { id: d.id, ...rData });
                  }
                }
              });
            }

            const remainingStreetReviews = Array.from(streetRevsMap.values());
            let newStreetPioneerAuthorId = null;

            if (remainingStreetReviews.length >= 1) {
              // CASO 1: Rimangono altre recensioni (>= 1) -> Ricalcola da zero ratingOverall, reviewCount, 13 categorie, tag e pioneerAuthorId
              const streetSummaryDoc = buildStreetSummaryDocFromReviews(remainingStreetReviews, {
                streetKey: streetCompKey,
                streetName: canonicalStreetName,
                streetCity: finalCity,
                province: finalProvince,
                postalCode: finalPostal,
                latitude: finalLat,
                longitude: finalLng,
              });
              newStreetPioneerAuthorId = streetSummaryDoc.pioneerAuthorId ? String(streetSummaryDoc.pioneerAuthorId) : null;

              await firestore.collection('streets').doc(streetCompKey).set(streetSummaryDoc);
              console.log('[Delete Step B/C - Caso 1] Documento streets/' + streetCompKey + ' ricalcolato con ' + remainingStreetReviews.length + ' recensioni superstiti:', streetSummaryDoc);

              const formattedRemaining = remainingStreetReviews.map(r => formatCloudReviewToUI(r, streetSummaryDoc));
              const syncedStreetUI = mapStreetDocToUIStreet(streetSummaryDoc, {
                id: targetStreet?.id || emptyResetStreet.id,
                reviews: formattedRemaining,
                reviewsLoaded: true,
              });

              setStreets(prev => {
                const next = prev.map(s =>
                  (s.streetKey === streetCompKey || isSameStreet(s, syncedStreetUI)) ? syncedStreetUI : s
                );
                streetsRef.current = next;
                return next;
              });
              setSelectedStreet(prevSel => {
                if (!prevSel) return prevSel;
                if (prevSel.streetKey === streetCompKey || isSameStreet(prevSel, syncedStreetUI)) {
                  return syncedStreetUI;
                }
                return prevSel;
              });
            } else {
              // CASO 2: Era l'UNICA recensione della strada (0 recensioni rimaste) -> Elimina completamente streets/{streetKey}
              await firestore.collection('streets').doc(streetCompKey).delete();
              console.log('[Delete Step B/C - Caso 2] Zero recensioni rimaste: documento streets/' + streetCompKey + ' eliminato da Firestore.');

              setStreets(prev => {
                // Se la scheda di questa strada è attualmente aperta, mantieni il segnaposto '— Nuova' (0 recensioni)
                const isSheetOpenForThisStreet = selectedStreet && sheetSnap !== 'hidden' && (
                  selectedStreet.streetKey === streetCompKey || isSameStreet(selectedStreet, emptyResetStreet)
                );
                const filtered = prev.filter(s => s.streetKey !== streetCompKey && !isSameStreet(s, emptyResetStreet));
                const next = isSheetOpenForThisStreet ? [emptyResetStreet, ...filtered] : filtered;
                streetsRef.current = next;
                return next;
              });
              setSelectedStreet(prevSel => {
                if (!prevSel) return prevSel;
                if (prevSel.streetKey === streetCompKey || isSameStreet(prevSel, emptyResetStreet)) {
                  return emptyResetStreet;
                }
                return prevSel;
              });
            }

            // STEP C: Ricalcolo Statistiche, XP, Livelli e Badge dell'Autore della recensione eliminata ('users/{authorId}')
            const recalculateAuthorProfileOnFirestore = async (targetUid, fallbackName = '', fallbackAvatar = '') => {
              if (!targetUid || targetUid.startsWith('name:')) return;
              const authorRevsSnap = await firestore.collection('reviews')
                .where('authorId', '==', targetUid)
                .get();
              const remainingAuthorReviews = authorRevsSnap.docs
                .filter(d => d.id !== reviewDocId)
                .map(d => ({ id: d.id, ...d.data() }));

              if (remainingAuthorReviews.length > 0) {
                // L'autore ha ancora altre recensioni: ricalcola XP, livello, conteggi e badge e aggiorna users/{authorId}
                let existingUserSnap = null;
                try {
                  existingUserSnap = await firestore.collection('users').doc(targetUid).get();
                } catch (e) {}
                const existingUserData = existingUserSnap && existingUserSnap.exists ? existingUserSnap.data() : {};
                const preservedMilestones = Array.isArray(existingUserData.awardedMilestones) ? existingUserData.awardedMilestones : [];

                const { userDoc, fullProfile } = buildUserSummaryDocFromReviews(
                  targetUid,
                  remainingAuthorReviews,
                  streetsRef.current,
                  preservedMilestones,
                  {
                    authorName: existingUserData.authorName || existingUserData.name || fallbackName || 'Cittadino Esploratore',
                    authorAvatar: existingUserData.authorAvatar || existingUserData.avatarUrl || fallbackAvatar || '',
                    email: existingUserData.email || '',
                  }
                );

                await firestore.collection('users').doc(targetUid).set(userDoc);
                console.log('[Delete Step C/C] Profilo autore users/' + targetUid + ' ricalcolato:', userDoc);

                setCachedUsersById(prev => ({ ...prev, [String(targetUid)]: fullProfile }));
                if (currentUser && String(currentUser.id) === String(targetUid)) {
                  setCurrentUserProfileDoc(fullProfile);
                }
              } else {
                // L'autore è rimasto con 0 recensioni totali: elimina il documento users/{authorId} per rimuoverlo dalla classifica
                await firestore.collection('users').doc(targetUid).delete();
                console.log('[Delete Step C/C] Autore rimasto con 0 recensioni: documento users/' + targetUid + ' eliminato dalla classifica.');

                const zeroProfile = createDefaultProfile({
                  id: targetUid,
                  name: fallbackName || 'Cittadino Esploratore',
                  avatarUrl: fallbackAvatar || '',
                });
                setLeaderboardUsers(prev => prev.filter(u => String(u.authorId) !== String(targetUid)));
                setCachedUsersById(prev => ({ ...prev, [String(targetUid)]: zeroProfile }));
                if (currentUser && String(currentUser.id) === String(targetUid)) {
                  setCurrentUserProfileDoc(zeroProfile);
                }
              }
            };

            if (reviewAuthorId) {
              await recalculateAuthorProfileOnFirestore(
                reviewAuthorId,
                review.authorName || review.user || '',
                review.authorAvatar || review.avatarUrl || ''
              );
            }

            // Se l'eliminazione del Pioniere ha promosso un altro utente a nuovo Pioniere della via, ricalcola anche il suo profilo
            if (
              newStreetPioneerAuthorId &&
              newStreetPioneerAuthorId !== previousPioneerAuthorId &&
              newStreetPioneerAuthorId !== reviewAuthorId
            ) {
              await recalculateAuthorProfileOnFirestore(newStreetPioneerAuthorId);
            }

            // Notifica Toast di conferma
            triggerDeleteToast('🗑️ Recensione eliminata e statistiche ricalcolate.');
          } catch (err) {
            console.error('Errore durante l\'eliminazione a cascata della recensione:', err);
            alert('Errore durante l\'eliminazione della recensione su Firestore: ' + (err.message || err));
          }
        })();

        return true;
      };

      // 5.05 PULSANTE DI REAZIONE "👍 UTILE (+10 XP ALL'AUTORE)" SUI COMMENTI
      const handleToggleHelpfulReview = async (review) => {
        if (!review) return;

        const firebaseAuthUser = (window.firebase && window.firebase.auth && window.firebase.auth().currentUser) || null;
        const voterUid = firebaseAuthUser ? String(firebaseAuthUser.uid) : (currentUser?.id ? String(currentUser.id) : null);

        if (!voterUid || !currentUser) {
          setIsAuthOpen(true);
          return;
        }

        const reviewAuthorId = String(review.authorId || review.userId || '').trim();
        const isOwnReview = Boolean(
          (reviewAuthorId && reviewAuthorId === voterUid) ||
          (currentUser?.name && review.user && String(review.user).trim().toLowerCase() === String(currentUser.name).trim().toLowerCase())
        );

        if (isOwnReview) {
          triggerShareToast('ℹ️ Non puoi votare "Utile" sulla tua stessa recensione.');
          return;
        }

        const currentVoterIds = Array.isArray(review.helpfulVoterIds)
          ? review.helpfulVoterIds.filter(Boolean).map(String)
          : [];
        const hasAlreadyVoted = currentVoterIds.includes(voterUid);
        const updatedVoterIds = hasAlreadyVoted
          ? currentVoterIds.filter(id => id !== voterUid)
          : [...currentVoterIds, voterUid];
        const prevCount = Math.max(0, Number(review.helpfulCount ?? currentVoterIds.length) || 0);
        const updatedHelpfulCount = hasAlreadyVoted
          ? Math.max(0, prevCount - 1)
          : Math.max(prevCount + 1, updatedVoterIds.length);
        const xpDelta = hasAlreadyVoted ? -10 : 10;

        const targetStreet = selectedStreet || (streetsRef.current || []).find(s =>
          (review.streetKey && s.streetKey === review.streetKey) ||
          (s.reviews && s.reviews.some(r => r.id === review.id))
        );
        const streetCompKey = review.streetKey || targetStreet?.streetKey || '';

        const resolveAuthorLevelForGuardian = (revObj, gId) => {
          const cached = gId ? cachedUsersRef.current[String(gId)] : null;
          if (cached?.levelInfo?.level) return cached.levelInfo.level;
          const prof = gamification.getAuthorProfile(revObj);
          return prof?.levelInfo?.level || 1;
        };

        // 1. Aggiornamento ottimistico immediato di streets e selectedStreet (incluso Guardiano della Via)
        let updatedStreetReviewsForGuardian = [];
        const optimisticStreets = (streetsRef.current || []).map(s => {
          const isMatch = (targetStreet && s.id === targetStreet.id) || (streetCompKey && s.streetKey === streetCompKey);
          if (!isMatch) return s;

          const nextRevs = (s.reviews || []).map(r => {
            if (r.id !== review.id) return r;
            return {
              ...r,
              helpfulVoterIds: updatedVoterIds,
              helpfulCount: updatedHelpfulCount,
            };
          });
          updatedStreetReviewsForGuardian = nextRevs;
          const nextGuardian = computeStreetGuardian(nextRevs, resolveAuthorLevelForGuardian);

          return {
            ...s,
            guardianId: nextGuardian.guardianId || s.guardianId,
            guardianName: nextGuardian.guardianName || s.guardianName,
            guardianAvatar: nextGuardian.guardianAvatar || s.guardianAvatar,
            guardianLevel: nextGuardian.guardianLevel || s.guardianLevel || 1,
            guardianScore: nextGuardian.guardianScore || 0,
            reviews: nextRevs,
          };
        });

        streetsRef.current = optimisticStreets;
        setStreets(optimisticStreets);
        const nextSelected = optimisticStreets.find(s =>
          (targetStreet && s.id === targetStreet.id) || (streetCompKey && s.streetKey === streetCompKey)
        );
        if (nextSelected && selectedStreet && (selectedStreet.id === nextSelected.id || selectedStreet.streetKey === nextSelected.streetKey)) {
          setSelectedStreet(nextSelected);
        }

        // 2. Aggiornamento ottimistico immediato degli XP dell'autore in cache e classifica (+10 / -10 XP)
        if (reviewAuthorId && !reviewAuthorId.startsWith('name:')) {
          setCachedUsersById(prev => {
            const existingProf = prev[reviewAuthorId] || gamification.getAuthorProfile(review);
            const nextXp = Math.max(50, (Number(existingProf?.xp) || 50) + xpDelta);
            const nextHydrated = hydrateUserProfileFromDoc({
              ...existingProf,
              authorId: reviewAuthorId,
              authorName: existingProf?.name || review.user,
              authorAvatar: existingProf?.avatarUrl || review.avatarUrl,
              xp: nextXp,
            });
            return { ...prev, [reviewAuthorId]: nextHydrated };
          });
        }

        if (!hasAlreadyVoted) {
          triggerShareToast(`👍 Hai votato "Utile"! +10 XP assegnati a ${review.user || 'questo esploratore'}.`);
        }

        // 3. Persistenza su Firestore (reviews/{reviewId}, streets/{streetKey}, users/{authorId})
        const firestore = window.db;
        if (!firestore || !review.id) return;

        try {
          await firestore.collection('reviews').doc(String(review.id)).set({
            helpfulVoterIds: updatedVoterIds,
            helpfulCount: updatedHelpfulCount,
          }, { merge: true });

          if (streetCompKey && updatedStreetReviewsForGuardian.length > 0) {
            const guardianInfo = computeStreetGuardian(updatedStreetReviewsForGuardian, resolveAuthorLevelForGuardian);
            await firestore.collection('streets').doc(streetCompKey).set({
              guardianId: guardianInfo.guardianId,
              guardianName: guardianInfo.guardianName,
              guardianAvatar: guardianInfo.guardianAvatar,
              guardianLevel: guardianInfo.guardianLevel || 1,
              guardianScore: guardianInfo.guardianScore || 0,
              updatedAt: new Date().toISOString(),
            }, { merge: true }).catch(err => console.warn('[Helpful] Aggiornamento guardian su streets:', err));
          }

          if (reviewAuthorId && !reviewAuthorId.startsWith('name:')) {
            const authorRevsSnap = await firestore.collection('reviews')
              .where('authorId', '==', reviewAuthorId)
              .get();
            const authorReviewsMap = new Map();
            authorRevsSnap.docs.forEach(d => authorReviewsMap.set(d.id, { id: d.id, ...d.data() }));
            if (authorReviewsMap.has(String(review.id))) {
              const cur = authorReviewsMap.get(String(review.id));
              authorReviewsMap.set(String(review.id), {
                ...cur,
                helpfulVoterIds: updatedVoterIds,
                helpfulCount: updatedHelpfulCount,
              });
            }
            const allAuthorRevs = Array.from(authorReviewsMap.values());
            if (allAuthorRevs.length > 0) {
              let existingUserData = {};
              try {
                const uSnap = await firestore.collection('users').doc(reviewAuthorId).get();
                if (uSnap.exists) existingUserData = uSnap.data() || {};
              } catch (e) {}

              const prevAuthorMilestones = new Set(Array.isArray(existingUserData.awardedMilestones) ? existingUserData.awardedMilestones : []);
              const prevAuthorLevel = Number(existingUserData.level) || 1;
              const prevAuthorBadges = new Set(Array.isArray(existingUserData.unlockedBadges) ? existingUserData.unlockedBadges : []);

              const { userDoc, fullProfile } = buildUserSummaryDocFromReviews(
                reviewAuthorId,
                allAuthorRevs,
                streetsRef.current,
                Array.from(prevAuthorMilestones),
                {
                  authorName: existingUserData.authorName || existingUserData.name || review.user || 'Cittadino Esploratore',
                  authorAvatar: existingUserData.authorAvatar || existingUserData.avatarUrl || review.avatarUrl || '',
                  email: existingUserData.email || '',
                  favoriteBadge: existingUserData.favoriteBadge || getLocalFavoriteBadge(reviewAuthorId) || null,
                }
              );

              // Controlla se il voto "👍 Utile" ha fatto sbloccare il badge "💎 Voce Autorevole" o un nuovo livello all'autore
              const newlyUnlockedByHelpful = fullProfile.badges.filter(b =>
                b.unlocked && !prevAuthorBadges.has(b.id) && !prevAuthorMilestones.has(`badge_${b.id}`) && b.id !== 'first_review'
              );
              const newlyReachedLvlByHelpful = (
                fullProfile.levelInfo.level > prevAuthorLevel &&
                !prevAuthorMilestones.has(`level_${fullProfile.levelInfo.level}`)
              ) ? fullProfile.levelInfo : null;

              if (newlyReachedLvlByHelpful) {
                for (let l = 2; l <= newlyReachedLvlByHelpful.level; l++) {
                  prevAuthorMilestones.add(`level_${l}`);
                }
              }
              newlyUnlockedByHelpful.forEach(b => prevAuthorMilestones.add(`badge_${b.id}`));
              userDoc.awardedMilestones = Array.from(prevAuthorMilestones);
              fullProfile.awardedMilestones = userDoc.awardedMilestones;

              await firestore.collection('users').doc(reviewAuthorId).set(userDoc, { merge: true });
              setCachedUsersById(prev => ({ ...prev, [reviewAuthorId]: fullProfile }));

              if ((newlyReachedLvlByHelpful || newlyUnlockedByHelpful.length > 0) && existingUserData.email && existingUserData.email.includes('@') && window.emailjs) {
                const achTitle = newlyUnlockedByHelpful.length > 0
                  ? `Nuovo Badge: ${newlyUnlockedByHelpful.map(b => b.name).join(', ')}`
                  : `Nuovo Livello: ${newlyReachedLvlByHelpful.title}`;
                const achDesc = newlyUnlockedByHelpful.length > 0
                  ? `Complimenti! Grazie ai voti "👍 Utile" della community sulle tue recensioni hai sbloccato ${newlyUnlockedByHelpful.map(b => `${b.icon} "${b.name}" (${b.description})`).join(' e ')}, salendo a ${fullProfile.xp} XP totali su Street Review!`
                  : `Complimenti! Grazie ai voti "👍 Utile" della community hai raggiunto ${fullProfile.xp} XP salendo al Livello ${newlyReachedLvlByHelpful.level} (${newlyReachedLvlByHelpful.fullTitle})!`;
                window.emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
                  to_email: existingUserData.email,
                  user_name: userDoc.name || 'Cittadino Esploratore',
                  achievement_title: achTitle,
                  achievement_description: achDesc,
                }).catch(() => {});
              }
            }
          }
        } catch (err) {
          console.warn('[Helpful] Errore salvataggio voto Utile su Firestore:', err);
        }
      };

      // 5.1 GESTIONE SEGNALAZIONI ADMIN (Elimina recensione segnalata, archivia o raggiungi la via)
      const handleDeleteReportedReview = async (report) => {
        if (!report) return;
        const foundStreet = (streetsRef.current || []).find(s =>
          (report.streetKey && s.streetKey === report.streetKey) ||
          (report.streetName && s.name && s.name.toLowerCase() === String(report.streetName).toLowerCase())
        );
        const existingReview = foundStreet?.reviews?.find(r => String(r.id) === String(report.reviewId));

        const reviewObj = existingReview || {
          id: report.reviewId,
          streetKey: report.streetKey,
          streetName: report.streetName,
          authorId: report.reportedAuthorId,
          user: report.reportedAuthorName,
          comment: report.reportedText,
          latitude: foundStreet?.latitude,
          longitude: foundStreet?.longitude,
          city: foundStreet?.city,
          province: foundStreet?.province,
        };

        const deleted = handleDeleteReview(reviewObj);
        if (deleted !== false) {
          try {
            const firestore = window.db;
            if (firestore && report.id) {
              const serverTimestamp = (window.firebase && window.firebase.firestore && window.firebase.firestore.FieldValue && window.firebase.firestore.FieldValue.serverTimestamp()) || new Date().toISOString();
              await firestore.collection('reports').doc(report.id).update({
                status: 'resolved',
                resolvedAt: serverTimestamp,
              });
            }
          } catch (err) {
            console.error('Errore aggiornamento segnalazione a resolved:', err);
          }
        }
      };

      const handleDismissReport = async (report) => {
        if (!report || !report.id) return;
        const confirmed = window.confirm('Vuoi ignorare e archiviare questa segnalazione senza eliminare la recensione?');
        if (!confirmed) return;

        try {
          const firestore = window.db;
          if (firestore) {
            const serverTimestamp = (window.firebase && window.firebase.firestore && window.firebase.firestore.FieldValue && window.firebase.firestore.FieldValue.serverTimestamp()) || new Date().toISOString();
            await firestore.collection('reports').doc(report.id).update({
              status: 'dismissed',
              dismissedAt: serverTimestamp,
            });
            triggerReportToast('Segnalazione archiviata.');
          }
        } catch (err) {
          console.error('Errore archiviazione segnalazione:', err);
          alert('Errore archiviazione: ' + (err.message || err));
        }
      };

      const handleGoToReportStreet = (report) => {
        if (!report) return;
        setIsAdminReportsOpen(false);
        const foundStreet = (streetsRef.current || []).find(s =>
          (report.streetKey && s.streetKey === report.streetKey) ||
          (report.streetName && s.name && s.name.toLowerCase() === String(report.streetName).toLowerCase())
        );
        if (foundStreet) {
          handleSelectStreet(foundStreet);
        } else if (report.streetName) {
          handleSelectStreet({
            name: report.streetName,
            lat: GEOFENCE.center.lat,
            lng: GEOFENCE.center.lng,
            city: report.streetCity || 'Rimini',
            province: report.streetProvince || 'RN',
          });
        }
      };

      const handleTriggerRecalculateRatings = async () => {
        if (!isAdmin) return;
        const confirmed = window.confirm(
          "Sei sicuro di voler ricalcolare il punteggio di tutte le recensioni storiche su Firestore?\n\n" +
          "La formula applicherà il 40% al voto globale e il 60% alla media delle categorie tecniche (se compilate), " +
          "riallineando poi a cascata tutti i documenti di riepilogo delle strade."
        );
        if (!confirmed) return;

        setIsRecalculatingRatings(true);
        try {
          const res = await window.recalculateAllHistoricalRatings();
          alert(
            `Ricalcolo completato con successo!\n\n` +
            `Recensioni aggiornate: ${res.updatedReviews}\n` +
            `Strade riallineate: ${res.updatedStreets}`
          );
        } catch (err) {
          alert("Errore durante il ricalcolo delle recensioni storiche: " + (err.message || err));
        } finally {
          setIsRecalculatingRatings(false);
        }
      };

      const isSelectedStreetNew = selectedStreet && selectedStreet.reviewsCount === 0;

      return (
        <div className="relative w-screen h-screen overflow-hidden">
          {/* 1. MAPPA INTERATTIVA A TUTTO SCHERMO */}
          <div ref={mapContainerRef} className="w-full h-full z-0" />

          {/* 2. HEADER: LOGO UFFICIALE + BARRA DI RICERCA + WIDGET PROFILO GOOGLE */}
          <div className="absolute top-2 left-2.5 right-2.5 sm:top-4 sm:left-4 sm:right-4 z-30 flex items-start justify-between gap-2 sm:gap-3 pointer-events-none">
            {/* Logo Ufficiale Street Review -> Link alla Landing Page */}
            <a
              href="landing.html"
              title="Street Review · Scopri il progetto e la landing promozionale"
              className="pointer-events-auto shrink-0 flex items-center gap-2 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 p-1 sm:px-2.5 hover:shadow-2xl hover:bg-slate-50/90 active:scale-95 transition-all cursor-pointer select-none no-underline text-slate-800 group"
              style={{ textDecoration: 'none' }}
            >
              <img
                src="assets/logo.jpg"
                alt="Street Review Logo"
                className="h-9 w-9 sm:h-10 sm:w-10 object-contain rounded-xl shadow-sm group-hover:scale-[1.03] transition-transform"
              />
              <span className="font-black text-xs sm:text-sm text-slate-800 tracking-tight hidden lg:inline pr-1 no-underline group-hover:text-blue-600 transition-colors">
                Street Review
              </span>
            </a>

            {/* Barra di ricerca dinamica su scala nazionale + pulsante GPS (Priorità assoluta: flex-1, min-w-0 sul container e input sempre ampio e cliccabile) */}
            <div ref={searchContainerRef} className="flex-1 min-w-0 max-w-lg pointer-events-auto">
              <div
                onClick={() => {
                  setIsUserMenuOpen(false);
                  if (searchInputRef.current) searchInputRef.current.focus();
                }}
                className="relative bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 flex items-center px-2.5 sm:px-4 py-2 transition-all focus-within:shadow-2xl focus-within:ring-2 focus-within:ring-blue-500/30 cursor-text"
              >
                <IconSearch className="text-slate-400 mr-1.5 sm:mr-2.5 shrink-0 pointer-events-none" />
                <input
                  ref={searchInputRef}
                  type="text"
                  value={searchQuery}
                  onChange={(e) => {
                    const val = e.target.value;
                    setSearchQuery(val);
                    setIsSearchFocused(val.trim().length >= 2);
                  }}
                  onFocus={() => {
                    setIsUserMenuOpen(false);

                          </span>
                        );
                      })}
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full border flex items-center gap-1 ${
                        selectedStreet.hasCyclePath ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'
                      }`}>
                        <IconBike size={13} /> {selectedStreet.hasCyclePath ? 'Pista Ciclabile Presente' : 'Nessuna Ciclabile'}
                      </span>

                      {selectedStreet.amenities?.filter(a => a !== 'DOG_WASTE_BINS').map(a => {
                        let label = 'Dotazione';
                        let icon = '✨';
                        let colorCls = 'bg-slate-100 text-slate-700 border-slate-200';

                        if (a === 'EV_CHARGING') { label = 'Colonnine EV'; icon = '⚡'; colorCls = 'bg-emerald-50 text-emerald-800 border-emerald-200'; }
                        else if (a === 'BIKE_RACKS') { label = 'Rastrelliere Bici'; icon = '🚲'; colorCls = 'bg-cyan-50 text-cyan-800 border-cyan-200'; }
                        else if (a === 'SPEED_BUMPS') { label = 'Dossi / Dissuasori'; icon = '⚠️'; colorCls = 'bg-orange-50 text-orange-800 border-orange-200'; }
                        else if (a === 'COBBLESTONE') { label = 'Ciottolato / Sanpietrini'; icon = '🏛️'; colorCls = 'bg-stone-100 text-stone-800 border-stone-300'; }
                        else if (a === 'DRINKING_FOUNTAIN') { label = 'Fontanella'; icon = '🚰'; colorCls = 'bg-sky-50 text-sky-800 border-sky-200'; }
                        else if (a === 'DOG_AREA' || a === 'Area Cani') { label = 'Area Cani'; icon = '🐕'; colorCls = 'bg-lime-100 text-lime-900 border-lime-300 font-extrabold shadow-sm'; }
                        else if (a === 'PLAYGROUND' || a === 'Area Giochi') { label = 'Area Giochi'; icon = '🎠'; colorCls = 'bg-fuchsia-100 text-fuchsia-900 border-fuchsia-300 font-extrabold shadow-sm'; }
                        else if (a === 'BENCHES') { label = 'Panchine'; icon = '🪑'; colorCls = 'bg-amber-50 text-amber-800 border-amber-200'; }
                        else if (a === 'TRASH_BINS') { label = 'Cestini'; icon = '🗑️'; colorCls = 'bg-slate-100 text-slate-800 border-slate-200'; }

                        return (
                          <span key={a} className={`text-xs font-bold px-2.5 py-1 rounded-full border flex items-center gap-1.5 ${colorCls}`}>
                            <span>{icon}</span>
                            <span>{label}</span>
                          </span>

                      })}
                    </div>

                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Spaccato Categorie (13 Parametri)</h4>
                      {(() => {
                        const allCategoryEntries = [
                          ['Manto Stradale', 'roadSurface', selectedStreet.categoryAverages?.roadSurface],
                          ['Segnaletica a terra', 'groundSignage', selectedStreet.categoryAverages?.groundSignage],
                          ['Segnaletica verticale', 'verticalSignage', selectedStreet.categoryAverages?.verticalSignage],
                          ['Quantità parcheggi', 'parkingQuantity', selectedStreet.categoryAverages?.parkingQuantity],
                          ['Qualità marciapiedi', 'sidewalkQuality', selectedStreet.categoryAverages?.sidewalkQuality],
                          ['Illuminazione', 'lighting', selectedStreet.categoryAverages?.lighting],
                          ['Pulizia e Decoro', 'cleanliness', selectedStreet.categoryAverages?.cleanliness],
                          ['Accessibilità', 'accessibility', selectedStreet.categoryAverages?.accessibility],
                          ['Drenaggio Piovano', 'rainDrainage', selectedStreet.categoryAverages?.rainDrainage],
                          ['Ombreggiatura e Verde', 'greeneryShade', selectedStreet.categoryAverages?.greeneryShade],
                          ['Tranquillità e Silenzio', 'quietness', selectedStreet.categoryAverages?.quietness],
                          ['Visibilità Incroci', 'intersectionVisibility', selectedStreet.categoryAverages?.intersectionVisibility],
                          ['Larghezza Carreggiata', 'laneWidth', selectedStreet.categoryAverages?.laneWidth],
                        ];

                        const evaluatedCategories = [];
                        const unratedOrNaCategories = [];

                        allCategoryEntries.forEach(([label, catKey, rawScore]) => {
                          const hasValidScore =
                            rawScore !== null &&
                            rawScore !== undefined &&
                            rawScore !== 'N/A' &&
                            rawScore !== '' &&
                            !isNaN(Number(rawScore)) &&
                            Number(rawScore) > 0;
                          if (hasValidScore) {
                            evaluatedCategories.push({ label, catKey, numScore: Number(rawScore) });
                          } else {
                            unratedOrNaCategories.push({ label, catKey });
                          }
                        });

                        return (
                          <div className="space-y-3 text-xs">
                            {/* IN CIMA: Solo categorie valutate (categoryAverages[cat] !== null) con 5 stelle frazionarie e rating ★ X.X */}
                            {evaluatedCategories.length > 0 ? (
                              <div className="space-y-2.5">
                                {evaluatedCategories.map(({ label, catKey, numScore }) => (
                                  <div key={catKey} className="flex items-center justify-between gap-2">
                                    <span className="font-medium text-slate-700 w-38 sm:w-44 truncate">
                                      {label}
                                    </span>
                                    <div className="flex items-center gap-2 flex-1 justify-end">
                                      <div className="hidden sm:block flex-1 max-w-[110px] h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                        <div
                                          className="h-full bg-blue-600 rounded-full transition-all"
                                          style={{ width: `${(numScore / 5) * 100}%` }}
                                        />
                                      </div>
                                      <div className="flex items-center gap-0.5 select-none shrink-0" aria-label={`${numScore.toFixed(1)} su 5`}>
                                        {[1, 2, 3, 4, 5].map(starIdx => {
                                          const fillPct = Math.max(0, Math.min(100, Math.round((numScore - (starIdx - 1)) * 100)));
                                          return (
                                            <span key={starIdx} className="relative inline-block text-sm leading-none text-slate-200">
                                              ★
                                              {fillPct > 0 && (
                                                <span
                                                  className="absolute inset-y-0 left-0 overflow-hidden text-amber-400"
                                                  style={{ width: `${fillPct}%` }}
                                                >
                                                  ★
                                                </span>
                                              )}
                                            </span>
                                          );
                                        })}
                                      </div>
                                      <span className="font-extrabold text-slate-800 w-10 text-right shrink-0">
                                        ★ {numScore.toFixed(1)}
                                      </span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            ) : (
                              <p className="text-[11px] font-medium text-slate-500 italic">
                                Recensioni Flash pubblicate solo con voto complessivo. Nessun parametro tecnico specifico ancora valutato.
                              </p>
                            )}

                            {/* IN FONDO (Compatto / Neutro): Parametri non applicabili o non ancora valutati (categoryAverages[cat] === null) */}
                            {unratedOrNaCategories.length > 0 && (
                              <div className={`${evaluatedCategories.length > 0 ? 'pt-2.5 border-t border-slate-200/80' : ''}`}>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">
                                  Non applicabili o non valutati ({unratedOrNaCategories.length})
                                </p>
                                <div className="flex flex-wrap gap-1.5">
                                  {unratedOrNaCategories.map(({ label, catKey }) => (
                                    <span
                                      key={catKey}
                                      className="text-[10px] font-semibold text-slate-400 bg-slate-100 border border-slate-200/80 px-2 py-0.5 rounded-full inline-flex items-center gap-1"
                                    >
                                      <span>{label}</span>
                                      <span className="text-[9px] font-bold text-slate-400/80">· N/A</span>
                                    </span>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>

                    {/* CTA: Se l'utente ha già recensito, mostra 'Modifica la tua recensione' + '🗑️ Elimina' */}
                    {(() => {
                      const userExistingReview = currentUser && selectedStreet?.reviews
                        ? selectedStreet.reviews.find(r => r.userId === currentUser.id || r.user === currentUser.name)
                        : null;

                      return userExistingReview ? (
                        <div className="flex gap-2">
                          <button
                            onClick={() => {
                              setEditingReview(userExistingReview);
                              setIsReviewOpen(true);
                            }}
                            className="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 text-sm cursor-pointer transition-all"
                          >
                            ✏️ Modifica la tua recensione
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDeleteReview(userExistingReview)}
                            className="px-4 py-3.5 bg-rose-50 hover:bg-rose-100 active:scale-[0.99] text-rose-700 border border-rose-200 font-bold rounded-2xl flex items-center justify-center gap-1.5 text-sm cursor-pointer transition-all shrink-0"
                            title="Elimina la tua recensione"
                          >
                            <span>🗑️</span>
                            <span>Elimina</span>
                          </button>
                        </div>
                      ) : (
                        <button
                          onClick={() => {
                            setEditingReview(null);
                            if (!currentUser) {
                              setIsAuthOpen(true);
                            } else {
                              setIsReviewOpen(true);
                            }
                          }}
                          className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 text-sm cursor-pointer transition-all"
                        >
                          ✍️ Aggiungi la tua Recensione (+50 XP)
                        </button>
                      );
                    })()}

                    {/* AVVISO OSTACOLI & LIMITI DI SAGOMA (CAMPER / MEZZI INGOMBRANTI) */}
                    {Array.isArray(selectedStreet.roadObstacles) && selectedStreet.roadObstacles.length > 0 && (
                      <div className="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 space-y-2 shadow-xs">
                        <div className="flex items-center gap-2">
                          <span className="text-base leading-none">⚠️</span>
                          <h4 className="text-xs font-black uppercase tracking-wider text-amber-950">
                            Ostacoli &amp; Limiti di Sagoma Segnalati ({selectedStreet.roadObstacles.length})
                          </h4>
                        </div>
                        <p className="text-[11px] text-amber-900 leading-snug">
                          Attenzione per camper, furgoni e mezzi ingombranti: la community segnala le seguenti limitazioni:
                        </p>
                        <div className="flex flex-wrap gap-1.5 pt-0.5">
                          {selectedStreet.roadObstacles.map((obs, idx) => (
                            <span
                              key={idx}
                              className="text-xs font-bold bg-amber-200/90 text-amber-950 border border-amber-400 px-2.5 py-1 rounded-xl shadow-2xs inline-flex items-center gap-1"
                            >
                              {obs}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="text-sm font-bold text-slate-800">
                          Commenti dei Residenti ({selectedStreet.reviewsLoaded ? (selectedStreet.reviews?.length || 0) : (selectedStreet.reviewsCount || selectedStreet.reviews?.length || 0)})
                        </h4>
                        <span className="text-[10px] font-semibold text-slate-400">
                          {isLoadingComments ? '⏳ Caricamento commenti...' : 'Più utili e recenti'}
                        </span>
                      </div>
                      {isLoadingComments && (!selectedStreet.reviews || selectedStreet.reviews.length === 0) ? (
                        <div className="p-6 rounded-2xl bg-slate-50 border border-slate-200 text-center space-y-2 animate-pulse">
                          <div className="text-xl">⏳</div>
                          <p className="text-xs font-bold text-slate-700">Caricamento commenti...</p>
                          <p className="text-[11px] text-slate-400">Recupero delle recensioni della community per {selectedStreet.name}</p>
                        </div>
                      ) : (() => {
                        const rawReviews = selectedStreet.reviews || [];
                        // Ordina i commenti mostrando per primi quelli con più voti "👍 Utile" e, a parità di voti, dal più recente
                        const sortedReviews = [...rawReviews].sort((a, b) => {
                          const helpfulA = Math.max(0, Number(a.helpfulCount ?? (Array.isArray(a.helpfulVoterIds) ? a.helpfulVoterIds.length : 0)) || 0);
                          const helpfulB = Math.max(0, Number(b.helpfulCount ?? (Array.isArray(b.helpfulVoterIds) ? b.helpfulVoterIds.length : 0)) || 0);
                          if (helpfulB !== helpfulA) {
                            return helpfulB - helpfulA;
                          }
                          return parseReviewChronologicalMs(b) - parseReviewChronologicalMs(a);
                        });
                        return sortedReviews.map((r) => {
                          const isMyReview = currentUser && (r.userId === currentUser.id || r.user === currentUser.name);
                          const authorProfile = gamification.getAuthorProfile(r);
                          const lvl = authorProfile.levelInfo;
                          const hasTextComment = isMeaningfulReviewComment(r.comment);
                          const ratingScore = Number(r.overallRating || r.ratingOverall || 0);
                          const helpfulVoterIds = Array.isArray(r.helpfulVoterIds) ? r.helpfulVoterIds.map(String) : [];
                          const helpfulCount = Math.max(0, Number(r.helpfulCount ?? helpfulVoterIds.length) || 0);
                          const hasVotedHelpful = Boolean(currentUser?.id && helpfulVoterIds.includes(String(currentUser.id)));

                          // Perk Livello 6+: Bordo Card Veterano (sottile bordo dorato/ciano luminoso senza testo o badge extra)
                          const isVeteranAuthor = lvl.level >= 6;
                          const veteranCardBorderClass = lvl.level >= 7
                            ? 'border-amber-400/90 ring-1 ring-cyan-400/55 shadow-[0_0_14px_rgba(245,158,11,0.20)] bg-gradient-to-br from-white via-amber-50/20 to-cyan-50/25'
                            : 'border-cyan-400/90 ring-1 ring-amber-300/55 shadow-[0_0_12px_rgba(6,182,212,0.18)] bg-gradient-to-br from-white via-cyan-50/20 to-amber-50/15';

                          return (
                            <div
                              key={r.id}
                              className={`p-3.5 rounded-2xl shadow-xs space-y-2.5 border transition-all ${
                                isMyReview
                                  ? 'border-blue-400 ring-2 ring-blue-50 bg-white'
                                  : isVeteranAuthor
                                  ? veteranCardBorderClass
                                  : lvl.commentHighlightClass
                              }`}
                            >
                              {/* Header Card: Autore e Livello a sinistra, Badge Voto prioritario a destra */}
                              <div className="flex items-center justify-between gap-2.5">
                                <div className="flex items-center gap-2.5 min-w-0">
                                  {/* Avatar con cornice colorata in base al livello */}
                                  <div className="relative shrink-0">
                                    {r.avatarUrl ? (
                                      <img
                                        src={r.avatarUrl}
                                        alt={r.user}
                                        className={`w-8 h-8 rounded-full border-2 object-cover ${lvl.avatarBorderClass}`}
                                        referrerPolicy="no-referrer"
                                      />
                                    ) : (
                                      <div className={`w-8 h-8 rounded-full bg-slate-100 text-slate-800 border-2 flex items-center justify-center text-xs font-black ${lvl.avatarBorderClass}`}>
                                        {r.user ? r.user.charAt(0).toUpperCase() : 'U'}
                                      </div>
                                    )}
                                    <span
                                      className="absolute -bottom-1 -right-1 text-[10px] leading-none bg-white rounded-full px-0.5 shadow-2xs border border-slate-200"
                                      title={`Livello ${lvl.level}`}
                                    >
                                      {lvl.icon}
                                    </span>
                                  </div>

                                  <div className="min-w-0">
                                    <div className="flex flex-wrap items-center gap-1.5">
                                      <span className="font-bold text-slate-900 text-xs truncate max-w-[130px] sm:max-w-[190px]">{r.user}</span>
                                      {isMyReview && (
                                        <span className="text-[10px] font-extrabold bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded-full shrink-0">
                                          Tu
                                        </span>
                                      )}
                                      {/* Badge Livello essenziale (es. Liv. 7) */}
                                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border inline-flex items-center shrink-0 ${lvl.badgeClass}`}>
                                        Liv. {lvl.level}
                                      </span>
                                    </div>
                                    <div className="text-[11px] text-slate-400 mt-0.5 leading-none">
                                      {r.date}
                                    </div>
                                  </div>
                                </div>

                                {/* Badge Voto prioritario e ingrandito in alto a destra con palette semantica e contrasto adattivo */}
                                {ratingScore > 0 && (() => {
                                  const cardBg = getRatingColor(ratingScore);
                                  const cardText = getRatingTextColor(ratingScore);
                                  const cardShadow = cardText === '#FFFFFF' ? '0 1px 2px rgba(0,0,0,0.45)' : 'none';
                                  const cardBorder = cardText === '#FFFFFF' ? 'rgba(255,255,255,0.4)' : 'rgba(15,23,42,0.25)';
                                  return (
                                    <div
                                      className="shrink-0 inline-flex items-center gap-1.5 rounded-xl font-extrabold shadow-sm select-none border"
                                      style={{
                                        fontSize: '1.05rem',
                                        padding: '6px 12px',
                                        backgroundColor: cardBg,
                                        color: cardText,
                                        borderColor: cardBorder,
                                        textShadow: cardShadow
                                      }}
                                      title={`Valutazione: ${ratingScore.toFixed(1)} su 5`}
                                    >
                                      <span style={{ color: cardText }} className="text-lg leading-none select-none">★</span>
                                      <span className="font-extrabold leading-none">{ratingScore.toFixed(1)}</span>
                                    </div>
                                  );
                                })()}
                              </div>

                              {/* Testo del commento (mostrato solo per opinioni reali, nessun placeholder o testo generato) */}
                              {hasTextComment && (
                                <p className="text-xs text-slate-700 leading-relaxed pl-0.5">
                                  "{String(r.comment).trim()}"
                                </p>
                              )}

                              {/* Footer Card: Tratto e Controlli Azione */}
                              <div className="flex flex-wrap items-center justify-between gap-1.5 pt-1 text-xs">
                                <div className="flex flex-wrap items-center gap-1.5 min-w-0">
                                  {r.streetSegment && (
                                    <span
                                      className="text-[10px] font-bold bg-cyan-50 text-cyan-800 border border-cyan-200 px-2 py-0.5 rounded-md inline-flex items-center gap-1 max-w-full truncate"
                                      title={`Tratto o punto di riferimento indicato: ${r.streetSegment}`}
                                    >
                                      <span>📍 Tratto: {r.streetSegment}</span>
                                    </span>
                                  )}
                                </div>

                                <div className="flex flex-wrap items-center gap-1.5 shrink-0 ml-auto">
                                  {/* Pulsante di reazione discreto "👍 Utile (N)" (+10 XP all'autore) */}
                                  <button
                                    type="button"
                                    onClick={() => handleToggleHelpfulReview(r)}
                                    className={`p-1 px-2.5 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all cursor-pointer select-none ${
                                      hasVotedHelpful
                                        ? 'bg-cyan-50 text-cyan-900 border border-cyan-400 ring-1 ring-cyan-300/60 font-extrabold shadow-2xs'
                                        : isMyReview
                                        ? 'bg-slate-50 text-slate-500 border border-slate-200 opacity-85'
                                        : 'bg-white hover:bg-amber-50/80 text-slate-600 hover:text-amber-900 border border-slate-200 hover:border-amber-300'
                                    }`}
                                    title={
                                      isMyReview
                                        ? `La tua recensione ha ricevuto ${helpfulCount} vot${helpfulCount === 1 ? 'o' : 'i'} Utile (+${helpfulCount * 10} XP)`
                                        : hasVotedHelpful
                                        ? 'Hai già votato questa recensione come Utile (clicca per rimuovere il voto)'
                                        : 'Segna questa recensione come Utile (+10 XP al suo autore)'
                                    }
                                  >
                                    <span>👍</span>
                                    <span>Utile ({helpfulCount})</span>
                                  </button>

                                  {isMyReview && (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        setEditingReview(r);
                                        setIsReviewOpen(true);
                                      }}
                                      className="p-1 px-2 text-blue-600 hover:bg-blue-50 border border-blue-200 rounded-lg text-[11px] font-bold flex items-center gap-1 cursor-pointer transition-colors"
                                      title="Modifica la tua recensione"
                                    >
                                      <span>✏️</span> Modifica
                                    </button>
                                  )}
                                  {isMyReview && !isAdmin && (
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteReview(r)}
                                      className="p-1 px-2 text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg text-[11px] font-bold flex items-center gap-1 cursor-pointer transition-colors"
                                      title="Elimina la tua recensione"
                                    >
                                      <span>🗑️</span> Elimina
                                    </button>
                                  )}
                                  {isAdmin && (
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteReview(r)}
                                      className="p-1 px-2 bg-rose-600 hover:bg-rose-700 text-white border border-rose-700 rounded-lg text-[11px] font-bold flex items-center gap-1 cursor-pointer transition-colors shadow-2xs"
                                      title="Elimina recensione come Amministratore e ricalcola medie e XP"
                                    >
                                      <span>🗑️</span> Elimina (Admin)
                                    </button>
                                  )}
                                  {!isMyReview && (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        if (!currentUser) {
                                          setIsAuthOpen(true);
                                          return;
                                        }
                                        setReportingReview({
                                          review: r,
                                          streetKey: selectedStreet.key || selectedStreet.id || selectedStreet.streetKey,
                                          streetName: selectedStreet.name,
                                          streetCity: selectedStreet.city,
                                          streetProvince: selectedStreet.province,
                                          streetLat: selectedStreet.lat || selectedStreet.latitude,
                                          streetLng: selectedStreet.lng || selectedStreet.longitude,
                                        });
                                      }}
                                      className="report-review-btn report-btn p-1 px-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 border border-slate-200 hover:border-rose-200 rounded-lg text-[11px] font-bold flex items-center gap-1 cursor-pointer transition-colors"
                                      title="Segnala questa recensione"
                                    >
                                      <span>🚩</span>
                                      <span>Segnala</span>
                                    </button>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        });
                      })()}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* 6. MODALE RECENSIONE */}
          {isReviewOpen && selectedStreet && (
            <ReviewModal
              streetName={selectedStreet.name}
              currentUser={currentUser}
              initialData={editingReview}
              defaultStreetSegment={prefilledStreetSegment}
              isPioneerCandidate={
                isSelectedStreetNew ||
                Boolean(editingReview && gamification.reviewMetaMap[editingReview.id]?.isPioneer) ||
                (selectedStreet.reviews || []).filter(r => !currentUser || r.userId !== currentUser.id).length === 0
              }
              onClose={() => {
                setIsReviewOpen(false);
                setEditingReview(null);
              }}
              onSubmit={(data) => handleAddReview(data)}
              onDelete={editingReview ? () => handleDeleteReview(editingReview) : null}
              onOpenPrivacy={() => setIsPrivacyOpen(true)}
            />
          )}

          {/* 7. MODALE AUTENTICAZIONE GOOGLE OAUTH 2.0 */}
          <AuthModal
            isOpen={isAuthOpen}
            onClose={() => setIsAuthOpen(false)}
            onLoginSuccess={handleGoogleLogin}
            onOpenPrivacy={() => setIsPrivacyOpen(true)}
          />

          {/* 8. MODALE PROFILO & CLASSIFICA (GAMIFICATION DASHBOARD) */}
          <GamificationModal
            isOpen={isGamificationOpen}
            activeTab={gamificationTab}
            onTabChange={setGamificationTab}
            onClose={() => setIsGamificationOpen(false)}
            currentUser={currentUser}
            userProfile={gamification.currentUserProfile}
            leaderboard={gamification.leaderboard}
            cityLeaderboards={gamification.cityLeaderboards}
            availableCities={gamification.availableCities}
            onSelectFavoriteBadge={handleSelectFavoriteBadge}
            onSharePassport={handleSharePassport}
            onOpenAuth={() => {

                            onClick={() => handleCityFilterChange(cityKey)}
                            className={`px-3 py-1.5 rounded-xl font-extrabold text-xs whitespace-nowrap transition-all cursor-pointer border ${
                              isSelected
                                ? 'bg-amber-500 text-slate-950 border-amber-500 shadow-xs'

                    </div>
                  </div>

                  {/* Header Classifica Attiva */}
