                <IconClose size={20} />
              </button>
            </div>

            {/* Selettore Schede (Tabs) */}
            <div className="px-6 pt-3 bg-slate-50 border-b border-slate-200 flex gap-2">
              <button
                onClick={() => onTabChange('progress')}
                className={`flex-1 py-2.5 px-4 rounded-t-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 border-b-2 transition-all cursor-pointer ${
                  activeTab === 'progress'
                    ? 'bg-white text-blue-600 border-blue-600 shadow-2xs'
                    : 'text-slate-500 border-transparent hover:text-slate-800 hover:bg-white/50'
                }`}
              >
                <span>🎯</span>
                <span>I Miei Progressi</span>
              </button>
              <button
                onClick={() => onTabChange('leaderboard')}
                className={`flex-1 py-2.5 px-4 rounded-t-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 border-b-2 transition-all cursor-pointer ${
                  activeTab === 'leaderboard'
                    ? 'bg-white text-amber-600 border-amber-500 shadow-2xs'
                    : 'text-slate-500 border-transparent hover:text-slate-800 hover:bg-white/50'
                }`}
              >
                <span>🏆</span>
                <span>Classifica (Top Esploratori)</span>
              </button>
            </div>

            {/* Contenuto Scheda */}
            <div className="flex-1 overflow-y-auto p-5 sm:p-6 space-y-5 text-xs bg-slate-50/50">
              {activeTab === 'progress' ? (
                <>
                  {/* Banner Ospite se non loggato */}
                  {!currentUser && (
                    <div className="p-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md">
                      <div className="space-y-0.5 text-center sm:text-left">
                        <p className="font-black text-sm">Modalità Ospite attiva</p>
                        <p className="text-[11px] text-blue-100">Accedi con Google per salvare le tue recensioni, accumulare XP e sbloccare i Badge!</p>
                      </div>
                      <button
                        onClick={onOpenAuth}
                        className="px-4 py-2 bg-white text-blue-700 font-black rounded-xl text-xs shadow-sm hover:bg-blue-50 shrink-0 cursor-pointer"
                      >
                        Accedi Ora
                      </button>
                    </div>
                  )}

                  {/* Card Principale Livello & Barra di Avanzamento */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-xs space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div className="flex items-center gap-3.5">
                        <div className="relative shrink-0">
                          {currentUser?.avatarUrl ? (
                            <img
                              src={currentUser.avatarUrl}
                              alt={userProfile.name}
                              className={`w-16 h-16 rounded-full border-3 object-cover ${lvl.avatarBorderClass}`}
                              referrerPolicy="no-referrer"
                            />
                          ) : (
                            <div className={`w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl border-3 ${lvl.avatarBorderClass}`}>
                              {lvl.icon}
                            </div>
                          )}
                          <span className="absolute -bottom-1 -right-1 bg-slate-900 text-white text-[10px] font-black px-2 py-0.5 rounded-full border border-white">
                            Liv. {lvl.level}
                          </span>
                        </div>
                        <div>
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full border ${lvl.badgeClass}`}>
                              Grado {lvl.tierLabel}
                            </span>
                            <span className="text-xs font-bold text-slate-400">· {userProfile.name}</span>
                          </div>
                          <h4 className="text-lg sm:text-xl font-black text-slate-900 mt-0.5">
                            {lvl.fullTitle}
                          </h4>
                          <p className="text-xs text-slate-500 font-medium">
                            Esperienza totale accumulata: <strong className="text-slate-900">{userProfile.xp} XP</strong>
                          </p>

                      </div>

                      <div className="bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-2.5 text-center shrink-0">
                        <p className="text-[10px] font-bold uppercase text-slate-400">Punti Esperienza</p>
                        <p className="text-2xl font-black text-blue-600">{userProfile.xp} <span className="text-xs">XP</span></p>
                      </div>
                    </div>

                    {/* Progress Bar verso il livello successivo */}
                    <div className="space-y-1.5 pt-1">
                      <div className="flex justify-between items-center text-[11px] font-bold">
                        <span className="text-slate-700">
                          Liv. {lvl.level} ({lvl.minXP} XP)
                        </span>
                        {lvl.nextLevel ? (
                          <span className="text-blue-600">
                            Mancano {lvl.xpToNext} XP per Liv. {lvl.nextLevel.level} ({lvl.nextLevel.fullTitle})
                          </span>
                        ) : (
                          <span className="text-amber-600 font-black">
                            👑 Grado Massimo Raggiunto (1000+ XP)
                          </span>
                        )}
                      </div>
                      <div className="w-full h-3.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/80 p-0.5">
                        <div
                          className={`h-full rounded-full bg-gradient-to-r ${lvl.progressGradient} transition-all duration-500`}
                          style={{ width: `${Math.max(4, lvl.progressPercent)}%` }}
                        />
                      </div>
                      <div className="flex justify-between text-[10px] text-slate-400 font-semibold">
                        <span>Progresso livello: {lvl.progressPercent}%</span>
                        <span>{lvl.nextLevel ? `${userProfile.xp} / ${lvl.nextLevel.minXP} XP` : `${userProfile.xp} XP`}</span>
                      </div>
                    </div>

                    {/* Statistiche Rapide Utente */}
                    <div className="grid grid-cols-3 gap-2.5 pt-1">
                      <div className="bg-slate-50 rounded-2xl p-3 border border-slate-100 text-center">
                        <p className="text-lg font-black text-slate-900">{userProfile.uniqueStreetsCount}</p>
                        <p className="text-[10px] font-bold text-slate-500">🛣️ Vie Recensite</p>
                      </div>
                      <div className="bg-amber-50/60 rounded-2xl p-3 border border-amber-200/60 text-center">
                        <p className="text-lg font-black text-amber-800">{userProfile.pioneerCount}</p>
                        <p className="text-[10px] font-bold text-amber-700">🧭 Vie da Pioniere</p>
                      </div>
                      <div className="bg-blue-50/60 rounded-2xl p-3 border border-blue-200/60 text-center">
                        <p className="text-lg font-black text-blue-800">{userProfile.unlockedBadgesCount}/{GAMIFICATION_BADGES.length}</p>
                        <p className="text-[10px] font-bold text-blue-700">🏅 Badge Sbloccati</p>
                      </div>
                    </div>
                  </div>

                  {/* Regole Guadagno XP */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-2">
                    <h5 className="text-[11px] font-black uppercase tracking-wider text-slate-400">⚡ Come guadagnare Punti Esperienza (XP)</h5>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <div className="p-2.5 rounded-xl bg-blue-50/60 border border-blue-100 flex items-center gap-2.5">
                        <span className="text-base font-black text-blue-600">+50 XP</span>
                        <span className="text-[11px] text-slate-700 font-semibold leading-tight">Per ogni recensione pubblicata</span>
                      </div>
                      <div className="p-2.5 rounded-xl bg-amber-50/70 border border-amber-200/70 flex items-center gap-2.5">
                        <span className="text-base font-black text-amber-600">+30 XP</span>
                        <span className="text-[11px] text-slate-700 font-semibold leading-tight">Bonus <strong>Pioniere</strong> (1° a recensire la via)</span>
                      </div>
                      <div className="p-2.5 rounded-xl bg-emerald-50/70 border border-emerald-200/70 flex items-center gap-2.5">
                        <span className="text-base font-black text-emerald-600">+20 XP</span>
                        <span className="text-[11px] text-slate-700 font-semibold leading-tight">Bonus <strong>Dettaglio</strong> (≥40 car. + tag)</span>
                      </div>
                    </div>
                  </div>

                  {/* Griglia Bacheca dei 6 Badge (Medaglie Sbloccabili) */}
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h5 className="text-sm font-black text-slate-900">🎖️ Bacheca Medaglie &amp; Badge ({userProfile.unlockedBadgesCount}/{GAMIFICATION_BADGES.length})</h5>
                      <span className="text-[11px] text-slate-500 font-semibold">Sbloccati a colori · Bloccati con lucchetto</span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {userProfile.badges.map(badge => {
                        const pct = Math.min(100, Math.round((badge.progress / badge.target) * 100));
                        return (
                          <div
                            key={badge.id}
                            className={`p-3.5 rounded-2xl border transition-all flex items-start gap-3 ${
                              badge.unlocked
                                ? `bg-gradient-to-br ${badge.unlockedCls}`
                                : 'bg-slate-100/90 border-slate-200 text-slate-400 grayscale opacity-75'
                            }`}
                          >
                            <div className={`w-12 h-12 rounded-2xl border flex items-center justify-center text-2xl shrink-0 relative ${
                              badge.unlocked ? badge.iconBgCls : 'bg-slate-200 border-slate-300 text-slate-500'
                            }`}>
                              <span>{badge.icon}</span>
                              {!badge.unlocked && (
                                <span className="absolute -bottom-1 -right-1 text-xs bg-slate-700 text-white rounded-full w-5 h-5 flex items-center justify-center shadow-2xs">
                                  🔒
                                </span>
                              )}
                            </div>
                            <div className="flex-1 min-w-0 space-y-1">
                              <div className="flex items-center justify-between gap-1">
                                <p className={`font-black text-xs truncate ${badge.unlocked ? 'text-slate-900' : 'text-slate-600'}`}>
                                  {badge.name}
                                </p>
                                {badge.unlocked ? (
                                  <span className="text-[10px] font-black bg-emerald-500 text-white px-2 py-0.5 rounded-full shrink-0">
                                    ✓ Sbloccato
                                  </span>
                                ) : (
                                  <span className="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full shrink-0">
                                    🔒 {badge.progress}/{badge.target}
                                  </span>
                                )}
                              </div>
                              <p className={`text-[11px] leading-snug ${badge.unlocked ? 'text-slate-600' : 'text-slate-500'}`}>
                                {badge.description}
                              </p>
                              <div className="w-full h-1.5 bg-white/80 rounded-full overflow-hidden border border-slate-200/60 mt-1">
                                <div
                                  className={`h-full rounded-full ${badge.unlocked ? 'bg-emerald-500' : 'bg-slate-400'}`}
                                  style={{ width: `${pct}%` }}
                                />
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Scala dei 5 Livelli */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200/80 space-y-2.5">
                    <h5 className="text-[11px] font-black uppercase tracking-wider text-slate-400">🗺️ Scala dei 5 Livelli Cittadini</h5>
                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-2">
                      {GAMIFICATION_LEVELS.map(l => {
                        const isCurrent = l.level === lvl.level;
                        const isReached = userProfile.xp >= l.minXP;
                        return (
                          <div
                            key={l.level}
                            className={`p-2.5 rounded-xl border text-center space-y-1 transition-all ${
                              isCurrent
                                ? 'bg-blue-50/80 border-blue-400 ring-2 ring-blue-500/20'
                                : isReached
                                ? 'bg-white border-slate-200'
                                : 'bg-slate-50 border-slate-200/60 opacity-60'
                            }`}
                          >
                            <div className="text-xl">{l.icon}</div>
                            <p className="text-[10px] font-black text-slate-800">Liv. {l.level}</p>
                            <p className="text-[10px] font-bold text-slate-600 leading-tight">{l.title}</p>
                            <p className="text-[9px] font-semibold text-slate-400">
                              {l.nextXP ? `${l.minXP}-${l.maxXP} XP` : '1000+ XP'}
                            </p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </>
              ) : (
                /* SCHEDA 2: CLASSIFICA (TOP 10 ESPLORATORI IN TEMPO REALE DA FIRESTORE) */
                <div className="space-y-4">
                  <div className="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 rounded-3xl p-4 text-white shadow-md flex items-center justify-between">
                    <div className="space-y-0.5">
                      <h4 className="text-base font-black flex items-center gap-2">
                        <span>👑</span> Top 10 Esploratori della Riviera
                      </h4>
                      <p className="text-[11px] text-amber-50">
                        Classifica calcolata in tempo reale dalle recensioni pubblicate su Firestore
                      </p>
                    </div>
                    <div className="bg-white/20 backdrop-blur-xs px-3 py-1.5 rounded-2xl text-right">
                      <p className="text-[10px] uppercase font-bold text-amber-100">Esploratori Attivi</p>
                      <p className="text-lg font-black">{leaderboard.length}</p>
                    </div>
                  </div>

                  {leaderboard.length === 0 ? (
                    <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 space-y-2">
                      <div className="text-3xl">🧭</div>
                      <p className="text-sm font-bold text-slate-800">Nessun esploratore ancora in classifica</p>
                      <p className="text-xs text-slate-500">Pubblica la prima recensione di una strada per conquistare il 1° posto!</p>
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {leaderboard.map((entry) => {
                        const isMe = currentUser && (entry.authorId === currentUser.id || entry.name.toLowerCase() === currentUser.name.toLowerCase());
                        const rankMedal = entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : `#${entry.rank}`;
                        const entryLvl = entry.levelInfo;

                        return (
                          <div
                            key={entry.authorId}
                            className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 transition-all ${
                              isMe
                                ? 'bg-blue-50/70 border-blue-400 ring-2 ring-blue-500/20 shadow-sm'
                                : entry.rank === 1
                                ? 'bg-gradient-to-r from-amber-50/90 via-white to-yellow-50/80 border-amber-300 shadow-xs'
                                : 'bg-white border-slate-200/90 hover:border-slate-300'
                            }`}
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-sm shrink-0 ${
                                entry.rank === 1 ? 'bg-amber-400 text-slate-950 shadow-xs' :
                                entry.rank === 2 ? 'bg-slate-200 text-slate-800' :
                                entry.rank === 3 ? 'bg-amber-700/20 text-amber-900' :
                                'bg-slate-100 text-slate-500 text-xs'
                              }`}>
                                {rankMedal}
                              </div>

                              <div className="relative shrink-0">
                                {entry.avatarUrl ? (
                                  <img
                                    src={entry.avatarUrl}
                                    alt={entry.name}
                                    className={`w-10 h-10 rounded-full border-2 object-cover ${entryLvl.avatarBorderClass}`}
                                    referrerPolicy="no-referrer"
                                  />
                                ) : (
                                  <div className={`w-10 h-10 rounded-full bg-slate-100 text-slate-800 border-2 flex items-center justify-center font-black text-sm ${entryLvl.avatarBorderClass}`}>
                                    {entry.name ? entry.name.charAt(0).toUpperCase() : 'U'}
                                  </div>
                                )}
                                <span className="absolute -bottom-1 -right-1 text-xs bg-white rounded-full px-0.5 shadow-2xs border border-slate-200">
                                  {entryLvl.icon}
                                </span>
                              </div>

                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <p className="font-black text-slate-900 text-xs sm:text-sm truncate">{entry.name}</p>
                                  {isMe && (
                                    <span className="text-[10px] font-extrabold bg-blue-600 text-white px-2 py-0.5 rounded-full">
                                      Tu
                                    </span>
                                  )}
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${entryLvl.badgeClass}`}>
                                    Liv. {entryLvl.level} · {entryLvl.fullTitle}
                                  </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-500 font-semibold mt-0.5">
                                  <span>🛣️ {entry.uniqueStreetsCount} {entry.uniqueStreetsCount === 1 ? 'via' : 'vie'}</span>
                                  {entry.pioneerCount > 0 && (
                                    <span className="text-amber-700 font-bold">· 🧭 {entry.pioneerCount} da Pioniere</span>
                                  )}
                                  <span>· 🏅 {entry.unlockedBadgesCount} badge</span>
                                </div>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="inline-block px-3 py-1 rounded-xl bg-slate-900 text-amber-300 font-black text-xs sm:text-sm shadow-2xs">
                                {entry.xp} XP
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SOTTORAPPRESENTAZIONE MODALE RECENSIONE INTERATTIVA ---
    function ReviewModal({ streetName, currentUser, initialData, isPioneerCandidate, onClose, onSubmit }) {
      const isEditing = Boolean(initialData);
      const defaultRatings = {
        roadSurface: 4, groundSignage: 4, verticalSignage: 4,
        parkingQuantity: 3, sidewalkQuality: 4, lighting: 4,
        cleanliness: 4, accessibility: 4, rainDrainage: 4,
        greeneryShade: 4, quietness: 4, intersectionVisibility: 4,
        laneWidth: 4
      };
      const [ratings, setRatings] = useState(
        initialData?.ratings ? { ...defaultRatings, ...initialData.ratings } : defaultRatings
      );
      const [parkingTypes, setParkingTypes] = useState(initialData?.parkingTypes || ['FREE']);
      const [hasCyclePath, setHasCyclePath] = useState(initialData?.hasCyclePath || false);
      const [amenities, setAmenities] = useState(initialData?.amenities || []);
      const [comment, setComment] = useState(initialData?.comment || '');

      useEffect(() => {
        if (initialData) {
          setRatings({
            ...defaultRatings,
            ...initialData.ratings
          });
          setParkingTypes(initialData.parkingTypes || []);
          setHasCyclePath(initialData.hasCyclePath || false);
          setAmenities(initialData.amenities || []);
          setComment(initialData.comment || '');
        } else {
          setRatings(defaultRatings);
          setParkingTypes(['FREE']);
          setHasCyclePath(false);
          setAmenities([]);
          setComment('');
        }
      }, [initialData]);

      const overall = Number(
        (Object.values(ratings).reduce((a, b) => a + b, 0) / 13).toFixed(1)
      );

      // Calcolo live degli XP che questa recensione assegna
      const liveXP = computeSingleReviewXP(
        { comment, parkingTypes, amenities },
        Boolean(isPioneerCandidate)
      );
      const commentChars = comment.trim().length;

      const handleStarClick = (categoryKey, starVal) => {
        setRatings(prev => ({ ...prev, [categoryKey]: starVal }));
      };

      const toggleParking = (type) => {
        setParkingTypes(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
      };

      const toggleAmenity = (val) => {
        setAmenities(prev => prev.includes(val) ? prev.filter(a => a !== val) : [...prev, val]);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-bold text-slate-900">
                    {isEditing ? 'Modifica la tua recensione' : 'Nuova Recensione'}
                  </h3>
                  {isEditing && (
                    <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                      ✏️ Modifica
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-500">{streetName}</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-black bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-full">
                  ⚡ +{liveXP.totalXP} XP
                </span>
                <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">★ {overall}</span>
                <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 cursor-pointer">
                  <IconClose size={20} />
                </button>
              </div>
            </div>

            {currentUser && (
              <div className="px-6 py-2 bg-blue-50/70 border-b border-blue-100 flex items-center justify-between gap-2 text-xs">
                <div className="flex items-center gap-2 min-w-0">
                  <img
                    src={currentUser.avatarUrl}
                    alt={currentUser.name}
                    className="w-5 h-5 rounded-full border border-blue-400 object-cover shrink-0"
                    referrerPolicy="no-referrer"
                  />
                  <span className="text-slate-600 truncate">
                    Pubblichi come: <strong className="text-slate-900">{currentUser.name}</strong>
                  </span>
                </div>
                <div className="flex items-center gap-1 shrink-0 text-[10px] font-bold">
                  <span className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">+50 Base</span>
                  {liveXP.pioneerXP > 0 && (
                    <span className="bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded">🧭 +30 Pioniere</span>
                  )}
                  {liveXP.detailXP > 0 && (
                    <span className="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">✍️ +20 Dettaglio</span>
                  )}
                </div>
              </div>
            )}

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSubmit({
                  userName: currentUser ? currentUser.name : 'Tu (Cittadino)',
                  ratings,
                  overallRating: overall,
                  comment: comment.trim() || 'Recensione pubblicata con successo.',
                  parkingTypes,
                  hasCyclePath,
                  amenities,
                });
              }}
              className="flex-1 overflow-y-auto px-6 py-4 space-y-4 text-xs"
            >
              <p className="text-slate-500 font-semibold uppercase text-[10px]">Valuta le 13 categorie obbligatorie:</p>

              {[
                ['roadSurface', 'Manto Stradale (asfalto, buche)'],
                ['groundSignage', 'Segnaletica a terra (strisce, stop)'],
                ['verticalSignage', 'Segnaletica verticale (cartelli visibili)'],
                ['parkingQuantity', 'Quantità di parcheggi'],
                ['sidewalkQuality', 'Qualità dei marciapiedi'],
                ['lighting', 'Illuminazione notturna'],
                ['cleanliness', 'Pulizia e decoro urbano'],
                ['accessibility', 'Accessibilità (passeggini / PMR)'],
                ['rainDrainage', 'Drenaggio piovano (caditoie, tombini)'],
                ['greeneryShade', 'Ombreggiatura e verde (alberi, radici)'],
                ['quietness', 'Tranquillità e silenziosità (rumore)'],
                ['intersectionVisibility', 'Visibilità incroci (specchi, visuale)'],
                ['laneWidth', 'Larghezza carreggiata (manovra, spazio)'],
              ].map(([key, label]) => (
                <div key={key} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  <span className="font-semibold text-slate-700 truncate pr-2">{label}</span>
                  <div className="flex gap-1 text-amber-400 select-none">
                    {[1, 2, 3, 4, 5].map(star => (
                      <span
                        key={star}
                        onClick={() => handleStarClick(key, star)}
                        className={`cursor-pointer text-base transition-transform hover:scale-125 ${
                          star <= (ratings[key] || 0) ? 'text-amber-400' : 'text-slate-200'
                        }`}
                      >
                        ★
                      </span>
                    ))}
                  </div>
                </div>
              ))}

              {/* Tag Parcheggi */}
              <div className="space-y-1.5 pt-1">
                <p className="font-semibold text-slate-700">Tipologia parcheggio presente:</p>
                <div className="flex flex-wrap gap-2">
                  {[
                    ['FREE', 'Parcheggio Gratuito', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-blue-600 text-white border-blue-600 shadow-xs'],
                    ['PAID', 'A Pagamento (Blu)', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-blue-600 text-white border-blue-600 shadow-xs'],
                    ['PARKING_DISC', '⏱️ Disco Orario', 'bg-slate-50 text-slate-700 border-slate-200', 'bg-slate-800 text-white border-slate-800 shadow-xs'],
                    ['DISABLED', '♿ Posti Disabili', 'bg-amber-50 text-amber-900 border-amber-300', 'bg-amber-500 text-slate-950 font-black border-amber-600 shadow-xs'],
                    ['PINK', '🌸 Posti Rosa', 'bg-pink-50 text-pink-900 border-pink-300', 'bg-pink-500 text-white font-black border-pink-600 shadow-xs'],
                    ['LOADING_UNLOADING', '🚚 Carico / Scarico', 'bg-orange-50 text-orange-900 border-orange-300', 'bg-orange-500 text-white font-black border-orange-600 shadow-xs'],
                  ].map(([val, name, unselCls, selCls]) => (
                    <button
                      key={val}
                      type="button"
                      onClick={() => toggleParking(val)}
                      className={`px-3 py-1.5 rounded-xl font-bold border transition-all cursor-pointer ${
                        parkingTypes.includes(val) ? selCls : unselCls
                      }`}
                    >
                      {name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Tag Dotazioni e Arredo Urbano */}
              <div className="space-y-1.5 pt-1">
                <p className="font-semibold text-slate-700">Dotazioni e Arredo Urbano (Tag rapidi):</p>
                <div className="flex flex-wrap gap-2">
                  {[
                    ['EV_CHARGING', '⚡ Colonnine EV'],
                    ['BIKE_RACKS', '🚲 Rastrelliere Bici'],
                    ['SPEED_BUMPS', '⚠️ Dossi / Dissuasori'],
                    ['COBBLESTONE', '🏛️ Pavimentazione Speciale'],
                    ['DRINKING_FOUNTAIN', '💧 Fontanella'],
                    ['BENCHES', '🪑 Panchine'],
                    ['TRASH_BINS', '🗑️ Cestini'],
                  ].map(([val, name]) => {
                    const isSelected = amenities.includes(val);
                    return (
                      <button
                        key={val}
                        type="button"
                        onClick={() => toggleAmenity(val)}
                        className={`px-3 py-1.5 rounded-xl font-bold border transition-all cursor-pointer ${
                          isSelected
                            ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {name} {isSelected && '✓'}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Tag Pista Ciclabile */}
              <div className="space-y-1.5">
                <p className="font-semibold text-slate-700">Pista ciclabile presente?</p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setHasCyclePath(true)}
                    className={`flex-1 py-2 rounded-xl font-bold border ${hasCyclePath ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    Sì, presente
                  </button>
                  <button
                    type="button"
                    onClick={() => setHasCyclePath(false)}
                    className={`flex-1 py-2 rounded-xl font-bold border ${!hasCyclePath ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    No, assente
                  </button>
                </div>
              </div>

              {/* Commento Libero con indicatore Bonus Dettaglio (+20 XP) */}
              <div className="space-y-1.5 pt-1">
                <div className="flex items-center justify-between">
                  <label className="font-bold text-slate-700">Commento libero:</label>
                  <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${
                    liveXP.isDetailed
                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                      : 'bg-slate-100 text-slate-500 border-slate-200'
                  }`}>
                    {liveXP.isDetailed
                      ? '✓ Bonus Dettaglio +20 XP attivo!'
                      : `✍️ ${commentChars}/40 car. + 1 tag per +20 XP extra`}
                  </span>
                </div>
                <textarea 
                  value={comment}
                  onChange={(e) => setComment(e.target.value)}
                  rows={3} 
                  placeholder="Aggiungi almeno 40 caratteri utili per i residenti (es. 'Zona tranquilla, marciapiedi larghi ma pochi parcheggi la sera') per ottenere +20 XP extra..."
                  className="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
                />
              </div>

              <button
                type="submit"
                className={`w-full py-3.5 text-white font-bold rounded-2xl shadow-lg active:scale-[0.99] text-sm cursor-pointer transition-all ${
                  isEditing
                    ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/25'
                    : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/25'
                }`}
              >
                {isEditing ? `💾 Aggiorna recensione (+${liveXP.totalXP} XP)` : `Pubblica Recensione (+${liveXP.totalXP} XP)`}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- MODALE AUTENTICAZIONE GOOGLE OAUTH 2.0 ---
    const GOOGLE_CLIENT_ID = "512832291400-m97714l26jqki67cjr9bkmr7cfaibq1b.apps.googleusercontent.com";

    function AuthModal({ isOpen, onClose, onLoginSuccess }) {
      const googleBtnRef = useRef(null);
      const isFileProtocol = window.location.protocol === 'file:';
      const currentOrigin = window.location.origin;

      useEffect(() => {
        if (!isOpen) return;

        // Inizializza Google Identity Services se lo script è pronto
        if (window.google && window.google.accounts && window.google.accounts.id) {
          try {
            window.google.accounts.id.initialize({
              client_id: GOOGLE_CLIENT_ID,
              callback: async (response) => {
                try {
                  if (response && response.credential && window.firebase && window.firebase.auth) {
                    try {
                      const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
                      const userCredential = await firebase.auth().signInWithCredential(credential);
                      const fUser = userCredential.user;
                      console.log("Firebase Auth signInWithCredential riuscito. UID:", fUser.uid);
                      onLoginSuccess({
                        id: fUser.uid,
                        name: fUser.displayName || 'Utente Google',
                        email: fUser.email || '',
                        avatarUrl: fUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
                      });
                      return;
                    } catch (authErr) {
                      console.error("Errore signInWithCredential:", authErr);
                      alert("Attenzione: autenticazione Firebase fallita: " + (authErr.message || authErr) + "\nVerifica che il provider 'Google' sia abilitato nella Firebase Console (Authentication > Sign-in method).");
                      return;
                    }
                  }

                  // Fallback se Firebase Auth non è disponibile
                  const base64Url = response.credential.split('.')[1];
                  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                  const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                  const payload = JSON.parse(jsonPayload);

                  onLoginSuccess({
                    id: payload.sub,
                    name: payload.name,
                    email: payload.email,
                    avatarUrl: payload.picture,
                  });
                } catch (err) {
                  console.error('Errore decodifica credenziale Google', err);
                }
              },
              auto_select: false,
              cancel_on_tap_outside: true,
              ux_mode: 'popup',
            });

            if (googleBtnRef.current && !isFileProtocol) {
              window.google.accounts.id.renderButton(googleBtnRef.current, {
                theme: 'filled_blue',
                size: 'large',
                width: 320,
                text: 'continue_with',
                shape: 'pill',
              });
            }
          } catch (e) {
            console.warn('GIS Init notice', e);
          }
        }
      }, [isOpen, isFileProtocol]);

      const handleGooglePopup = async () => {
        try {
          if (!window.firebase || !window.firebase.auth) {
            alert("SDK Firebase Auth non disponibile.");
            return;
          }
          const provider = new firebase.auth.GoogleAuthProvider();
          const userCredential = await firebase.auth().signInWithPopup(provider);
          const fUser = userCredential.user;
          console.log("Firebase Auth signInWithPopup riuscito. UID:", fUser.uid);
          onLoginSuccess({
            id: fUser.uid,
            name: fUser.displayName || 'Utente Google',
            email: fUser.email || '',
            avatarUrl: fUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
          });
        } catch (err) {
          console.error("Errore Google Popup:", err);
          alert("Errore accesso Google con Firebase: " + (err.message || err));
        }
      };

      const handleDemoLogin = async (demoProfile) => {
        if (window.firebase && window.firebase.auth) {
          try {
            const anon = await firebase.auth().signInAnonymously();
            const fUser = anon.user;
            console.log("Firebase Auth Anonymous SignIn per demo:", fUser.uid);
            onLoginSuccess({
              id: fUser.uid,
              name: demoProfile.name,
              email: demoProfile.email,
              avatarUrl: demoProfile.avatarUrl,
            });
            return;
          } catch (e) {
            console.warn("Anonymous auth non disponibile:", e);
          }
        }
        onLoginSuccess(demoProfile);
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fade-in">
          <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-slide-up relative">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 z-10 cursor-pointer"
            >
              <IconClose size={18} />
            </button>

            <div className="p-6 text-center space-y-4">
              <div className="w-16 h-16 mx-auto bg-white rounded-2xl flex items-center justify-center shadow-lg border border-slate-100 overflow-hidden p-1">
                <img src="assets/logo.jpg" alt="Street Review" className="w-full h-full object-contain rounded-xl" />
              </div>

              <div>
                <h3 className="text-xl font-black text-slate-900">Accedi a Street Review</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Accedi con il tuo account Google per autenticarti su Firebase e pubblicare recensioni.
                </p>
              </div>

              {/* BOX DIAGNOSTICO ORIGIN */}
              {isFileProtocol ? (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-left space-y-1 text-xs">
                  <div className="flex items-center gap-1.5 text-amber-800 font-bold text-[11px]">
                    <span>⚠️ Stai aprendo con file://</span>
                  </div>
                  <p className="text-[10px] text-amber-700 leading-relaxed">
                    Google OAuth rifiuta le richieste con origine <code>null / file://</code> generando l'<strong>Errore 400</strong>.
                  </p>
                  <p className="text-[10px] text-amber-800 font-semibold pt-0.5">
                    👉 Usa l'indirizzo del server locale: <br/>
                    <a href="http://localhost:3000/index_preview.html" className="text-blue-600 underline font-mono text-[11px]">
                      http://localhost:3000/index_preview.html
                    </a>
                  </p>
                </div>
              ) : (
                <div className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-left text-[11px] space-y-1">
                  <div className="flex justify-between items-center text-slate-500">
                    <span>Origine inviata a Google:</span>
                    <code className="font-mono font-bold text-emerald-700 bg-white px-1.5 py-0.5 rounded border border-slate-200">
                      {currentOrigin}
                    </code>
                  </div>
                  <p className="text-[9px] text-slate-400">
                    Verifica che <code>{currentOrigin}</code> sia in "Origini JavaScript autorizzate" su Google Cloud e "Domini autorizzati" su Firebase Console.
                  </p>
                </div>
              )}

              <div className="pt-1 flex flex-col items-center gap-2.5">
                {/* Contenitore pulsante ufficiale Google GIS */}
                {!isFileProtocol && (
                  <div ref={googleBtnRef} className="w-full flex justify-center min-h-[40px]"></div>
                )}

                {/* Pulsante alternativo diretto Popup Firebase Auth */}
                <button
                  onClick={handleGooglePopup}
                  className="w-full py-2.5 px-3 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] rounded-2xl shadow-md text-white font-bold text-xs flex items-center justify-center gap-2.5 transition-all cursor-pointer"
                >
                  <svg className="w-4 h-4 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                  </svg>
                  <span>Accedi con Google (Popup Diretto)</span>
                </button>

                {/* Separatore */}
                <div className="w-full flex items-center gap-2 text-slate-300 text-[10px] my-1">
                  <div className="flex-1 h-px bg-slate-200"></div>
                  <span className="text-slate-400 font-semibold">oppure test rapido</span>
                  <div className="flex-1 h-px bg-slate-200"></div>
                </div>

                {/* Simulatore Google Profile con sessione Firebase */}
                <button
                  onClick={() => handleDemoLogin({
                    id: 'g-resident-101',
                    name: 'Marco Rossi',
                    email: 'marco.rossi.sbt@gmail.com',
                    avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
                  })}
                  className="w-full py-2 px-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-[0.99] rounded-2xl shadow-xs flex items-center justify-center gap-2 text-slate-700 font-bold text-xs transition-all cursor-pointer"
                >
                  <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80" className="w-4 h-4 rounded-full" />
                  <span>Marco Rossi (Demo)</span>
                </button>

                <button
                  onClick={() => handleDemoLogin({
                    id: 'g-resident-102',
                    name: 'Giulia Bianchi',
                    email: 'giulia.bianchi@gmail.com',
                    avatarUrl: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80',
                  })}
                  className="w-full py-2 px-3 bg-slate-50 hover:bg-slate-100 rounded-xl text-slate-600 font-semibold text-[11px] transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" className="w-4 h-4 rounded-full" />
                  <span>Giulia Bianchi (Demo)</span>
                </button>
              </div>

              <div className="text-[10px] text-slate-400 border-t border-slate-100 pt-2.5">
                Modalità Ospite: puoi sempre navigare e consultare i voti delle strade senza effettuare il login.
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
