                setGamificationTab(currentUser ? 'progress' : 'leaderboard');
                setIsGamificationOpen(true);
              }}
              title="Apri Classifica Top Esploratori d'Italia & Bacheca Badge"
              className="flex items-center justify-center gap-1.5 px-2.5 py-2 sm:px-3 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black text-xs rounded-2xl shadow-xl border border-amber-300/80 active:scale-95 transition-all cursor-pointer"
            >
              <span className="text-sm leading-none">🏆</span>
              <span className="hidden lg:inline">Classifica &amp; Badge</span>
              <span className="hidden sm:inline lg:hidden">Classifica</span>
            </button>

            {/* Badge compatto notifiche segnalazioni pendenti su mobile per Admin */}
            {isAdmin && adminReports.length > 0 && (
              <button
                type="button"
                onClick={() => setIsAdminReportsOpen(true)}
                title={`Bacheca Segnalazioni: ${adminReports.length} in attesa`}
                className="md:hidden flex items-center gap-1 px-2.5 py-1.5 bg-red-600 hover:bg-red-700 text-white font-black text-xs rounded-2xl shadow-xl border border-red-400 active:scale-95 transition-all cursor-pointer animate-pulse shrink-0"
              >
                <span>🚩</span>
                <span>{adminReports.length}</span>
              </button>
            )}

            {currentUser ? (
              <div className="flex items-center md:gap-1.5 bg-white/95 backdrop-blur-md rounded-full md:rounded-2xl shadow-xl border border-slate-200 p-0.5 md:p-1 md:pl-1.5 md:pr-2">
                {/* Pillola cliccabile Livello attuale e XP (visibile in linea solo da Desktop >= 768px) */}
                <button
                  type="button"
                  onClick={() => {
                    setIsUserMenuOpen(false);
                    setGamificationTab('progress');
                    setIsGamificationOpen(true);
                  }}
                  title={`${gamification.currentUserProfile.levelInfo.fullTitle} · Clicca per vedere i tuoi progressi e i badge`}
                  className={`hidden md:flex items-center gap-1 px-2.5 py-1 rounded-xl border text-[11px] font-extrabold transition-all active:scale-95 cursor-pointer ${gamification.currentUserProfile.levelInfo.headerPillClass}`}
                >
                  <span>{gamification.currentUserProfile.levelInfo.icon}</span>
                  <span>Liv. {gamification.currentUserProfile.levelInfo.level} • {gamification.currentUserProfile.xp} XP</span>
                </button>

                {/* Avatar utente circolare (Stato Chiuso su Mobile < 768px: solo Avatar con cornice livello e badge 🛡️ nell'angolo se Admin) */}
                <button

                            return profB.levelInfo.level - profA.levelInfo.level;

                          if (profB.xp !== profA.xp) {

                                    )}

                                      className="absolute -bottom-1 -right-1 text-[10px] leading-none bg-white rounded-full px-0.5 shadow-2xs border border-slate-200"

                                      {lvl.icon}

                                  </div>

                                  <div className="min-w-0">
                                    <div className="flex flex-wrap items-center gap-1.5">
                                      <span className="font-bold text-slate-900 truncate">{r.user}</span>
                                      {isMyReview && (
                                        <span className="text-[10px] font-extrabold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">
                                          Tu

                                        <span>{lvl.fullTitle}</span>
                                      </span>
                                    </div>

                                    {/* Bollini di status: Top Esploratore / Pioniere / Dettaglio */}

                                      {isTopLevelHighlight && (

                                          {lvl.level >= 7 ? '👑 Top Esploratore' : lvl.level >= 4 ? '🧭 Esploratore Esperto' : '⭐ Recensore Esperto'}

                                entry.rank === 2 ? 'bg-slate-200 text-slate-800' :
                                entry.rank === 3 ? 'bg-amber-700/20 text-amber-900' :
                                'bg-slate-100 text-slate-500 text-xs'
                              }`}>
                                {rankMedal}
                              </div>

                              <div className="relative shrink-0">
                                {entry.avatarUrl ? (
                                  <img
                                    src={entry.avatarUrl}
                                    alt={entry.name}
                                    className={`w-10 h-10 rounded-full border-2 object-cover ${entryLvl.avatarBorderClass}`}
                                    referrerPolicy="no-referrer"
                                  />
                                ) : (
                                  <div className={`w-10 h-10 rounded-full bg-slate-100 text-slate-800 border-2 flex items-center justify-center font-black text-sm ${entryLvl.avatarBorderClass}`}>
                                    {entry.name ? entry.name.charAt(0).toUpperCase() : 'U'}
                                  </div>
                                )}
                                <span className="absolute -bottom-1 -right-1 text-xs bg-white rounded-full px-0.5 shadow-2xs border border-slate-200">
                                  {entryLvl.icon}
                                </span>
                              </div>

                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <p className="font-black text-slate-900 text-xs sm:text-sm truncate">{entry.name}</p>
                                  {isMe && (
                                    <span className="text-[10px] font-extrabold bg-blue-600 text-white px-2 py-0.5 rounded-full">
                                      Tu
                                    </span>
                                  )}
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${entryLvl.badgeClass}`}>
                                    Liv. {entryLvl.level} · {entryLvl.fullTitle}
                                  </span>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-500 font-semibold mt-0.5">
                                  <span>🛣️ {entry.uniqueStreetsCount} {entry.uniqueStreetsCount === 1 ? 'via' : 'vie'}</span>
                                  {entry.pioneerCount > 0 && (
                                    <span className="text-amber-700 font-bold">· 🧭 {entry.pioneerCount} da Pioniere</span>
                                  )}
                                  <span>· 🏅 {entry.unlockedBadgesCount} badge</span>
                                </div>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="inline-block px-3 py-1 rounded-xl bg-slate-900 text-amber-300 font-black text-xs sm:text-sm shadow-2xs">
                                {entry.xp} XP
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SOTTORAPPRESENTAZIONE MODALE RECENSIONE INTERATTIVA ---
    function ReviewModal({ streetName, currentUser, initialData, defaultStreetSegment = '', isPioneerCandidate, onClose, onSubmit, onDelete, onOpenPrivacy }) {
      const isEditing = Boolean(initialData);

      // Risoluzione iniziale tipologia strada (priorità: dato salvato in precedenza, altrimenti rilevamento da nome via)
      const resolveInitialStreetType = () => {
        if (initialData?.streetType) {
          return normalizeStreetTypeLabel(initialData.streetType) || detectStreetTypeFromStreetName(streetName);
        }
        return detectStreetTypeFromStreetName(streetName);
      };

      const [streetType, setStreetType] = useState(resolveInitialStreetType);

      // Voto complessivo Google Places style (1 a 5)
      const [overallRating, setOverallRating] = useState(() => {
        if (initialData) {
          const old = getSingleReviewOverallScore(initialData);
          if (old >= 1 && old <= 5) return Math.round(old);
        }
        return 0;
      });
      const [hoverRating, setHoverRating] = useState(0);

      // Accordion parametri tecnici e tracciamento compilazione Flash vs Approfondita
      const [isAccordionOpen, setIsAccordionOpen] = useState(false);
      const [hasTouchedTechnical, setHasTouchedTechnical] = useState(Boolean(initialData));

      // Generazione ratings tecnici iniziali
      const buildRatingsState = (currentType) => {
        const base = {
          roadSurface: 4, groundSignage: 4, verticalSignage: 4,
          parkingQuantity: 3, sidewalkQuality: 4, lighting: 4,
          cleanliness: 4, accessibility: 4, rainDrainage: 4,
          greeneryShade: 4, quietness: 4, intersectionVisibility: 4,
          laneWidth: 4
        };
        if (initialData?.ratings) {
          const res = {};
          TECHNICAL_CATEGORIES.forEach(cat => {
            const v = initialData.ratings[cat.key];
            if (v === null || v === undefined || v === 'N/A' || v === '') {
              res[cat.key] = null;
            } else {
              const num = Number(v);
              res[cat.key] = (!isNaN(num) && num >= 1 && num <= 5) ? num : null;
            }
          });
          return res;
        }
        // Pre-impostazione intelligente N/A per nuova recensione
        const incompatible = getIncompatibleKeysForStreetType(currentType);
        incompatible.forEach(k => {
          base[k] = null;
        });
        return base;
      };

      const [ratings, setRatings] = useState(() => buildRatingsState(streetType));
      const [parkingTypes, setParkingTypes] = useState(initialData?.parkingTypes || ['FREE']);
      const [hasCyclePath, setHasCyclePath] = useState(initialData?.hasCyclePath || false);
      const [amenities, setAmenities] = useState(initialData?.amenities || []);
      const [streetSegment, setStreetSegment] = useState(initialData?.streetSegment || '');
      const [comment, setComment] = useState(initialData?.comment || '');
      const [moderationError, setModerationError] = useState('');
      const [isCheckingModeration, setIsCheckingModeration] = useState(false);

      useEffect(() => {
        setModerationError('');
        setIsCheckingModeration(false);
        if (initialData) {
          const loadedType = resolveInitialStreetType();
          setStreetType(loadedType);
          const old = getSingleReviewOverallScore(initialData);
          setOverallRating(old >= 1 && old <= 5 ? Math.round(old) : 0);
          setRatings(buildRatingsState(loadedType));
          setHasTouchedTechnical(true);
          setParkingTypes(initialData.parkingTypes || []);
          setHasCyclePath(initialData.hasCyclePath || false);
          setAmenities(initialData.amenities || []);
          setStreetSegment(initialData.streetSegment || '');
          setComment(initialData.comment || '');
        } else {
          const autoType = detectStreetTypeFromStreetName(streetName);
          setStreetType(autoType);
          setOverallRating(0);
          setRatings(buildRatingsState(autoType));
          setHasTouchedTechnical(false);
          setIsAccordionOpen(false);
          setParkingTypes(['FREE']);
          setHasCyclePath(false);
          setAmenities([]);
          setStreetSegment('');
          setComment('');
        }
      }, [initialData, streetName]);

      // Cambio tipologia con aggiornamento intelligente dei suggerimenti N/A
      const handleSelectStreetType = (newType) => {
        setStreetType(newType);
        const incompatible = getIncompatibleKeysForStreetType(newType);
        setRatings(prev => {
          const next = { ...prev };
          incompatible.forEach(k => {
            next[k] = null;
          });
          // Se torna su Urbana e non stiamo modificando una recensione vecchia che aveva voti nulli, ripristina a 4
          if (newType === '🏡 Urbana' && !initialData?.ratings) {
            ['sidewalkQuality', 'accessibility', 'laneWidth', 'parkingQuantity'].forEach(k => {
              if (next[k] === null) next[k] = 4;
            });
          }
          return next;
        });
      };

      // Toggle pulsante N/A per parametro tecnico
      const toggleNA = (catKey) => {
        setHasTouchedTechnical(true);
        setRatings(prev => {
          const isNA = prev[catKey] === null || prev[catKey] === undefined || prev[catKey] === 'N/A';
          return {
            ...prev,
            [catKey]: isNA ? 4 : null,
          };
        });
      };

      // Click stella categoria tecnica
      const handleCategoryStarClick = (catKey, starVal) => {
        setHasTouchedTechnical(true);
        setRatings(prev => ({
          ...prev,
          [catKey]: starVal,
        }));
      };

      const toggleParking = (type) => {
        setParkingTypes(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
      };

      const toggleAmenity = (val) => {
        setAmenities(prev => prev.includes(val) ? prev.filter(a => a !== val) : [...prev, val]);
      };

      // Calcolo live degli XP guadagnati
      const liveXP = computeSingleReviewXP(
        { comment, parkingTypes, amenities },
        Boolean(isPioneerCandidate)
      );
      const commentChars = comment.trim().length;

      const handleFormSubmit = async (e) => {
        if (e) e.preventDefault();
        if (isCheckingModeration) return;
        if (overallRating === 0) {
          setModerationError('Seleziona un voto a stelle complessivo (da 1 a 5) prima di pubblicare.');
          return;
        }
        const finalComment = comment.trim() || 'Esperienza complessiva registrata.';
        const finalSegment = streetSegment.trim().slice(0, 60);
        const textToCheck = `${finalSegment} ${finalComment}`.trim();

        // 1. Controllo sincrono locale rapido
        const check = validateReviewComment(textToCheck);
        if (!check.valid) {
          setModerationError(check.message);
          return;
        }
        setModerationError('');

        // 2. Moderazione AI multilingua in tempo reale (Google Gemini 2.0 Flash / 1.5 Flash)
        setIsCheckingModeration(true);
        try {
          const aiResult = await moderateWithGemini(textToCheck);
          if (aiResult && aiResult.allowed === false) {
            const errorMsg = "Recensione non ammessa: " + (aiResult.reason || "il testo viola le linee guida della community.");
            setModerationError(errorMsg);
            alert(errorMsg);
            setIsCheckingModeration(false);
            return;
          }

          // Se è una recensione Flash (accordion mai aperto e nessun parametro tecnico toccato), salva null per tutte le categorie tecniche
          const finalRatings = {};
          const includeTechnical = isEditing || isAccordionOpen || hasTouchedTechnical;
          TECHNICAL_CATEGORIES.forEach(cat => {
            if (!includeTechnical) {
              finalRatings[cat.key] = null;
            } else {
              const v = ratings[cat.key];
              const num = (v === null || v === undefined || v === 'N/A' || v === '') ? NaN : Number(v);
              finalRatings[cat.key] = (!isNaN(num) && num >= 1 && num <= 5) ? num : null;
            }
          });

          await onSubmit({
            userName: currentUser ? currentUser.name : 'Tu (Cittadino)',
            streetType: streetType,
            overallRating: overallRating,
            ratings: finalRatings,
            comment: finalComment,
            streetSegment: finalSegment,
            parkingTypes: parkingTypes,
            hasCyclePath: hasCyclePath,
            amenities: amenities,
          });
        } catch (err) {
          console.warn('[ReviewModal] Moderazione AI o invio recensione:', err);
        } finally {
          setIsCheckingModeration(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
            {/* Header Modale */}
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-bold text-slate-900">
                    {isEditing ? 'Modifica la tua recensione' : 'Nuova Recensione'}
                  </h3>
                  {isEditing && (
                    <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                      ✏️ Modifica
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-500 font-medium truncate max-w-[260px]">{streetName}</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-black bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-full">
                  ⚡ +{liveXP.totalXP} XP
                </span>
                <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">
                  ★ {overallRating > 0 ? overallRating : '-'}
                </span>
                <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 cursor-pointer">
                  <IconClose size={20} />
                </button>
              </div>
            </div>

            {currentUser && (
              <div className="px-6 py-2 bg-blue-50/70 border-b border-blue-100 flex items-center justify-between gap-2 text-xs">
                <div className="flex items-center gap-2 min-w-0">
                  <img
                    src={currentUser.avatarUrl}
                    alt={currentUser.name}
                    className="w-5 h-5 rounded-full border border-blue-400 object-cover shrink-0"
                    referrerPolicy="no-referrer"
                  />
                  <span className="text-slate-600 truncate">
                    Pubblichi come: <strong className="text-slate-900">{currentUser.name}</strong>
                  </span>
                </div>
                <div className="flex items-center gap-1 shrink-0 text-[10px] font-bold">
                  <span className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">+50 Base</span>
                  {liveXP.pioneerXP > 0 && (
                    <span className="bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded">🧭 +30 Pioniere</span>
                  )}
                  {liveXP.detailXP > 0 && (
                    <span className="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">✍️ +20 Dettaglio</span>
                  )}
                </div>
              </div>
            )}

            <form
              onSubmit={handleFormSubmit}
              className="flex-1 overflow-y-auto px-6 py-4 space-y-4 text-xs"
            >
              {/* 1. SELETTORE RAPIDO "TIPOLOGIA STRADA" (In cima al modulo) */}
              <div className="space-y-1.5 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <div className="flex items-center justify-between">
                  <label className="font-extrabold text-slate-800 flex items-center gap-1.5">
                    <span>🛣️ Tipologia Strada:</span>
                  </label>
                  <span className="text-[10px] text-slate-400 font-semibold">Tocca per cambiare</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {STREET_TYPES.map((type) => {
                    const isSelected = streetType === type;
                    return (
                      <button
                        key={type}
                        type="button"
                        onClick={() => handleSelectStreetType(type)}
                        className={`px-3 py-1.5 rounded-xl font-bold text-xs border transition-all cursor-pointer ${
                          isSelected
                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm scale-[1.02]'
                            : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-200'
                        }`}
                      >
                        {type} {isSelected && '✓'}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 2. SEZIONE VOTO OVERALL (STILE GOOGLE PLACES - COMPILAZIONE FLASH IN 15S) */}
              <div className="bg-gradient-to-b from-amber-50/70 via-amber-50/20 to-slate-50 p-4 rounded-3xl border border-amber-200/80 shadow-xs space-y-3.5">
                <div className="text-center space-y-1">
                  <label className="text-xs font-black uppercase tracking-wider text-slate-700">
                    VALUTAZIONE COMPLESSIVA DELLA STRADA
                  </label>
                  {overallRating > 0 && (
                    <p className="text-[11px] font-semibold text-slate-500">
                      {overallRating === 1
                        ? '⭐ 1/5 - Molto negativa'
                        : overallRating === 2
                        ? '⭐⭐ 2/5 - Negativa'
                        : overallRating === 3
                        ? '⭐⭐⭐ 3/5 - Nella media'
                        : overallRating === 4
                        ? '⭐⭐⭐⭐ 4/5 - Buona'
                        : '⭐⭐⭐⭐⭐ 5/5 - Eccellente'}
                    </p>
                  )}
                </div>

                {/* 5 Grandi Stelle Dorate al centro */}
                <div className="flex justify-center items-center gap-2 py-1 select-none">
                  {[1, 2, 3, 4, 5].map((star) => (
                    <button
                      key={star}
                      type="button"
                      onClick={() => {
                        setOverallRating(star);
                        if (moderationError) setModerationError('');
                      }}
                      onMouseEnter={() => setHoverRating(star)}
                      onMouseLeave={() => setHoverRating(0)}
                      className="p-1 cursor-pointer transition-transform hover:scale-125 active:scale-95 focus:outline-none"
                      title={`Vota ${star} stella${star > 1 ? 'e' : ''}`}
                    >
                      <span
                        className={`text-4xl sm:text-5xl transition-colors ${
                          star <= (hoverRating || overallRating)
                            ? 'text-amber-400 drop-shadow-sm'
                            : 'text-slate-200 hover:text-amber-200'
                        }`}
                      >
                        ★
                      </span>
                    </button>
                  ))}
                </div>

                {/* Campo Commento Essenziale */}
                <div className="space-y-1.5 pt-1">
                  <div className="flex items-center justify-between text-[11px]">
                    <label className="font-bold text-slate-700">La tua opinione:</label>
                    <span
                      className={`font-extrabold px-2 py-0.5 rounded-full border text-[10px] ${
                        liveXP.isDetailed
                          ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                          : 'bg-slate-100 text-slate-500 border-slate-200'
                      }`}
                    >
                      {liveXP.isDetailed
                        ? '✓ Bonus Dettaglio +20 XP attivo!'
                        : `✍️ ${commentChars}/40 car. + 1 tag per +20 XP extra`}
                    </span>
                  </div>
                  <textarea
                    value={comment}
                    onChange={(e) => {
                      setComment(e.target.value);
                      if (moderationError) setModerationError('');
                    }}
                    rows={3}
                    placeholder="Condividi ciò che pensi di questa strada..."
                    className={`w-full p-3 rounded-2xl bg-white border focus:outline-none focus:ring-2 text-xs text-slate-800 font-medium placeholder-slate-400 ${
                      moderationError
                        ? 'border-rose-400 focus:ring-rose-500 bg-rose-50/30'
                        : 'border-slate-200 focus:ring-blue-500'
                    }`}
                  />
                  {moderationError && (
                    <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-[11px] font-semibold flex items-start gap-1.5 animate-fade-in">
                      <span className="text-sm leading-none shrink-0 mt-0.5">🛡️</span>
                      <span>{moderationError}</span>
                    </div>
                  )}
                </div>

                {/* Pulsante primario chiaro ad alto contrasto: "Pubblica" */}
                <div className="pt-1">
                  <button
                    type="submit"
                    disabled={overallRating === 0 || isCheckingModeration}
                    className={`w-full py-3.5 px-4 font-black rounded-2xl text-sm transition-all flex items-center justify-center gap-2 shadow-lg ${
                      overallRating === 0 || isCheckingModeration
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'
                        : isEditing
                        ? 'bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white shadow-indigo-500/25 cursor-pointer'
                        : 'bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white shadow-blue-500/25 cursor-pointer'
                    }`}
                  >
                    {isCheckingModeration ? (
                      <span className="flex items-center gap-2">
                        <span className="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        <span>Verifica in corso...</span>
                      </span>
                    ) : (
                      <span>Pubblica</span>
                    )}
                  </button>
                </div>
              </div>

              {/* 3. SEZIONE A FISARMONICA "APPROFONDISCI PARAMETRI TECNICI" */}
              <div className="border-2 border-sky-200/90 hover:border-sky-300 rounded-3xl overflow-hidden bg-white shadow-md shadow-sky-950/5 transition-all">
                <button
                  type="button"
                  onClick={() => {
                    setIsAccordionOpen(!isAccordionOpen);
                    setHasTouchedTechnical(true);
                  }}
                  style={{ padding: '14px 18px' }}
                  className="w-full bg-gradient-to-r from-sky-50/80 via-blue-50/40 to-slate-50 hover:from-sky-100/80 hover:to-blue-50/70 flex items-center justify-between text-slate-800 transition-all cursor-pointer select-none"
                >
                  <span className="flex items-center gap-2.5 text-[15px] font-semibold tracking-tight text-slate-900">
                    <span className="w-6 h-6 rounded-full bg-sky-100 border border-sky-300 flex items-center justify-center text-xs text-sky-700 font-black shrink-0">
                      {isAccordionOpen ? '▲' : '▼'}
                    </span>
                    <span>Approfondisci parametri tecnici</span>
                  </span>
                  <span className="text-[11px] font-extrabold text-amber-900 bg-amber-100 border border-amber-300 px-2.5 py-0.5 rounded-full shrink-0 shadow-2xs">
                    ⚡ Extra XP
                  </span>
                </button>

                {isAccordionOpen && (
                  <div className="p-4 space-y-4 border-t border-slate-100 animate-slide-up">
                    {/* Tratto o punto di riferimento facoltativo */}
                    <div className="flex items-center gap-2 bg-slate-50 px-3.5 py-2.5 rounded-2xl border border-slate-200 text-xs focus-within:border-sky-400 focus-within:bg-white transition-all">
                      <span className="shrink-0 text-slate-700 font-bold">📍 Tratto (opzionale):</span>
                      <input
                        type="text"
                        maxLength={60}
                        value={streetSegment}
                        onChange={(e) => setStreetSegment(e.target.value.slice(0, 60))}
                        placeholder="Es. Civico 12, incrocio, tratto nord..."
                        className="flex-1 bg-transparent border-0 focus:outline-none text-slate-800 placeholder-slate-400 text-xs font-medium"
                      />
                      <span className="text-[10px] text-slate-400 font-semibold">{streetSegment.length}/60</span>
                    </div>

                    <div className="space-y-1">
                      <p className="text-[11px] font-semibold text-slate-600">
                        Valuta i singoli parametri tecnici o usa il toggle <strong className="text-slate-800">[N/A]</strong> per quelli non applicabili:
                      </p>
                    </div>

                    {/* Voti a stelle con pulsante [N/A] accanto a ciascuna voce */}
                    <div className="space-y-2">
                      {TECHNICAL_CATEGORIES.map(({ key, label, icon }) => {
                        const val = ratings[key];
                        const isNA = val === null || val === undefined || val === 'N/A';
                        return (
                          <div
                            key={key}
                            className={`flex items-center justify-between p-2.5 rounded-xl border transition-colors ${
                              isNA ? 'bg-slate-50/70 border-slate-200 text-slate-400' : 'bg-white border-slate-200 text-slate-800'
                            }`}
                          >
                            <div className="flex items-center gap-1.5 min-w-0 pr-2">
                              <span className="text-sm shrink-0">{icon}</span>
                              <span className={`text-xs font-semibold truncate ${isNA ? 'text-slate-400 line-through decoration-slate-300' : 'text-slate-700'}`}>
                                {label}
                              </span>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                              <div className="flex gap-0.5 select-none">
                                {[1, 2, 3, 4, 5].map((star) => (
                                  <button
                                    key={star}
                                    type="button"
                                    onClick={() => handleCategoryStarClick(key, star)}
                                    className="p-0.5 cursor-pointer transition-transform hover:scale-125 focus:outline-none"
                                    title={`${label}: ${star} stelle`}
                                  >
                                    <span
                                      className={`text-base ${
                                        !isNA && star <= (val || 0)
                                          ? 'text-amber-400'
                                          : 'text-slate-200 hover:text-amber-300'
                                      }`}
                                    >
                                      ★
                                    </span>
                                  </button>
                                ))}
                              </div>

                              <button
                                type="button"
                                onClick={() => toggleNA(key)}
                                className={`px-2 py-1 rounded-lg text-[10px] font-black cursor-pointer transition-all ${
                                  isNA
                                    ? 'bg-slate-700 text-white shadow-xs'
                                    : 'bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200'
                                }`}

    function ReportModal({ reportData, onClose, currentUser, onReportSuccess }) {
      const REPORT_REASONS = [
        '👤 Violazione Privacy / Doxxing residenti',
        '🤬 Linguaggio volgare, offensivo o sessuale',
        '⚠️ Calunnia, reati o diffamazione',

      const [reason, setReason] = useState(REPORT_REASONS[0]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (reportData) {
          setReason(REPORT_REASONS[0]);
          setIsSubmitting(false);
        }
      }, [reportData]);

      if (!reportData || !reportData.review) return null;

      const { review, streetKey, streetName, streetCity, streetProvince } = reportData;
      const locationStr = `${streetName || 'Via'}${streetCity ? ` (${streetCity}${streetProvince ? ` - ${streetProvince}` : ''})` : ''}`;
      const subject = `Segnalazione Recensione - ${streetName || 'Strada'}`;
      const mailtoHref = `mailto:streetreview.app@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(
        `Segnalazione Recensione su Street Review\n` +
        `-----------------------------------------\n` +
        `Strada: ${locationStr}\n` +
        `Motivo: ${reason}\n` +
        `ID Recensione: ${review.id || 'N/D'}\n` +
        `Autore Segnalato: ${review.user || review.userName || 'Utente'} (ID: ${review.authorId || review.userId || 'N/D'})\n` +
        `Testo Segnalato: "${review.comment || ''}"\n` +
        `-----------------------------------------\n` +
        `Segnalato da: ${currentUser?.email || 'N/D'} (ID: ${currentUser?.id || 'N/D'})`
      )}`;

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (isSubmitting) return;

        setIsSubmitting(true);
        try {
          const firestore = window.db;
          if (!firestore) {
            alert("Database Firestore non disponibile. Verifica la connessione a internet.");
            setIsSubmitting(false);
            return;
          }

          const serverTimestamp = (window.firebase && window.firebase.firestore && window.firebase.firestore.FieldValue && window.firebase.firestore.FieldValue.serverTimestamp()) || new Date().toISOString();

          const payload = {
            reviewId: String(review.id || '').trim(),
            streetKey: String(streetKey || review.streetKey || '').trim(),
            streetName: String(streetName || review.streetName || '').trim(),
            streetCity: String(streetCity || review.streetCity || '').trim(),
            streetProvince: String(streetProvince || review.streetProvince || '').trim(),
            reportedAuthorId: String(review.authorId || review.userId || '').trim(),
            reportedAuthorName: String(review.user || review.userName || 'Utente').trim(),
            reportedText: String(review.comment || '').trim(),
            reason: reason,
            reporterId: String(currentUser?.id || currentUser?.uid || '').trim(),
            reporterEmail: String(currentUser?.email || '').trim(),
            createdAt: serverTimestamp,
            status: 'pending',
          };

          await firestore.collection('reports').add(payload);
          if (onReportSuccess) {
            onReportSuccess();
          }
          onClose();
        } catch (err) {
          console.error("Errore salvataggio segnalazione su Firestore:", err);
          alert("Impossibile inviare la segnalazione: " + (err.message || err));
          setIsSubmitting(false);
        }
      };

                <div className="space-y-1.5">
                  {REPORT_REASONS.map((opt) => {
                    const isSelected = reason === opt;
                    return (
                      <label
                        key={opt}
                        className={`flex items-center gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-all ${
                          isSelected
                            ? 'bg-rose-50/80 border-rose-300 text-rose-950 font-bold shadow-2xs'
                            : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                        }`}
                      >
                        <input
                          type="radio"
                          name="reportReasonOption"
                          value={opt}
                          checked={isSelected}
                          onChange={() => setReason(opt)}
                          className="accent-rose-600"
                        />
                        <span className="text-xs">{opt}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* Opzione Notifica Mail Diretta */}
              <div className="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-2 text-[11px] text-slate-600">
                <span>Notifica immediata via mail:</span>
                <a
                  href={mailtoHref}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-rose-600 font-bold hover:underline shrink-0 flex items-center gap-1"
                >
                  <span>✉️ Apri client mail</span>
                </a>
              </div>

              {/* Bottoni Azione */}
              <div className="flex items-center gap-2.5 pt-1">
                <button
                  type="button"
                  onClick={onClose}
                  disabled={isSubmitting}
                  className="flex-1 py-2.5 rounded-2xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"
                >
                  Annulla
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="flex-1 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-center shadow-lg shadow-rose-500/25 cursor-pointer transition-all disabled:opacity-50 flex items-center justify-center gap-1.5"
                >
                  {isSubmitting ? (
                    <span>Invio in corso...</span>
                  ) : (
                    <>
                      <span>🚩</span>
                      <span>Invia segnalazione</span>
                    </>
                  )}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODALE BACHECA SEGNALAZIONI (PANNELLO MODERAZIONE ADMIN) ---
    function AdminReportsModal({ isOpen, onClose, reports, onGoToStreet, onDeleteReview, onDismissReport }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
          <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-slide-up border border-slate-100 flex flex-col max-h-[90vh]">
            {/* Header */}
            <div className="px-6 py-4 bg-gradient-to-r from-rose-900 via-slate-900 to-slate-900 text-white flex items-center justify-between shrink-0 border-b border-rose-950">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-rose-500/20 border border-rose-400/40 flex items-center justify-center text-xl shrink-0">
                  🛡️
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="font-black text-sm sm:text-base">Bacheca Segnalazioni</h3>
                    <span className="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-black tracking-wide">
                      ADMIN
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300">
                    {reports && reports.length > 0
                      ? `${reports.length} recensioni in attesa di moderazione`
                      : 'Nessuna segnalazione pendente'}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 text-slate-400 hover:text-white rounded-full hover:bg-white/10 cursor-pointer transition-colors"
              >
                <IconClose size={18} />
              </button>
            </div>

            {/* List */}
            <div className="p-4 sm:p-6 overflow-y-auto space-y-3.5 flex-1 bg-slate-50/60">
              {(!reports || reports.length === 0) ? (
                <div className="p-10 text-center space-y-3 bg-white rounded-2xl border border-slate-200">
                  <div className="text-4xl">🎉</div>
                  <h4 className="font-extrabold text-slate-800 text-sm">Nessuna segnalazione pendente</h4>
                  <p className="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">
                    Tutte le recensioni segnalate sono state revisionate. La community di Street Review è in ordine!
                  </p>
                </div>
              ) : (
                reports.map((rep) => {
                  return (
                    <div
                      key={rep.id}
                      className="p-4 bg-white rounded-2xl border border-slate-200/90 shadow-sm space-y-3 transition-all hover:border-slate-300"
                    >
                      {/* Top Bar item */}
                      <div className="flex flex-wrap items-start justify-between gap-2 border-b border-slate-100 pb-2.5">
                        <div className="min-w-0">
                          <h4 className="text-xs font-black text-slate-900 flex items-center gap-1.5">
                            <span>📍</span>
                            <span className="truncate">{rep.streetName || 'Via sconosciuta'}</span>
                            {rep.streetCity && (
                              <span className="text-[11px] font-semibold text-slate-500">
                                ({rep.streetCity}{rep.streetProvince ? ` - ${rep.streetProvince}` : ''})
                              </span>
                            )}
                          </h4>
                          <p className="text-[10px] text-slate-400 font-semibold mt-0.5">
                            Segnalato da: <span className="text-slate-600 font-bold">{rep.reporterEmail || 'Utente'}</span>
                          </p>
                        </div>
                        <span className="px-2.5 py-1 rounded-xl bg-rose-50 text-rose-800 border border-rose-200 text-[10px] font-extrabold shrink-0">
                          {rep.reason || 'Segnalazione Generica'}
                        </span>
                      </div>

                      {/* Recensione incriminata */}
                      <div className="p-3 bg-slate-50 rounded-xl border border-slate-200/70 space-y-1">
                        <div className="flex items-center justify-between text-[10px] text-slate-500 font-bold">
                          <span>Autore commento: <strong className="text-slate-800">{rep.reportedAuthorName || 'Anonimo'}</strong></span>
                          <span>ID: <code className="text-[9px] bg-slate-200 px-1 py-0.5 rounded">{rep.reviewId}</code></span>
                        </div>
                        <p className="text-xs text-slate-800 italic leading-relaxed pt-1">
                          "{rep.reportedText}"
                        </p>
                      </div>

                      {/* Action buttons */}
                      <div className="flex flex-wrap items-center justify-end gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => onGoToStreet(rep)}
                          className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Centra la mappa e visualizza la scheda della via"
                        >
                          <span>📍</span>
                          <span>Vai alla Via</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteReview(rep)}
                          className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl border border-rose-700 shadow-sm transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Elimina definitivamente la recensione su Firestore e archivia la segnalazione"
                        >
                          <span>🗑️</span>
                          <span>Elimina Recensione</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => onDismissReport(rep)}
                          className="px-3 py-1.5 bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 text-xs font-bold rounded-xl border border-slate-200 hover:border-emerald-200 transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Ignora la segnalazione e conservala come archiviata"
                        >
                          <span>📁</span>
                          <span>Archivia / Ignora</span>
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {/* Footer */}
            <div className="px-6 py-3 bg-slate-100 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500 shrink-0">
              <span className="text-[11px]">Le eliminazioni ricalcolano medie, punteggi XP e classifiche.</span>
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-1.5 bg-white border border-slate-300 font-bold text-slate-700 rounded-xl hover:bg-slate-50 cursor-pointer"
              >
                Chiudi
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODALE "PRIVACY POLICY & TERMINI DI SERVIZIO" (GDPR) ---
    function PrivacyModal({ isOpen, onClose }) {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fade-in">
          <div className="bg-white w-full max-w-2xl rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up border border-slate-100">
            <div className="px-6 py-4 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-blue-500/20 border border-blue-400/40 flex items-center justify-center text-xl">
                  🛡️
                </div>
                <div>
                  <h3 className="font-black text-sm sm:text-base">Privacy &amp; Regolamento Community</h3>
                  <p className="text-[11px] text-slate-300">Informativa GDPR (Reg. UE 2016/679) e Termini di Servizio</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1.5 text-slate-300 hover:text-white rounded-full hover:bg-white/10 cursor-pointer"
              >
                <IconClose size={20} />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-4 text-xs text-slate-600 leading-relaxed">
              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-1.5">
                <h4 className="font-black text-slate-900 text-xs uppercase tracking-wider flex items-center gap-1.5">
                  <span>🏛️</span> 1. Titolare e Contatti
                </h4>
                <p>
                  <strong>Street Review</strong> è un progetto civico indipendente dedicato alla mappatura collaborativa della qualità stradale e dell'accessibilità urbana in Italia, ideato da <strong>Matteo Bernardini</strong>. Per qualsiasi richiesta relativa alla privacy, moderazione o segnalazione è possibile contattare direttamente il responsabile all'indirizzo ufficiale:{' '}
                  <a href="mailto:streetreview.app@gmail.com" className="text-blue-600 font-bold hover:underline">
                    streetreview.app@gmail.com
                  </a>.
                </p>
              </div>

              <div className="p-4 rounded-2xl bg-blue-50/50 border border-blue-100 space-y-1.5">
                <h4 className="font-black text-slate-900 text-xs uppercase tracking-wider flex items-center gap-1.5">
                  <span>🔐</span> 2. Dati Raccolti e Finalità del Trattamento
                </h4>
                <p>
                  La consultazione della mappa è libera e anonima (Modalità Ospite). Quando scegli volontariamente di effettuare l'accesso tramite <strong>Google Sign-In (Firebase Authentication)</strong>, raccogliamo esclusivamente:
                </p>
                <ul className="list-disc pl-5 space-y-1 text-slate-700 font-medium">
                  <li><strong>Nome pubblico e Avatar Google:</strong> mostrati accanto alle recensioni pubblicate e nella classifica civica degli Esploratori.</li>
                  <li><strong>Indirizzo Email e UID univoco:</strong> utilizzati al solo scopo tecnico di autenticare la tua sessione, prevenire abusi (garantendo il vincolo di <strong>1 sola recensione per via per ciascun utente</strong>), calcolare i progressi Gamification (XP, Livelli, Badge) e inviare notifiche celebrative sui traguardi raggiunti.</li>
                </ul>
                <p className="text-[11px] text-slate-500 pt-1">
                  I tuoi dati non vengono mai ceduti a terzi per fini commerciali o di profilazione pubblicitaria. La posizione GPS ("📍 La mia posizione") viene elaborata esclusivamente nel tuo browser per centrare la mappa e non viene mai salvata sui nostri server.
                </p>
              </div>

              <div className="p-4 rounded-2xl bg-amber-50/60 border border-amber-200/80 space-y-1.5">
                <h4 className="font-black text-amber-950 text-xs uppercase tracking-wider flex items-center gap-1.5">
                  <span>⚖️</span> 3. Regole di Moderazione della Community
                </h4>
                <p className="text-slate-700">
                  Le recensioni devono riguardare esclusivamente le caratteristiche oggettive dell'infrastruttura stradale (asfalto, marciapiedi, parcheggi, illuminazione, accessibilità). È posto il <strong>divieto assoluto</strong> di pubblicare nei commenti:
                </p>
                <ul className="list-disc pl-5 space-y-1 text-amber-950 font-semibold">
                  <li>Nomi e cognomi di privati cittadini o riferimenti a persone specifiche;</li>
                  <li>Numeri di targa automobilistica, numeri di telefono o indirizzi email;</li>
                  <li>Insulti, bestemmie, linguaggio osceno, diffamazioni o contenuti discriminatori.</li>
                </ul>
                <p className="text-[11px] text-slate-600 pt-1">
                  Un filtro automatico pre-salvataggio blocca l'inserimento di targhe, contatti e linguaggio offensivo. Ogni utente può inoltre segnalare eventuali abusi tramite il pulsante <strong>"🚩 Segnala"</strong> presente su ciascun commento.
                </p>
              </div>

              <div className="p-4 rounded-2xl bg-emerald-50/50 border border-emerald-200/80 space-y-1.5">
                <h4 className="font-black text-emerald-950 text-xs uppercase tracking-wider flex items-center gap-1.5">
                  <span>🇪🇺</span> 4. Diritti dell'Utente (GDPR - Artt. 15-22)
                </h4>
                <p className="text-slate-700">
                  In conformità al Regolamento UE 2016/679 (GDPR), hai sempre il diritto di:
                </p>
                <ul className="list-disc pl-5 space-y-1 text-slate-700 font-medium">
                  <li><strong>Rettifica immediata:</strong> puoi modificare e aggiornare in qualsiasi momento le tue recensioni direttamente dall'app.</li>
                  <li><strong>Diritto all'oblio e cancellazione dati:</strong> puoi richiedere in qualsiasi momento la rimozione di una tua recensione o la cancellazione completa del tuo profilo e di tutti i dati associati scrivendo a{' '}
                    <a href="mailto:streetreview.app@gmail.com?subject=Richiesta%20Cancellazione%20Dati%20GDPR%20-%20Street%20Review" className="text-emerald-700 font-bold hover:underline">
                      streetreview.app@gmail.com
                    </a>.
                  </li>
                </ul>
              </div>
            </div>

            <div className="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
              <a
                href="mailto:streetreview.app@gmail.com"
                className="text-xs font-bold text-blue-600 hover:underline flex items-center gap-1.5"
              >
                <span>✉️</span>
                <span>streetreview.app@gmail.com</span>
              </a>
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition-colors cursor-pointer"
              >
                Ho capito, chiudi
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
