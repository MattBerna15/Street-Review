              const opt = options ? { ...options } : {};

              }
              return origGetImmediate(opt);
            };

            const origGet = firestoreProvider.get.bind(firestoreProvider);
            firestoreProvider.get = function(identifier) {
              if (!identifier || identifier === "[DEFAULT]") {
                identifier = "street-review-database";
              }
              return origGet(identifier);
            };

    const RIVIERA_LEGACY_CITY_KEYS = new Set([
      'san-benedetto-del-tronto',
      'grottammare',
      'monteprandone',
      'acquaviva-picena',
    ]);

    // Helper di normalizzazione toponomastica completa (preserva 'viale', 'lungomare', 'via', ecc.)
    const normalizeStreetKey = (name) => {
      if (!name) return '';
      return name
        .toLowerCase()
        .replace(/\bv\.le\b/gi, 'viale')
        .replace(/\bc\.so\b/gi, 'corso')
        .replace(/\bp\.zza\b/gi, 'piazza')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .trim();
    };

    // Inferenza geografica del comune nel perimetro storico a partire dalle coordinate (solo se dentro la Riviera delle Palme)
    const inferCityKeyFromCoords = (lat, lng) => {
      const nLat = Number(lat);
      const nLng = Number(lng);
      if (!isNaN(nLat) && !isNaN(nLng) && nLat !== 0 && nLng !== 0) {
        if (isInsideRivieraBounds(nLat, nLng)) {
          if (nLat >= 42.9620) return 'grottammare';
          if (nLng < 13.8300 && nLat >= 42.9300) return 'acquaviva-picena';
          if (nLng < 13.8750 && nLat < 42.9300) return 'monteprandone';
          return 'san-benedetto-del-tronto';
        }
      }
      return '';
    };

    // Helper di normalizzazione del comune/città con City Aliasing (frazioni -> comune principale) e fallback geografico
    const normalizeCityKey = (city, lat, lng) => {
      const raw = (city && city !== 'undefined' && city !== 'null') ? String(city).trim() : '';
      if (!raw) {
        return inferCityKeyFromCoords(lat, lng) || 'italia';
      }

      const slug = raw
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .trim();

      if (!slug || slug === 'undefined' || slug === 'null') {
        return inferCityKeyFromCoords(lat, lng) || 'italia';
      }

      // City Aliasing: frazioni e sinonimi locali -> comune amministrativo principale
      if (
        slug.includes('porto-d-ascoli') ||
        slug.includes('porto-dascoli') ||
        slug.includes('san-benedetto') ||
        slug.includes('s-benedetto') ||
        slug === 'sbt'
      ) {
        return 'san-benedetto-del-tronto';
      }
      if (slug.includes('centobuchi') || slug.includes('monteprandone')) {
        return 'monteprandone';
      }
      if (slug.includes('grottammare') || slug.includes('grottamare')) {
        return 'grottammare';
      }
      if (slug.includes('acquaviva-picena') || (slug.includes('acquaviva') && (!lat || isInsideRivieraBounds(lat, lng)))) {

      }
      // Se arriva solo la provincia (es. "ascoli-piceno" o "ap") dentro il comprensorio Riviera, usa il contesto geografico

        return inferCityKeyFromCoords(lat, lng) || 'san-benedetto-del-tronto';
      }

      return slug;
    };

      const cKey = normalizeCityKey(city, lat, lng);
      const map = {
        'san-benedetto-del-tronto': 'San Benedetto del Tronto',
        'grottammare': 'Grottammare',
        'monteprandone': 'Monteprandone',
        'acquaviva-picena': 'Acquaviva Picena',
      };
      if (map[cKey]) return map[cKey];
      if (city && String(city).trim() && city !== 'undefined' && city !== 'null') {

      }
      return isInsideRivieraBounds(lat, lng) ? 'San Benedetto del Tronto' : 'Italia';

        'grottammare': '63066',
        'monteprandone': '63076',
        'acquaviva-picena': '63075',

    };

      const raw = (province && province !== 'undefined' && province !== 'null') ? String(province).trim().toUpperCase() : '';
      if (raw && /^[A-Z]{2}$/.test(raw)) return raw;
      if (RIVIERA_LEGACY_CITY_KEYS.has(cityKey) || isInsideRivieraBounds(lat, lng)) {

      }
      return raw.replace(/[^A-Z]/g, '').slice(0, 2);

    const normalizeStreetName = normalizeStreetKey;

    const normalizeProvince = (province, cityKey = '', lat = null, lng = null) => {
      const p = normalizeProvinceCode(province, cityKey, lat, lng);

    };

    // ${normalizeStreetName(streetName)}_${normalizeCity(streetCity)}_${normalizeProvince(province || 'italia')}
    const createStreetCompositeKey = (streetName, city, lat, lng, province = '') => {

      return `${sKey}_${cKey}_${pKey}`;

    // Verifica equivalenza tra due streetKey con isolamento rigoroso di via, comune e provincia
    const areStreetKeysEquivalent = (keyA, keyB) => {
      if (!keyA || !keyB) return false;
      const kA = String(keyA).toLowerCase().replace(/^street-/, '').trim();
      const kB = String(keyB).toLowerCase().replace(/^street-/, '').trim();
      if (kA === kB) return true;

      const partsA = kA.split('_');
      const partsB = kB.split('_');
      // Nome via e comune (prime due parti) devono coincidere tassativamente
      if (partsA.length < 2 || partsB.length < 2) return false;
      if (partsA[0] !== partsB[0] || partsA[1] !== partsB[1]) return false;

      // Se entrambe specificano la provincia (3 parti), devono coincidere anche nella provincia
      if (partsA.length >= 3 && partsB.length >= 3) {

      // Retrocompatibilità solo se una delle due chiavi è legacy a 2 parti (senza provincia)
      return true;

    // Calcolo distanza Haversine in km tra due punti geografici
    const getDistanceKm = (lat1, lng1, lat2, lng2) => {
      const nLat1 = Number(lat1), nLng1 = Number(lng1), nLat2 = Number(lat2), nLng2 = Number(lng2);
      if (isNaN(nLat1) || isNaN(nLng1) || isNaN(nLat2) || isNaN(nLng2) || !nLat1 || !nLng1 || !nLat2 || !nLng2) {

      }
      const R = 6371;
      const dLat = (nLat2 - nLat1) * Math.PI / 180;
      const dLng = (nLng2 - nLng1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(nLat1 * Math.PI / 180) * Math.cos(nLat2 * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    };

    // Due record NON possono mai coincidere se appartengono a comuni diversi (es. Grottammare vs San Benedetto del Tronto).
        // Deduplicazione Spaziale & Toponomastica su scala nazionale con blindatura assoluta del Comune:
    // Due record NON possono mai coincidere se appartengono a comuni diversi (es. Grottammare vs San Benedetto del Tronto).
    const isSameStreet = (a, b) => {
      if (!a || !b) return false;

      // 0. Se entrambe hanno una streetKey o ID definito, verifica equivalenza diretta
      const rawKeyA = a.streetKey || a.id;
      const rawKeyB = b.streetKey || b.id;
      if (rawKeyA && rawKeyB) {

        const partsA = String(rawKeyA).replace(/^street-/, '').split('_');
        const partsB = String(rawKeyB).replace(/^street-/, '').split('_');
        if (partsA.length >= 2 && partsB.length >= 2 && partsA[1] !== partsB[1]) {

        }
      }

      const sNormA = normalizeStreetName(a.name || a.streetName || a.canonicalName);
      const sNormB = normalizeStreetName(b.name || b.streetName || b.canonicalName);
      if (!sNormA || !sNormB || sNormA !== sNormB) return false;

      const cityAStr = a.city || a.streetCity || '';
      const cityBStr = b.city || b.streetCity || '';
      const cKeyA = cityAStr ? normalizeCityKey(cityAStr) : '';
      const cKeyB = cityBStr ? normalizeCityKey(cityBStr) : '';

      // VETO ASSOLUTO: Se i comuni o le province sono specificati e diversi, sono TASSATIVAMENTE vie distinte!
      if (cKeyA && cKeyB && cKeyA !== 'italia' && cKeyB !== 'italia' && cKeyA !== cKeyB) {

    // Lookup preventivo di una via nell'elenco delle vie già caricate (prioritizzando quelle con recensioni > 0 e chiave esatta)
    const findExistingStreetInList = (list, candidate) => {

      const sorted = [...list].sort((a, b) => (b.reviewsCount || 0) - (a.reviewsCount || 0));

        // Ricerca punto di ancoraggio canonico dal gazetteer con vincolo territoriale rigido sul comune dichiarato
    const getCanonicalStreetAnchor = (streetName, streetCity, fallbackLat, fallbackLng, fallbackProvince = '') => {

        else if (fmtLower.includes('san benedetto') || fmtLower.includes('porto d\'ascoli')) rawCity = 'San Benedetto del Tronto';

    const getGeometryCenter = (geometry) => {

    const resolveExactStreetRouteCoordinates = async (streetName, streetCity, province = '', fallbackLat = null, fallbackLng = null) => {

    window.updateStreetReviewCoordinates = async (streetTargetName, newLat, newLng) => {

      let current = GAMIFICATION_LEVELS[0];

        if (xp >= GAMIFICATION_LEVELS[i].minXP) {
          current = GAMIFICATION_LEVELS[i];
        }
      }
      const nextIdx = GAMIFICATION_LEVELS.findIndex(l => l.level === current.level + 1);
      const nextLevel = nextIdx !== -1 ? GAMIFICATION_LEVELS[nextIdx] : null;
      const progressPercent = nextLevel
        ? Math.min(100, Math.max(0, Math.round(((xp - current.minXP) / (nextLevel.minXP - current.minXP)) * 100)))

      const xpToNext = nextLevel ? Math.max(0, nextLevel.minXP - xp) : 0;

        xp,
        nextLevel,
        progressPercent,
        xpToNext,
      };

      { key: 'quietness', label: 'Tranquillità e silenziosità (rumore)', icon: '🤫' },
      { key: 'intersectionVisibility', label: 'Visibilità incroci (specchi, visuale)', icon: '👀' },
      { key: 'laneWidth', label: 'Larghezza carreggiata (manovra, spazio)', icon: '↔️' },
    ];

    const ROAD_OBSTACLE_OPTIONS = [
      '⚠️ Sottopasso molto basso (< 2.3m - solo auto)',
      '⚠️ Sottopasso medio (< 3.2m - no camper alti)',
      '⚠️ Strettoia / Passaggio critico',
      '⚠️ Salita/Discesa ripida',
      '⚠️ Limite di portata / Peso',
    ];

    // Timestamp numerico (ms) per ordinamento cronologico decrescente (dalla più recente alla più vecchia)
    const parseReviewChronologicalMs = (rev) => {
      const raw = rev?.updatedAt || rev?.createdAt;
      if (!raw) return 0;
      if (typeof raw === 'number') return raw;
      if (typeof raw?.toMillis === 'function') return raw.toMillis();
      if (typeof raw?.seconds === 'number') return raw.seconds * 1000;
      const parsed = Date.parse(String(raw));
      return isNaN(parsed) ? 0 : parsed;
    };

    // Determina lo streetType prevalente sulle ULTIME 10 recensioni (ordinate in senso cronologico decrescente).
    // Criterio di parità: vince la tipologia scelta dalla recensione più recente tra quelle considerate.
    // Fallback: rilevazione automatica dal nome della via o '🏡 Urbana'.
    const computePrevalentStreetType = (reviewsList, streetName = '', fallbackType = '') => {
      const safeReviews = Array.isArray(reviewsList) ? reviewsList : [];
      const sortedDesc = [...safeReviews].sort((a, b) => parseReviewChronologicalMs(b) - parseReviewChronologicalMs(a));
      const last10Reviews = sortedDesc.slice(0, 10);

      const freqMap = new Map();
      last10Reviews.forEach((r, idx) => {
        const normType = normalizeStreetTypeLabel(r?.streetType);
        if (!normType) return;
        if (!freqMap.has(normType)) {
          freqMap.set(normType, { count: 1, mostRecentIndex: idx });
        } else {
          freqMap.get(normType).count += 1;
        }
      });

      let prevalentType = '';
      let maxCount = 0;
      let bestRecentIdx = Number.MAX_SAFE_INTEGER;

      freqMap.forEach((info, typeLabel) => {
        if (
          info.count > maxCount ||
          (info.count === maxCount && info.mostRecentIndex < bestRecentIdx)
        ) {
          maxCount = info.count;
          bestRecentIdx = info.mostRecentIndex;
          prevalentType = typeLabel;
        }
      });

      if (!prevalentType) {
        prevalentType =
          normalizeStreetTypeLabel(fallbackType) ||
          detectStreetTypeFromStreetName(streetName) ||
          '🏡 Urbana';
      }
      return prevalentType;
    };

    // Restituisce il voto complessivo (1..5) di una singola recensione (con fallback sulle categorie valide per le recensioni storiche)
    const getSingleReviewOverallScore = (r) => {
      const direct = Number(r?.ratingOverall ?? r?.overallRating);
      if (!isNaN(direct) && direct >= 1 && direct <= 5) {
        return direct;
      }
      if (r?.ratings && typeof r.ratings === 'object') {
        const validCatVals = CATEGORY_KEYS
          .map(k => r.ratings[k])
          .filter(v => v !== null && v !== undefined && v !== 'N/A' && v !== '' && !isNaN(Number(v)) && Number(v) >= 1 && Number(v) <= 5)
          .map(v => Number(v));
        if (validCatVals.length > 0) {
          return validCatVals.reduce((a, b) => a + b, 0) / validCatVals.length;
        }
      }
      return 0;
    };

    // Calcola il punteggio finale di una recensione: 100% voto globale (Flash) oppure media ponderata (40% globale + 60% categorie tecniche) se approfondita
    const computeWeightedReviewRating = (overallScore, ratingsObj, isTechnicalActive) => {
      const baseOverall = Number(overallScore) || 0;
      if (!isTechnicalActive || baseOverall === 0) {
        return baseOverall;
      }

      if (!ratingsObj || typeof ratingsObj !== 'object') {
        return baseOverall;
      }

      const validVals = [];
      const keys = (typeof CATEGORY_KEYS !== 'undefined' && Array.isArray(CATEGORY_KEYS)) ? CATEGORY_KEYS : Object.keys(ratingsObj);
      keys.forEach(k => {
        const rawVal = ratingsObj[k];
        if (rawVal === null || rawVal === undefined || rawVal === 'N/A' || rawVal === '') return;
        const num = Number(rawVal);
        if (!isNaN(num) && num >= 1 && num <= 5) {
          validVals.push(num);
        }
      });

      if (validVals.length === 0) {
        return baseOverall;
      }

      const mediaCategorie = validVals.reduce((acc, v) => acc + v, 0) / validVals.length;
      const weighted = (baseOverall * 0.40) + (mediaCategorie * 0.60);
      return Math.round(weighted * 10) / 10;
    };

    // Calcolo matematico blindato di ratingOverall, categoryAverages (escludendo null/undefined/'N/A') e streetType prevalente
    const computeStreetAggregatesFromReviews = (reviewsList, streetName = '', fallbackStreetType = '') => {
      const safeReviews = Array.isArray(reviewsList) ? reviewsList : [];

      // 1. Tipologia prevalente sulle ultime 10 recensioni
      const streetType = computePrevalentStreetType(safeReviews, streetName, fallbackStreetType);

      // 2. Voto complessivo della strada: media aritmetica semplice di review.ratingOverall (1..5), arrotondata a 1 decimale
      const validOveralls = safeReviews
        .map(r => getSingleReviewOverallScore(r))
        .filter(v => !isNaN(v) && v >= 1 && v <= 5);
      const ratingOverall = validOveralls.length > 0
        ? Number((validOveralls.reduce((acc, v) => acc + v, 0) / validOveralls.length).toFixed(1))
        : 0;

      // 3. Medie di singola categoria tecnica: filtra rigorosamente solo valori numerici [1..5], altrimenti null (mai 0)
      const categoryAverages = {};
      CATEGORY_KEYS.forEach(k => {
        const validCatScores = [];
        safeReviews.forEach(r => {
          const rawVal = r?.ratings?.[k];
          if (rawVal === null || rawVal === undefined || rawVal === 'N/A' || rawVal === '') return;
          const numVal = Number(rawVal);
          if (!isNaN(numVal) && numVal >= 1 && numVal <= 5) {
            validCatScores.push(numVal);
          }
        });
        if (validCatScores.length > 0) {
          const sum = validCatScores.reduce((acc, v) => acc + v, 0);
          categoryAverages[k] = Number((sum / validCatScores.length).toFixed(1));
        } else {
          categoryAverages[k] = null;
        }
      });

      const parkingTypes = Array.from(new Set(safeReviews.flatMap(r => r.parkingTypes || [])));
      const hasCyclePath = safeReviews.some(r => Boolean(r.hasCyclePath));
      const amenities = Array.from(new Set(safeReviews.flatMap(r => r.amenities || [])));
      const roadObstacles = Array.from(new Set(safeReviews.flatMap(r => r.roadObstacles || [])));

      return {
        streetType,
        ratingOverall,
        categoryAverages,
        parkingTypes,
        hasCyclePath,
        amenities,
        roadObstacles,
      };
    };

    const createDefaultProfile = (usr) => {
      const uid = usr?.id || usr?.authorId || 'guest';
      const base = {
        authorId: uid,
        name: usr?.name || usr?.authorName || 'Esploratore Ospite',

        xp: 0,

        cityStats: {},

      };
      return {

    const hydrateUserProfileFromDoc = (uDoc) => {
      if (!uDoc) return createDefaultProfile(null);
      const authorId = String(uDoc.authorId || uDoc.id || 'guest');
      const authorName = uDoc.authorName || uDoc.name || 'Cittadino Esploratore';
      const authorAvatar = uDoc.authorAvatar || uDoc.avatarUrl || '';
      const xp = Number(uDoc.xp) || 0;
      const reviewsCount = Number(uDoc.reviewsCount) || 0;
      const pioneerCount = Number(uDoc.pioneerCount) || 0;
      const guardianCount = Number(uDoc.guardianCount) || 0;
      const helpfulReceivedCount = Number(uDoc.helpfulReceivedCount) || 0;
      const citiesCount = Number(uDoc.citiesCount ?? uDoc.uniqueCitiesCount) || (reviewsCount > 0 ? 1 : 0);
      const uniqueStreetsCount = Number(uDoc.uniqueStreetsCount) || reviewsCount;
      const unlockedBadgeIds = Array.isArray(uDoc.unlockedBadges) ? uDoc.unlockedBadges : [];
      const unlockedSet = new Set(unlockedBadgeIds);
      const favoriteBadge = uDoc.favoriteBadge || getLocalFavoriteBadge(authorId) || null;

      const statsObj = {
        authorId,
        authorName,
        name: authorName,
        authorAvatar,
        avatarUrl: authorAvatar,
        xp,
        reviewsCount,
        uniqueStreetsCount,
        uniqueCitiesCount: citiesCount,
        citiesCount,
        pioneerCount,
        guardianCount,
        helpfulReceivedCount: helpfulReceivedCount || (unlockedSet.has('authoritative_voice') ? 10 : 0),
        parkingReviewsCount: Number(uDoc.parkingReviewsCount) || (unlockedSet.has('parking_hound') ? 12 : 0),
        detailedCommentsCount: Number(uDoc.detailedCommentsCount) || (unlockedSet.has('street_critic') ? 15 : 0),
        accessibilityStreetsCount: Number(uDoc.accessibilityStreetsCount) || (unlockedSet.has('accessibility_paladin') ? 8 : 0),
        arteriesStreetsCount: Number(uDoc.arteriesStreetsCount) || (unlockedSet.has('artery_king') ? 5 : 0),
        pedestrianStreetsCount: Number(uDoc.pedestrianStreetsCount) || (unlockedSet.has('pedestrian_friend') ? 5 : 0),
        greenStreetsCount: Number(uDoc.greenStreetsCount) || (unlockedSet.has('green_pioneer') ? 5 : 0),
        favoriteBadge,
        mayorCities: Array.isArray(uDoc.mayorCities) ? uDoc.mayorCities : [],
        mayorTitles: Array.isArray(uDoc.mayorTitles) ? uDoc.mayorTitles : [],
        cityStats: (uDoc.cityStats && typeof uDoc.cityStats === 'object') ? uDoc.cityStats : {},
        unlockedBadges: unlockedBadgeIds,
        awardedMilestones: Array.from(new Set([
          ...(Array.isArray(uDoc.awardedMilestones) ? uDoc.awardedMilestones : []),
          ...getLocalAwardedMilestones(authorId),
        ])),
      };

      const levelInfo = getLevelByXP(xp);
      const badges = GAMIFICATION_BADGES.map(b => {
        const rawCurrent = b.getValue(statsObj);
        const unlocked = unlockedSet.has(b.id) || rawCurrent >= b.target;
        const current = unlocked ? Math.max(rawCurrent, b.target) : rawCurrent;
        const progress = Math.min(current, b.target);
        return {
          ...b,
          current,
          progress,
          unlocked,
        };
      });
      const unlockedBadgesCount = badges.filter(b => b.unlocked).length;

      return {
        ...statsObj,
        levelInfo,
        badges,
        unlockedBadgesCount,
      };
    };

    const formatCloudReviewToUI = (r, fallbackStreet = {}) => {
      const lat = Number(r.latitude) || Number(fallbackStreet.latitude) || 42.9517;
      const lng = Number(r.longitude) || Number(fallbackStreet.longitude) || 13.8822;
      const city = r.streetCity || fallbackStreet.city || fallbackStreet.streetCity || '';
      const province = r.streetProvince || r.province || fallbackStreet.province || '';
      const streetName = r.streetName || fallbackStreet.name || fallbackStreet.streetName || '';
      const streetKey = r.streetKey || fallbackStreet.streetKey || createStreetCompositeKey(streetName, city, lat, lng, province);
      const helpfulVoterIds = Array.isArray(r.helpfulVoterIds) ? r.helpfulVoterIds.filter(Boolean).map(String) : [];
      const helpfulCount = Math.max(0, Number(r.helpfulCount ?? helpfulVoterIds.length) || 0);
      return {
        id: r.id,
        streetKey,
        streetName,
        streetSegment: (r.streetSegment || '').trim(),
        userId: r.authorId || r.userId,
        user: r.authorName || r.user || 'Cittadino Esploratore',
        avatarUrl: r.authorAvatar || r.avatarUrl || '',
        streetCity: city,
        streetProvince: province,
        latitude: lat,
        longitude: lng,
        date: r.date || (r.updatedAt ? new Date(r.updatedAt).toLocaleDateString('it-IT') : 'Recente'),
        createdAt: r.createdAt || r.updatedAt || null,
        updatedAt: r.updatedAt || r.createdAt || null,
        streetType: normalizeStreetTypeLabel(r.streetType),
        overallRating: Number(getSingleReviewOverallScore(r).toFixed(1)),
        rawOverallRating: r.rawOverallRating ? Number(r.rawOverallRating) : null,
        comment: r.comment || '',
        ratings: r.ratings || {},
        parkingTypes: Array.isArray(r.parkingTypes) ? r.parkingTypes : [],
        hasCyclePath: Boolean(r.hasCyclePath),
        amenities: Array.isArray(r.amenities) ? r.amenities : [],
        roadObstacles: Array.isArray(r.roadObstacles) ? r.roadObstacles : [],
        awardedMilestones: Array.isArray(r.awardedMilestones) ? r.awardedMilestones : [],
        helpfulVoterIds,
        helpfulCount,
      };
    };

    // Calcola il "👑 Guardiano della Via" in base al Guardian Score:
    // +20 punti se ha compilato i parametri tecnici (almeno 1 categoria valutata 1..5)
    // +10 punti se ha selezionato tag parcheggi/dotazioni/ostacoli
    // +10 punti se ha scritto un commento testuale valido
    // +15 punti per ogni voto "👍 Utile" ricevuto su quella recensione
    // (In caso di parità di punteggio sulla via, vince chi l'ha recensita per primo, cioè il Pioniere)
    const computeStreetGuardian = (reviewsList, resolveAuthorLevel = null) => {
      const safeReviews = Array.isArray(reviewsList) ? reviewsList : [];
      if (safeReviews.length === 0) {
        return {
          guardianId: null,
          guardianName: '',
          guardianAvatar: '',
          guardianLevel: 1,
          guardianScore: 0,
          guardianReviewId: null,
        };
      }

      let bestRev = null;
      let bestScore = -1;
      let bestTime = Number.MAX_SAFE_INTEGER;

      safeReviews.forEach(r => {
        if (!r) return;
        const hasTechParams = countRatedTechnicalParams(r.ratings) > 0;
        const hasTags = hasAnyParkingOrAmenityTag(r);
        const hasComment = isMeaningfulReviewComment(r.comment);
        const helpfulCount = Math.max(0, Number(r.helpfulCount ?? (Array.isArray(r.helpfulVoterIds) ? r.helpfulVoterIds.length : 0)) || 0);

        const score =
          (hasTechParams ? 20 : 0) +
          (hasTags ? 10 : 0) +
          (hasComment ? 10 : 0) +
          (15 * helpfulCount);

        const t = parseReviewTimestampMs(r);
        if (score > bestScore || (score === bestScore && t < bestTime)) {
          bestScore = score;
          bestTime = t;
          bestRev = r;
        }
      });

      if (!bestRev) {
        return {
          guardianId: null,
          guardianName: '',
          guardianAvatar: '',
          guardianLevel: 1,
          guardianScore: 0,
          guardianReviewId: null,
        };
      }

      const guardianId = String(bestRev.authorId || bestRev.userId || `name:${(bestRev.authorName || bestRev.user || 'utente').trim().toLowerCase()}`);
      const guardianName = bestRev.authorName || bestRev.user || 'Cittadino Esploratore';
      const guardianAvatar = bestRev.authorAvatar || bestRev.avatarUrl || '';
      let guardianLevel = Number(bestRev.authorLevel || bestRev.level) || 1;
      if (typeof resolveAuthorLevel === 'function') {
        const resolvedLvl = Number(resolveAuthorLevel(bestRev, guardianId));
        if (!isNaN(resolvedLvl) && resolvedLvl >= 1) {
          guardianLevel = resolvedLvl;
        }
      }

      return {
        guardianId,
        guardianName,
        guardianAvatar,
        guardianLevel,
        guardianScore: bestScore,
        guardianReviewId: bestRev.id || null,
      };
    };

        // Costruisce il documento sommario per la collezione 'streets/{streetKey}' a partire dalle recensioni di quella via
    const buildStreetSummaryDocFromReviews = (revList, fallbackMeta = {}) => {
      const safeReviews = Array.isArray(revList) ? revList : [];
      const sample = safeReviews[0] || fallbackMeta;

      // 1. Determina il nome e comune dichiarato: PRIORITÀ ASSOLUTA a fallbackMeta
      const rawName = (fallbackMeta.streetName || fallbackMeta.name || sample?.streetName || sample?.name || '').trim();
      const declaredCity = (fallbackMeta.streetCity || fallbackMeta.city || sample?.streetCity || sample?.city || '').trim();
      const declaredCityKey = declaredCity ? normalizeCityKey(declaredCity) : '';

      // 2. Risoluzione coordinate: se fallbackMeta specifica coordinate, usale tassativamente
      const fallbackLatNum = Number(fallbackMeta.latitude);
      const fallbackLngNum = Number(fallbackMeta.longitude);
      const hasExplicitFallbackCoords = !isNaN(fallbackLatNum) && !isNaN(fallbackLngNum) && fallbackLatNum !== 0 && fallbackLngNum !== 0;

      // Filtra solo le recensioni che appartengono allo stesso comune dichiarato
      const cityReviews = (declaredCityKey && declaredCityKey !== 'italia')
        ? safeReviews.filter(rev => {
            const rCity = normalizeCityKey(rev.streetCity || rev.city || '');
            return !rCity || rCity === 'italia' || rCity === declaredCityKey;
          })
        : safeReviews;

      const validCoords = cityReviews.filter(rev =>
        rev.latitude && rev.longitude && !isNaN(Number(rev.latitude)) && !isNaN(Number(rev.longitude)) &&
        (!declaredCityKey || declaredCityKey === 'italia' || inferCityKeyFromCoords(rev.latitude, rev.longitude) === declaredCityKey || !inferCityKeyFromCoords(rev.latitude, rev.longitude))
      );

      let baryLat = hasExplicitFallbackCoords
        ? fallbackLatNum
        : (validCoords.length > 0
            ? Number((validCoords.reduce((acc, rev) => acc + Number(rev.latitude), 0) / validCoords.length).toFixed(6))
            : (Number(sample?.latitude) || 42.9889));

      let baryLng = hasExplicitFallbackCoords
        ? fallbackLngNum
        : (validCoords.length > 0
            ? Number((validCoords.reduce((acc, rev) => acc + Number(rev.longitude), 0) / validCoords.length).toFixed(6))
            : (Number(sample?.longitude) || 13.8690));

      // CASI SPECIALI AUTORITATIVI (applicati ESCLUSIVAMENTE se il comune corrisponde):
      const normRawName = normalizeStreetName(rawName);
      if (normRawName.includes('vittoria') && declaredCityKey === 'alba-adriatica') {
        baryLat = 42.83605895341866;
        baryLng = 13.926245266469673;
      } else if (normRawName.includes('mazzini') && declaredCityKey === 'alba-adriatica') {
        baryLat = 42.83284835747221;
        baryLng = 13.926373810644503;
      } else if (normRawName.includes('mazzini') && declaredCityKey === 'grottammare') {
        baryLat = 42.990443190632796;
        baryLng = 13.869663126569428;
      } else if (normRawName.includes('carducci') && declaredCityKey === 'grottammare') {
        baryLat = 42.96336244509739;
        baryLng = 13.875948479968113;
      } else if (normRawName.includes('firenze') && declaredCityKey === 'grottammare') {
        baryLat = 42.962981492069545;
        baryLng = 13.87075809346326;
      } else if (normRawName.includes('san-donato') && declaredCityKey === 'monteprandone') {
        baryLat = 42.91209543811305;
        baryLng = 13.860065210654204;
      }

      const anchor = getCanonicalStreetAnchor(rawName, declaredCity, baryLat, baryLng, fallbackMeta.province || sample?.province);
      const streetName = anchor.canonicalName || rawName;
      const streetCity = anchor.city || declaredCity || resolveCanonicalCityName(declaredCity, baryLat, baryLng);
      const streetCityKey = normalizeCityKey(streetCity);
      const province = anchor.province || normalizeProvinceCode(fallbackMeta.province || sample?.province || 'AP', streetCityKey, anchor.lat, anchor.lng);
      const postalCode = anchor.postalCode || fallbackMeta.postalCode || sample?.postalCode || resolveDefaultPostalCode(streetCityKey);
      const streetKey = fallbackMeta.streetKey || createStreetCompositeKey(streetName, streetCity, anchor.lat, anchor.lng, province);

      const {
        streetType: detectedStreetType,
        ratingOverall,
        categoryAverages,
        parkingTypes,
        hasCyclePath,
        amenities,
        roadObstacles,
      } = computeStreetAggregatesFromReviews(safeReviews, streetName, fallbackMeta?.streetType);

      // Determina l'autore Pioniere (prima recensione storica della via per timestamp createdAt)
      let pioneerRev = safeReviews[safeReviews.length - 1] || null;
      let minTime = pioneerRev ? parseReviewTimestampMs(pioneerRev) : Number.MAX_SAFE_INTEGER;
      for (let i = safeReviews.length - 1; i >= 0; i--) {
        const r = safeReviews[i];
        const t = parseReviewTimestampMs(r);
        if (t < minTime) {
          minTime = t;
          pioneerRev = r;
        }
      }
      const pioneerAuthorId = pioneerRev
        ? String(pioneerRev.authorId || pioneerRev.userId || `name:${(pioneerRev.authorName || pioneerRev.user || 'utente').trim().toLowerCase()}`)
        : null;
      const pioneerReviewId = pioneerRev ? (pioneerRev.id || null) : null;
      const pioneerAuthorName = pioneerRev ? (pioneerRev.authorName || pioneerRev.user || '') : '';

      const guardianInfo = computeStreetGuardian(safeReviews, fallbackMeta.resolveAuthorLevel || null);

      return {
        streetKey,
        streetName,
        streetCity,
        province,
        postalCode,
        latitude: Number(anchor.lat),
        longitude: Number(anchor.lng),
        googlePlaceId: fallbackMeta.googlePlaceId || fallbackMeta.placeId || sample?.googlePlaceId || sample?.placeId || null,
        streetType: detectedStreetType,
        ratingOverall,
        reviewCount: safeReviews.length,
        categoryAverages,
        parkingTypes,
        hasCyclePath,
        amenities,
        roadObstacles,
        pioneerAuthorId,
        pioneerReviewId,
        pioneerAuthorName,
        guardianId: guardianInfo.guardianId || fallbackMeta.guardianId || null,
        guardianName: guardianInfo.guardianName || fallbackMeta.guardianName || '',
        guardianAvatar: guardianInfo.guardianAvatar || fallbackMeta.guardianAvatar || '',
        guardianLevel: guardianInfo.guardianLevel || fallbackMeta.guardianLevel || 1,
        guardianScore: guardianInfo.guardianScore || 0,
        updatedAt: new Date().toISOString(),
      };
    };

    // Converte un documento 'streets/{streetKey}' nel formato strada utilizzato dalla UI e dai PIN mappa
    const mapStreetDocToUIStreet = (docData, existingStreet = null) => {
      const rawName = docData.streetName || docData.name || '';
      const rawCity = docData.streetCity || docData.city || '';
      const lat = Number(docData.latitude) || 42.9517;
      const lng = Number(docData.longitude) || 13.8822;
      const cityKey = normalizeCityKey(rawCity, lat, lng);
      const province = docData.province || docData.streetProvince || normalizeProvinceCode('', cityKey, lat, lng);
      const streetKey = docData.streetKey || docData.id || createStreetCompositeKey(rawName, rawCity, lat, lng, province);
      const canonicalId = 'street-' + streetKey.replace(/[^a-z0-9]/g, '-');

      const defaultCats = {};
      CATEGORY_KEYS.forEach(k => {
        const val = docData.categoryAverages?.[k];
        const num = Number(val);
        defaultCats[k] = (val !== null && val !== undefined && val !== 'N/A' && val !== '' && !isNaN(num) && num >= 1 && num <= 5)
          ? Number(num.toFixed(1))
          : null;
      });

      const preservedReviews = (existingStreet && Array.isArray(existingStreet.reviews) && existingStreet.reviews.length > 0)
        ? existingStreet.reviews
        : [];

      const rawParking = Array.isArray(docData.parkingTypes)
        ? docData.parkingTypes
        : (Array.isArray(docData.commonParkingTypes) ? docData.commonParkingTypes : []);
      const mergedParking = preservedReviews.length > 0
        ? Array.from(new Set([...rawParking, ...preservedReviews.flatMap(r => r.parkingTypes || [])]))
        : rawParking;

      const rawAmenities = Array.isArray(docData.amenities) ? docData.amenities : [];
      const mergedAmenities = preservedReviews.length > 0
        ? Array.from(new Set([...rawAmenities, ...preservedReviews.flatMap(r => r.amenities || [])]))
        : rawAmenities;

      const rawObstacles = Array.isArray(docData.roadObstacles) ? docData.roadObstacles : [];
      const mergedRoadObstacles = preservedReviews.length > 0
        ? Array.from(new Set([...rawObstacles, ...preservedReviews.flatMap(r => r.roadObstacles || [])]))
        : rawObstacles;

      const mergedCyclePath = Boolean(docData.hasCyclePath) || preservedReviews.some(r => Boolean(r.hasCyclePath));
      const resolvedStreetType =
        normalizeStreetTypeLabel(docData.streetType) ||
        normalizeStreetTypeLabel(existingStreet?.streetType) ||
        computePrevalentStreetType(preservedReviews, rawName);

      const fallbackGuardian = preservedReviews.length > 0 ? computeStreetGuardian(preservedReviews) : null;

      return {
        id: existingStreet?.id || canonicalId,
        streetKey,
        name: rawName,
        city: rawCity,
        province,
        postalCode: docData.postalCode || existingStreet?.postalCode || resolveDefaultPostalCode(cityKey),
        latitude: lat,
        longitude: lng,
        streetType: resolvedStreetType,
        reviewsCount: Number(docData.reviewCount ?? docData.reviewsCount ?? preservedReviews.length ?? 0),
        avgOverallRating: Number(docData.ratingOverall ?? docData.avgOverallRating ?? 0),
        categoryAverages: defaultCats,
        commonParkingTypes: mergedParking,
        hasCyclePath: mergedCyclePath,
        amenities: mergedAmenities,
        roadObstacles: mergedRoadObstacles,
        pioneerAuthorId: docData.pioneerAuthorId || existingStreet?.pioneerAuthorId || null,
        pioneerReviewId: docData.pioneerReviewId || existingStreet?.pioneerReviewId || null,
        pioneerAuthorName: docData.pioneerAuthorName || existingStreet?.pioneerAuthorName || '',
        guardianId: docData.guardianId || fallbackGuardian?.guardianId || existingStreet?.guardianId || docData.pioneerAuthorId || null,
        guardianName: docData.guardianName || fallbackGuardian?.guardianName || existingStreet?.guardianName || docData.pioneerAuthorName || '',
        guardianAvatar: docData.guardianAvatar || fallbackGuardian?.guardianAvatar || existingStreet?.guardianAvatar || '',
        guardianLevel: Number(docData.guardianLevel || fallbackGuardian?.guardianLevel || existingStreet?.guardianLevel || 1) || 1,
        guardianScore: Number(docData.guardianScore ?? fallbackGuardian?.guardianScore ?? existingStreet?.guardianScore ?? 0) || 0,
        reviews: preservedReviews,
        reviewsLoaded: Boolean(existingStreet?.reviewsLoaded),
      };
    };

    // Costruisce il documento 'users/{authorId}' pre-aggregato a partire dalle recensioni dell'utente
    const buildUserSummaryDocFromReviews = (authorId, userReviews, streetsList = [], extraMilestones = [], profileMeta = {}) => {
      const safeReviews = Array.isArray(userReviews) ? userReviews : [];
      const streetIds = new Set();
      const cityKeys = new Set();
      const pioneerStreetIds = new Set();
      const accessibilityStreetIds = new Set();
      const arteriesStreetIds = new Set();
      const pedestrianStreetIds = new Set();
      const greenStreetIds = new Set();
      const guardianStreetIds = new Set();
      const cityStatsTracker = {};
      const awardedMilestonesSet = new Set([
        ...(Array.isArray(extraMilestones) ? extraMilestones : []),
        ...getLocalAwardedMilestones(authorId),
      ]);

      let xp = 0;
      let parkingReviewsCount = 0;
      let detailedCommentsCount = 0;
      let helpfulReceivedCount = 0;
      let resolvedName = profileMeta.authorName || profileMeta.name || '';
      let resolvedAvatar = profileMeta.authorAvatar || profileMeta.avatarUrl || '';
      let resolvedEmail = profileMeta.email || '';
      const favoriteBadge = profileMeta.favoriteBadge !== undefined ? profileMeta.favoriteBadge : (getLocalFavoriteBadge(authorId) || null);

      (streetsList || []).forEach(s => {
        if ((s.reviewsCount || 0) > 0) {
          const gId = s.guardianId || s.pioneerAuthorId;
          if (gId && String(gId) === String(authorId)) {
            guardianStreetIds.add(s.streetKey || s.id);
          }
        }
      });

      safeReviews.forEach(r => {
        if (!resolvedName && (r.authorName || r.user)) resolvedName = r.authorName || r.user;
        if (!resolvedAvatar && (r.authorAvatar || r.avatarUrl)) resolvedAvatar = r.authorAvatar || r.avatarUrl;

        const rLat = Number(r.latitude) || 42.9517;
        const rLng = Number(r.longitude) || 13.8822;
        const rCity = r.streetCity || r.city || '';
        const rProv = r.streetProvince || r.province || '';
        const rStreetKey = r.streetKey || createStreetCompositeKey(r.streetName || r.name || '', rCity, rLat, rLng, rProv);

        // Verifica se l'utente è il Pioniere per questa strada (controllando il documento streets o il flag)
        const matchingStreet = (streetsList || []).find(s =>
          (s.streetKey && s.streetKey === rStreetKey) ||
          isSameStreet(s, { name: r.streetName || r.name, city: rCity, province: rProv, lat: rLat, lng: rLng })
        );
        const canonicalStreetKey = matchingStreet?.streetKey || rStreetKey;

        const isPioneer = Boolean(
          r.isPioneer ||
          (matchingStreet && (
            (matchingStreet.pioneerAuthorId && String(matchingStreet.pioneerAuthorId) === String(authorId)) ||
            (matchingStreet.pioneerReviewId && matchingStreet.pioneerReviewId === r.id) ||
            Number(matchingStreet.reviewsCount ?? matchingStreet.reviewCount ?? 0) <= 1
          ))
        );

        const isGuardian = Boolean(
          (matchingStreet && (
            (matchingStreet.guardianId && String(matchingStreet.guardianId) === String(authorId)) ||
            (!matchingStreet.guardianId && isPioneer)
          )) ||
          (!matchingStreet && isPioneer)
        );
        if (isGuardian) {
          guardianStreetIds.add(canonicalStreetKey);
        }

        const xpBreakdown = computeSingleReviewXP(r, isPioneer);
        xp += xpBreakdown.totalXP;
        helpfulReceivedCount += xpBreakdown.helpfulCount;
        streetIds.add(canonicalStreetKey);

        const revCityKey = normalizeCityKey(rCity || matchingStreet?.city, rLat, rLng);
        const revCityName = resolveCanonicalCityName(rCity || matchingStreet?.city, rLat, rLng) || matchingStreet?.city || rCity || 'Italia';
        if (revCityKey) {
          cityKeys.add(revCityKey);
          if (!cityStatsTracker[revCityKey]) {
            cityStatsTracker[revCityKey] = {
              cityKey: revCityKey,
              cityName: revCityName,
              xp: 0,
              streetIds: new Set(),
              pioneerIds: new Set(),
              reviewsCount: 0,
              helpfulReceivedCount: 0,
            };
          }
          cityStatsTracker[revCityKey].xp += xpBreakdown.totalXP;
          cityStatsTracker[revCityKey].streetIds.add(canonicalStreetKey);
          if (isPioneer) cityStatsTracker[revCityKey].pioneerIds.add(canonicalStreetKey);
          cityStatsTracker[revCityKey].reviewsCount += 1;
          cityStatsTracker[revCityKey].helpfulReceivedCount += xpBreakdown.helpfulCount;
        }

        if (isPioneer) {
          pioneerStreetIds.add(canonicalStreetKey);
        }
        if (Array.isArray(r.parkingTypes) && r.parkingTypes.length > 0) {
          parkingReviewsCount += 1;
        }
        if (isDetailedCommentText(r.comment)) {
          detailedCommentsCount += 1;
        }
        const hasAccessibilitySignal =
          (Array.isArray(r.parkingTypes) && (r.parkingTypes.includes('DISABLED') || r.parkingTypes.includes('PINK'))) ||
          Number(r.ratings?.accessibility) > 0;
        if (hasAccessibilitySignal) {
          accessibilityStreetIds.add(canonicalStreetKey);
        }

        // Nuovi 4 Badge Tematici: Arterie, Pedoni/Famiglie, Green
        const resolvedStreetType = normalizeStreetTypeLabel(
          r.streetType || matchingStreet?.streetType || detectStreetTypeFromStreetName(r.streetName || r.name || '')
        );
        if (resolvedStreetType === '🛣️ Statale / Provinciale (SS / SP)' || resolvedStreetType === '🟢 Autostrada') {
          arteriesStreetIds.add(canonicalStreetKey);
        }

        const rAmenities = Array.isArray(r.amenities) ? r.amenities : [];
        const sAmenities = Array.isArray(matchingStreet?.amenities) ? matchingStreet.amenities : [];
        const combinedAmenities = [...rAmenities, ...sAmenities];
        const hasPlaygroundOrDog =
          combinedAmenities.includes('PLAYGROUND') ||
          combinedAmenities.includes('Area Giochi') ||
          combinedAmenities.includes('DOG_AREA') ||
          combinedAmenities.includes('Area Cani');
        if (resolvedStreetType === '🚶 Pedonale / ZTL' || hasPlaygroundOrDog) {
          pedestrianStreetIds.add(canonicalStreetKey);
        }

        const hasGreenMobility =
          Boolean(r.hasCyclePath || matchingStreet?.hasCyclePath) ||
          combinedAmenities.includes('EV_CHARGING') ||
          combinedAmenities.includes('CYCLE_PATH');
        if (hasGreenMobility) {
          greenStreetIds.add(canonicalStreetKey);
        }

        if (Array.isArray(r.awardedMilestones)) {
          r.awardedMilestones.forEach(m => {
            if (m) awardedMilestonesSet.add(String(m));
          });
        }
      });

      const serializedCityStats = {};
      Object.values(cityStatsTracker).forEach(cs => {
        serializedCityStats[cs.cityKey] = {
          cityKey: cs.cityKey,
          cityName: cs.cityName,
          xp: cs.xp,
          uniqueStreetsCount: cs.streetIds.size,
          pioneerCount: cs.pioneerIds.size,
          reviewsCount: cs.reviewsCount,
          helpfulReceivedCount: cs.helpfulReceivedCount,
        };
      });

      const finalName = resolvedName || 'Cittadino Esploratore';
      const statsObj = {
        authorId: String(authorId),
        authorName: finalName,
        name: finalName,
        authorAvatar: resolvedAvatar,
        avatarUrl: resolvedAvatar,
        xp,
        reviewsCount: safeReviews.length,
        uniqueStreetsCount: streetIds.size,
        uniqueCitiesCount: cityKeys.size,
        citiesCount: cityKeys.size,
        pioneerCount: pioneerStreetIds.size,
        guardianCount: guardianStreetIds.size,
        helpfulReceivedCount,
        parkingReviewsCount,
        detailedCommentsCount,
        accessibilityStreetsCount: accessibilityStreetIds.size,
        arteriesStreetsCount: arteriesStreetIds.size,
        pedestrianStreetsCount: pedestrianStreetIds.size,
        greenStreetsCount: greenStreetIds.size,
        favoriteBadge,
        cityStats: serializedCityStats,
        awardedMilestones: Array.from(awardedMilestonesSet),
      };

      const levelInfo = getLevelByXP(xp);
      const badges = buildUserBadges(statsObj);
      const unlockedBadgeIds = badges.filter(b => b.unlocked).map(b => b.id);

      const userDoc = {
        authorId: String(authorId),
        authorName: finalName,
        name: finalName,
        authorAvatar: resolvedAvatar,
        avatarUrl: resolvedAvatar,
        ...(resolvedEmail ? { email: resolvedEmail } : {}),
        xp,
        level: levelInfo.level,
        levelTitle: levelInfo.title,
        reviewsCount: safeReviews.length,
        pioneerCount: pioneerStreetIds.size,
        guardianCount: guardianStreetIds.size,
        helpfulReceivedCount,
        citiesCount: cityKeys.size,
        uniqueCitiesCount: cityKeys.size,
        uniqueStreetsCount: streetIds.size,
        parkingReviewsCount,
        detailedCommentsCount,
        accessibilityStreetsCount: accessibilityStreetIds.size,
        arteriesStreetsCount: arteriesStreetIds.size,
        pedestrianStreetsCount: pedestrianStreetIds.size,
        greenStreetsCount: greenStreetIds.size,
        ...(favoriteBadge !== undefined ? { favoriteBadge } : {}),
        cityStats: serializedCityStats,
        unlockedBadges: unlockedBadgeIds,
        awardedMilestones: Array.from(awardedMilestonesSet),
        updatedAt: new Date().toISOString(),
      };

      const fullProfile = {
        ...statsObj,
        unlockedBadges: unlockedBadgeIds,
        levelInfo,
        badges,
        unlockedBadgesCount: unlockedBadgeIds.length,
      };

      return { userDoc, fullProfile };
    };

    // Routine di Auto-Migrazione Iniziale: eseguita una sola volta se 'streets' o 'users' è vuota (0 documenti)
    let autoMigrationInFlight = false;
    let autoMigrationDone = false;

    const ensureDataMigration = async (firestore, onMigratedData) => {
      if (!firestore || autoMigrationInFlight || autoMigrationDone) return;
      autoMigrationInFlight = true;
      try {
        const [streetsCheckSnap, usersCheckSnap] = await Promise.all([
          firestore.collection('streets').limit(1).get(),
          firestore.collection('users').limit(1).get(),
        ]);

        const needsStreetsMigration = streetsCheckSnap.empty;
        const needsUsersMigration = usersCheckSnap.empty;

        if (!needsStreetsMigration && !needsUsersMigration) {
          autoMigrationDone = true;
          autoMigrationInFlight = false;
          return;
        }

        console.log('[Auto-Migration] Rilevata collezione pre-aggregata vuota (streets empty:', needsStreetsMigration, ', users empty:', needsUsersMigration, '). Avvio migrazione automatica da reviews...');
        const reviewsSnap = await firestore.collection('reviews').get();
        if (reviewsSnap.empty) {
          console.log('[Auto-Migration] Nessuna recensione storica presente in reviews.');
          autoMigrationDone = true;
          autoMigrationInFlight = false;
          return;
        }

        const cloudReviews = reviewsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // 1. Raggruppa le recensioni per strada con deduplicazione spaziale/toponomastica
        const streetGroups = [];
        cloudReviews.forEach(r => {
          const rawName = (r.streetName || '').trim();
          if (!rawName) return;
          const candidate = {
            name: rawName,
            city: r.streetCity,
            province: r.streetProvince || r.province || '',
            lat: r.latitude,
            lng: r.longitude,
          };
          let targetGroup = streetGroups.find(g => isSameStreet(g, candidate));
          if (!targetGroup) {
            targetGroup = {
              canonicalName: rawName,
              city: r.streetCity || '',
              province: r.streetProvince || r.province || '',
              postalCode: r.postalCode || '',
              latitude: Number(r.latitude) || 0,
              longitude: Number(r.longitude) || 0,
              reviews: [],
            };
            streetGroups.push(targetGroup);
          }
          if (!targetGroup.province && (r.streetProvince || r.province)) {
            targetGroup.province = r.streetProvince || r.province;
          }
          if (!targetGroup.postalCode && r.postalCode) {
            targetGroup.postalCode = r.postalCode;
          }
          targetGroup.reviews.push(r);
        });

        const migratedStreetDocs = [];
        const migratedUIStreets = [];
        const reviewsByAuthor = new Map();

        streetGroups.forEach(group => {
          const streetDoc = buildStreetSummaryDocFromReviews(group.reviews, {
            streetName: group.canonicalName,
            streetCity: group.city,
            province: group.province,
            postalCode: group.postalCode,
            latitude: group.latitude,
            longitude: group.longitude,
          });
          migratedStreetDocs.push(streetDoc);

          const formattedReviews = group.reviews.map(r => formatCloudReviewToUI(r, streetDoc));
          const uiStreet = mapStreetDocToUIStreet(streetDoc, {
            reviews: formattedReviews,
            reviewsLoaded: true,
          });
          migratedUIStreets.push(uiStreet);

          group.reviews.forEach(r => {
            const authorKey = r.authorId
              ? String(r.authorId)
              : `name:${(r.authorName || r.user || 'utente').trim().toLowerCase()}`;
            if (!reviewsByAuthor.has(authorKey)) {
              reviewsByAuthor.set(authorKey, []);
            }
            reviewsByAuthor.get(authorKey).push({
              ...r,
              streetKey: streetDoc.streetKey,
              streetName: streetDoc.streetName,
              streetCity: streetDoc.streetCity,
              streetProvince: streetDoc.province,
              isPioneer: Boolean(streetDoc.pioneerReviewId && r.id === streetDoc.pioneerReviewId),
            });
          });
        });

        // 2. Genera i documenti 'users/{authorId}'
        const migratedUserDocs = [];
        const migratedUserProfiles = [];
        reviewsByAuthor.forEach((userRevs, authorKey) => {
          const { userDoc, fullProfile } = buildUserSummaryDocFromReviews(
            authorKey,
            userRevs,
            migratedStreetDocs
          );
          migratedUserDocs.push(userDoc);
          migratedUserProfiles.push(fullProfile);
        });

        // Aggiorna immediatamente lo stato in memoria (così la UI mostra tutto anche prima del completamento scrittura)
        if (typeof onMigratedData === 'function') {
          onMigratedData({
            uiStreets: migratedUIStreets,
            userProfiles: migratedUserProfiles,
          });
        }

        // 3. Salva i documenti aggregati su Firestore in 'streets' e 'users' (e allinea streetKey sulle recensioni)
        const writePromises = [];
        migratedStreetDocs.forEach(sDoc => {
          writePromises.push(
            firestore.collection('streets').doc(sDoc.streetKey).set(sDoc, { merge: true }).catch(err => {
              console.warn('[Auto-Migration] Impossibile scrivere streets/' + sDoc.streetKey + ':', err?.message || err);
            })
          );
        });

        migratedUserDocs.forEach(uDoc => {
          writePromises.push(
            firestore.collection('users').doc(uDoc.authorId).set(uDoc, { merge: true }).catch(err => {
              console.warn('[Auto-Migration] Impossibile scrivere users/' + uDoc.authorId + ':', err?.message || err);
            })
          );
        });

        cloudReviews.forEach(r => {
          if (!r.streetKey && r.streetName) {
            const matchingS = migratedStreetDocs.find(s =>
              isSameStreet(s, { name: r.streetName, city: r.streetCity, province: r.streetProvince || r.province, lat: r.latitude, lng: r.longitude })
            );
            if (matchingS) {
              writePromises.push(
                firestore.collection('reviews').doc(r.id).set({
                  streetKey: matchingS.streetKey,
                  streetProvince: matchingS.province || '',
                }, { merge: true }).catch(() => {})
              );
            }
          }
        });

        await Promise.all(writePromises);
        autoMigrationDone = true;
        console.log(`[Auto-Migration] Migrazione completata con successo: ${migratedStreetDocs.length} strade in 'streets' e ${migratedUserDocs.length} profili in 'users'.`);
      } catch (err) {
        console.warn('[Auto-Migration] Errore durante la verifica/migrazione iniziale:', err);
      } finally {
        autoMigrationInFlight = false;
      }
    };

    // Utilità Globale di Ricalcolo Ponderato (40% Voto Globale + 60% Categorie Tecniche) per tutte le recensioni storiche e strade
    window.recalculateAllHistoricalRatings = async () => {
      const firestore = window.db;
      if (!firestore) {
        console.error("Firestore non inizializzato o non disponibile in window.db");
        return { success: false, error: "Database not connected" };
      }

      try {
        console.log("[RecalculateHistoricalRatings] Avvio ricalcolo recensioni e allineamento strade...");
        const reviewsSnap = await firestore.collection('reviews').get();

        const reviewUpdates = [];
        const reviewsByStreetKey = new Map();

        reviewsSnap.forEach(docSnap => {
          const revData = docSnap.data();
          const revId = docSnap.id;
          const ratingsObj = revData.ratings || revData.categoryRatings || null;

          // a. Verifica se l'oggetto dei voti di categoria contiene almeno un voto numerico valido (1..5) escludendo null, undefined, 'N/A' e stringhe vuote
          const validCatVals = [];
          if (ratingsObj && typeof ratingsObj === 'object') {
            const keys = (typeof CATEGORY_KEYS !== 'undefined' && Array.isArray(CATEGORY_KEYS)) ? CATEGORY_KEYS : Object.keys(ratingsObj);
            keys.forEach(k => {
              const rawVal = ratingsObj[k];
              if (rawVal === null || rawVal === undefined || rawVal === 'N/A' || rawVal === '') return;
              const num = Number(rawVal);
              if (!isNaN(num) && num >= 1 && num <= 5) {
                validCatVals.push(num);
              }
            });
          }

          // Base overall: rawOverallRating fallback a ratingOverall / overallRating
          const rawBase = revData.rawOverallRating !== undefined && revData.rawOverallRating !== null && !isNaN(Number(revData.rawOverallRating))
            ? revData.rawOverallRating
            : (revData.ratingOverall !== undefined && revData.ratingOverall !== null && !isNaN(Number(revData.ratingOverall))
                ? revData.ratingOverall
                : revData.overallRating);
          const baseOverall = Number(rawBase) || 0;

          let finalScore = Number(revData.ratingOverall !== undefined ? revData.ratingOverall : revData.overallRating) || 0;
          let needsUpdate = false;

          if (validCatVals.length > 0 && baseOverall > 0) {
            // b. Media ponderata: 40% baseOverall + 60% mediaCategorie
            const mediaCat = validCatVals.reduce((acc, v) => acc + v, 0) / validCatVals.length;
            const weighted = (baseOverall * 0.40) + (mediaCat * 0.60);
            finalScore = Math.round(weighted * 10) / 10;

            const currentScore = Number(revData.ratingOverall !== undefined ? revData.ratingOverall : revData.overallRating);
            if (Math.abs(currentScore - finalScore) > 0.001 || revData.rawOverallRating === undefined) {
              needsUpdate = true;
            }
          } else {
            // c. Nessuna categoria valida (recensione Flash pura): mantieni invariato ratingOverall
            finalScore = baseOverall > 0 ? baseOverall : (Number(revData.ratingOverall || revData.overallRating) || 0);
            if (revData.rawOverallRating === undefined && baseOverall > 0) {
              needsUpdate = true;
            }
          }

          let resolvedStreetKey = revData.streetKey;
          if (!resolvedStreetKey && revData.streetName) {
            const rCity = revData.streetCity || revData.city || '';
            const rProv = revData.streetProvince || revData.province || '';
            const rLat = revData.latitude;
            const rLng = revData.longitude;
            resolvedStreetKey = createStreetCompositeKey(revData.streetName, rCity, rLat, rLng, rProv);
          }
          if (!resolvedStreetKey) {
            resolvedStreetKey = revData.streetId || docSnap.id;
          }

          const updatedRevDoc = {
            ...revData,
            id: revId,
            ratingOverall: finalScore,
            overallRating: finalScore,
            rawOverallRating: baseOverall > 0 ? baseOverall : finalScore,
            streetKey: resolvedStreetKey,
          };

          if (needsUpdate) {
            reviewUpdates.push({
              ref: docSnap.ref,
              data: {
                ratingOverall: finalScore,
                overallRating: finalScore,
                rawOverallRating: baseOverall > 0 ? baseOverall : finalScore,
                updatedAt: new Date().toISOString()
              }
            });
          }

          if (resolvedStreetKey) {
            if (!reviewsByStreetKey.has(resolvedStreetKey)) {
              reviewsByStreetKey.set(resolvedStreetKey, []);
            }
            reviewsByStreetKey.get(resolvedStreetKey).push(updatedRevDoc);
          }
        });

        // Batch helper: chunk a blocchi di max 400 operazioni (limite Firestore: 500)
        const commitBatches = async (items) => {
          const CHUNK_SIZE = 400;
          for (let i = 0; i < items.length; i += CHUNK_SIZE) {
            const chunk = items.slice(i, i + CHUNK_SIZE);
            const batch = firestore.batch();
            chunk.forEach(item => {
              batch.set(item.ref, item.data, { merge: true });
            });
            await batch.commit();
          }
        };

        if (reviewUpdates.length > 0) {
          await commitBatches(reviewUpdates);
          console.log(`[RecalculateHistoricalRatings] Aggiornate ${reviewUpdates.length} recensioni in 'reviews'.`);
        }

        // Ricalcola i documenti delle strade a partire dalle recensioni aggiornate
        const streetUpdates = [];
        for (const [sKey, streetRevs] of reviewsByStreetKey.entries()) {
          const sample = streetRevs[0] || {};
          const streetSummaryDoc = buildStreetSummaryDocFromReviews(streetRevs, {
            streetKey: sKey,
            streetName: sample.streetName,
            streetCity: sample.streetCity || sample.city,
            province: sample.streetProvince || sample.province,
            postalCode: sample.postalCode,
            latitude: sample.latitude,
            longitude: sample.longitude,
          });

          streetUpdates.push({
            ref: firestore.collection('streets').doc(sKey),
            data: streetSummaryDoc
          });
        }

        if (streetUpdates.length > 0) {
          await commitBatches(streetUpdates);
          console.log(`[RecalculateHistoricalRatings] Aggiornate ${streetUpdates.length} strade in 'streets'.`);
        }

        const updatedReviewsCount = reviewUpdates.length;
        const updatedStreetsCount = streetUpdates.length;

        console.log(`Ricalcolo completato: ${updatedReviewsCount} recensioni aggiornate, ${updatedStreetsCount} strade riallineate.`);
        return {
          success: true,
          updatedReviews: updatedReviewsCount,
          updatedStreets: updatedStreetsCount
        };
      } catch (err) {
        console.error("[RecalculateHistoricalRatings] Errore durante il ricalcolo storico:", err);
        throw err;

          let minTime = parseReviewTimestampMs(fallbackPioneerRev);
          for (let i = revList.length - 1; i >= 0; i--) {
            const r = revList[i];
            const t = parseReviewTimestampMs(r);
            if (t < minTime) {
              minTime = t;
              fallbackPioneerRev = r;
            }
          }
        }

        if (pioneerId || fallbackPioneerRev) {
          streetPioneerMap[street.id] = {
            reviewId: pioneerRevId || fallbackPioneerRev?.id || null,
            authorKey: pioneerId || fallbackPioneerRev?.userId || fallbackPioneerRev?.user,

            cityMap.set(String(prof.authorId), {
              authorId: prof.authorId,
              name: prof.name,
              avatarUrl: prof.avatarUrl,
              xp: Number(cs.xp) || 0,
              uniqueStreetsCount: Number(cs.uniqueStreetsCount) || 0,
              pioneerCount: Number(cs.pioneerCount) || 0,
              guardianCount: 0,
              reviewsCount: Number(cs.reviewsCount) || 0,
              helpfulReceivedCount: Number(cs.helpfulReceivedCount) || 0,
            });
          }
        });
      });

      // Costruisci le classifiche per ogni Comune attivo e assegna il titolo "🎩 Sindaco di [Nome Città]"
      const cityLeaderboards = {};
      const mayorCitiesByAuthorId = {};
      const mayorCitiesByAuthorName = {};

      const availableCities = Array.from(availableCitiesMap.values()).sort((a, b) => {
        if (a.cityKey === 'san-benedetto-del-tronto') return -1;
        if (b.cityKey === 'san-benedetto-del-tronto') return 1;
        return (b.streetsCount - a.streetsCount) || (b.reviewsCount - a.reviewsCount);
      });

      availableCities.forEach(cityObj => {
        const cKey = cityObj.cityKey;
        const cName = cityObj.cityName;
        const rawMap = cityUserTrackers[cKey] || new Map();
        const entries = [];

        rawMap.forEach((t, key) => {
          const fullProf = userStatsByKey[String(t.authorId)] || userStatsByName[(t.name || '').trim().toLowerCase()] || hydrateUserProfileFromDoc(t);
          const streetsInCity = t.streetIds ? t.streetIds.size : (Number(t.uniqueStreetsCount) || 0);
          const pioneerInCity = t.pioneerIds ? t.pioneerIds.size : (Number(t.pioneerCount) || 0);
          const guardianInCity = t.guardianIds ? t.guardianIds.size : (Number(t.guardianCount) || 0);
          const xpInCity = Number(t.xp) || 0;
          if (xpInCity <= 0 || streetsInCity <= 0) return;

          entries.push({
            ...fullProf,
            authorId: fullProf.authorId || t.authorId,
            name: fullProf.name || t.name,
            avatarUrl: fullProf.avatarUrl || t.avatarUrl,
            xp: xpInCity,
            totalGlobalXP: fullProf.xp || xpInCity,
            uniqueStreetsCount: streetsInCity,
            pioneerCount: pioneerInCity,
            guardianCount: guardianInCity,
            reviewsCount: Number(t.reviewsCount) || streetsInCity,
            cityKey: cKey,
            cityName: cName,
          });
        });

        entries.sort((a, b) => {
          if (b.xp !== a.xp) return b.xp - a.xp;
          if (b.uniqueStreetsCount !== a.uniqueStreetsCount) return b.uniqueStreetsCount - a.uniqueStreetsCount;
          if (b.pioneerCount !== a.pioneerCount) return b.pioneerCount - a.pioneerCount;
          return b.reviewsCount - a.reviewsCount;
        });

        const rankedCityEntries = entries.slice(0, 10).map((entry, idx) => {
          const rank = idx + 1;
          // Il 1° classificato nel Comune con almeno 2 vie recensite in quel comune è il "🎩 Sindaco di [Città]"
          const isCityMayor = rank === 1 && entry.uniqueStreetsCount >= 2;
          const cityMayorTitle = isCityMayor ? `🎩 Sindaco di ${cName}` : null;

          if (isCityMayor) {
            const uid = String(entry.authorId);
            if (!mayorCitiesByAuthorId[uid]) mayorCitiesByAuthorId[uid] = [];
            if (!mayorCitiesByAuthorId[uid].includes(cName)) mayorCitiesByAuthorId[uid].push(cName);

            const uName = (entry.name || '').trim().toLowerCase();
            if (uName) {
              if (!mayorCitiesByAuthorName[uName]) mayorCitiesByAuthorName[uName] = [];
              if (!mayorCitiesByAuthorName[uName].includes(cName)) mayorCitiesByAuthorName[uName].push(cName);
            }
          }

          return {
            ...entry,
            rank,
            isCityMayor,
            cityMayorTitle,
          };
        });

        cityLeaderboards[cKey] = rankedCityEntries;
        if (cName && cName !== cKey) {
          cityLeaderboards[cName] = rankedCityEntries;
        }
      });

      // Propaga i titoli di Sindaco a tutti i profili utente in memoria
      Object.values(userStatsByKey).forEach(prof => {
        if (!prof) return;
        const mById = prof.authorId ? (mayorCitiesByAuthorId[String(prof.authorId)] || []) : [];
        const mByName = prof.name ? (mayorCitiesByAuthorName[prof.name.trim().toLowerCase()] || []) : [];
        const mergedCities = Array.from(new Set([...mById, ...mByName]));
        prof.mayorCities = mergedCities;
        prof.mayorTitles = mergedCities.map(c => `🎩 Sindaco di ${c}`);
      });

      const allUniqueUsers = new Map();
      [...hydratedLeaderboardUsers, ...Object.values(userStatsByKey)].forEach(u => {
        if (!u || !u.authorId) return;
        const key = String(u.authorId);
        const enriched = userStatsByKey[key] || u;
        if (!allUniqueUsers.has(key) || (enriched.xp || 0) >= (allUniqueUsers.get(key).xp || 0)) {
          allUniqueUsers.set(key, enriched);
        }
      });

      const leaderboard = Array.from(allUniqueUsers.values())
        .filter(u => (u.xp || 0) > 0 && (u.reviewsCount || 0) > 0)
        .sort((a, b) => {
          if (b.xp !== a.xp) return b.xp - a.xp;
          if (b.pioneerCount !== a.pioneerCount) return b.pioneerCount - a.pioneerCount;
          return b.reviewsCount - a.reviewsCount;
        })
        .slice(0, 10)
        .map((u, idx) => ({ ...u, rank: idx + 1 }));

      let currentUserProfile = createDefaultProfile(activeUser);
      if (activeUser) {
        const byId = activeUser.id ? userStatsByKey[String(activeUser.id)] : null;
        const byName = activeUser.name ? userStatsByName[activeUser.name.trim().toLowerCase()] : null;
        if (byId || byName) {
          const matched = byId || byName;
          const mergedMilestones = Array.from(new Set([
            ...(matched.awardedMilestones || []),

          currentUserProfile = {

            name: activeUser.name || matched.name,

            favoriteBadge: matched.favoriteBadge || getLocalFavoriteBadge(activeUser.id) || null,
            awardedMilestones: mergedMilestones,
          };
        }
      }

      const getAuthorProfile = (rev) => {
        if (!rev) return createDefaultProfile(null);
        if (rev.userId && userStatsByKey[String(rev.userId)]) {
          return userStatsByKey[String(rev.userId)];
        }
        if (rev.user && userStatsByName[rev.user.trim().toLowerCase()]) {
          return userStatsByName[rev.user.trim().toLowerCase()];
        }
        // Fallback leggero per autori non presenti in Top 10 e non ancora in cache
        const singleXp = reviewMetaMap[rev.id]?.totalXP || 50;
        return hydrateUserProfileFromDoc({
          authorId: rev.userId || rev.user,
          authorName: rev.user || 'Cittadino Esploratore',
          authorAvatar: rev.avatarUrl || '',
          xp: singleXp,
          reviewsCount: 1,
          uniqueStreetsCount: 1,
          citiesCount: 1,
          pioneerCount: reviewMetaMap[rev.id]?.isPioneer ? 1 : 0,
        });
      };

      return {
        leaderboard,
        cityLeaderboards,
        availableCities,
        currentUserProfile,
        reviewMetaMap,
        streetPioneerMap,
        getAuthorProfile,
        totalExplorers: Math.max(leaderboard.length, allUniqueUsers.size),
      };
    };

      // --- 1. SINCRONIZZAZIONE LEGGERA ALL'AVVIO: COLLEZIONI PRE-AGGREGATE 'streets' E 'users' (TOP 10) ---
      useEffect(() => {

        // Listener 1: Collezione leggera 'streets' per disegnare i PIN sulla mappa e popolare i filtri
        console.log("Attivazione listener leggero su Firestore collection 'streets'...");
        const unsubscribeStreets = firestore.collection('streets').onSnapshot(

            console.log('Sommari strade caricati da Firestore (streets):', snapshot.docs.length);
            setStreets(prevStreets => {

              prevStreets.forEach(s => {

        console.log("Attivazione listener leggero su Firestore collection 'users' (Top 10 XP)...");
        const unsubscribeUsers = firestore.collection('users')

        setTimeout(() => {

        const unsubscribeReviews = firestore.collection('reviews').onSnapshot(

      // --- 2. CARICAMENTO COMMENTI "ON-DEMAND" (SOLO ALL'APERTURA DELLA SCHEDA DI UNA VIA) ---
      const fetchReviewsForStreetOnDemand = async (targetStreet) => {
        const firestore = window.db;
        if (!firestore || !targetStreet) return;

        const targetStreetKey = targetStreet.streetKey || createStreetCompositeKey(
          targetStreet.name,
          targetStreet.city,
          targetStreet.latitude,
          targetStreet.longitude,
          targetStreet.province
        );

        // Se la strada è un segnaposto nuovo a 0 recensioni, non serve interrogare Firestore
        if ((targetStreet.reviewsCount || 0) === 0 && (!targetStreet.reviews || targetStreet.reviews.length === 0)) {
          setIsLoadingComments(false);
          return;
        }

        setIsLoadingComments(true);
        try {
          const collectedDocsMap = new Map();

          // Query 1: Ricerca mirata tramite streetKey normalizzata
          const byKeySnap = await firestore.collection('reviews')
            .where('streetKey', '==', targetStreetKey)
            .get();
          byKeySnap.docs.forEach(doc => {
            collectedDocsMap.set(doc.id, { id: doc.id, ...doc.data() });
          });

          // Query 2 (Fallback Retrocompatibilità): se ci sono documenti legacy salvati prima dell'introduzione di streetKey
          if (collectedDocsMap.size < (targetStreet.reviewsCount || 1) && targetStreet.name) {
            const byNameSnap = await firestore.collection('reviews')
              .where('streetName', '==', targetStreet.name)
              .get();
            byNameSnap.docs.forEach(doc => {
              if (!collectedDocsMap.has(doc.id)) {
                const rData = doc.data();
                if (isSameStreet(targetStreet, {
                  name: rData.streetName,
                  city: rData.streetCity,
                  province: rData.streetProvince || rData.province,
                  lat: rData.latitude,
                  lng: rData.longitude,
                })) {
                  collectedDocsMap.set(doc.id, { id: doc.id, ...rData });
                }
              }
            });
          }

          const rawReviewsList = Array.from(collectedDocsMap.values());
          const formattedReviews = rawReviewsList.map(r => formatCloudReviewToUI(r, { ...targetStreet, streetKey: targetStreetKey }));

          // Carica on-demand anche i profili 'users/{authorId}' degli autori dei commenti non ancora presenti in cache
          const missingAuthorIds = Array.from(new Set(
            formattedReviews
              .map(r => r.userId && String(r.userId))
              .filter(uid => uid && !uid.startsWith('name:') && !cachedUsersRef.current[uid])
          ));
          if (missingAuthorIds.length > 0) {
            const authorSnaps = await Promise.all(
              missingAuthorIds.map(uid => firestore.collection('users').doc(uid).get().catch(() => null))
            );
            const newCachedAuthors = {};
            authorSnaps.forEach(snap => {
              if (snap && snap.exists) {
                const prof = hydrateUserProfileFromDoc({ id: snap.id, ...snap.data() });
                newCachedAuthors[String(snap.id)] = prof;
              }
            });
            if (Object.keys(newCachedAuthors).length > 0) {
              setCachedUsersById(prev => ({ ...prev, ...newCachedAuthors }));
            }
          }

          // Ricalcola gli aggregati (tipologia prevalente sulle ultime 10 recensioni, media complessiva e categorie con supporto N/A)
          const onDemandAgg = formattedReviews.length > 0
            ? computeStreetAggregatesFromReviews(formattedReviews, targetStreet.name, targetStreet.streetType)
            : null;

          const onDemandGuardian = formattedReviews.length > 0
            ? computeStreetGuardian(formattedReviews, (revObj, gId) => {
                const cached = gId ? cachedUsersRef.current[String(gId)] : null;
                if (cached?.levelInfo?.level) return cached.levelInfo.level;
                return 1;
              })
            : null;

          if (onDemandGuardian && onDemandGuardian.guardianId && !targetStreet.guardianId) {
            firestore.collection('streets').doc(targetStreetKey).set({
              guardianId: onDemandGuardian.guardianId,
              guardianName: onDemandGuardian.guardianName,
              guardianAvatar: onDemandGuardian.guardianAvatar,
              guardianLevel: onDemandGuardian.guardianLevel || 1,
              guardianScore: onDemandGuardian.guardianScore || 0,
            }, { merge: true }).catch(() => {});
          }

          // Aggiorna la strada selezionata e la lista strade con i commenti caricati on-demand
          setStreets(prevStreets => {
            const next = prevStreets.map(s => {
              if ((s.streetKey && s.streetKey === targetStreetKey) || isSameStreet(s, targetStreet)) {
                return {
                  ...s,
                  streetKey: targetStreetKey,
                  ...(onDemandAgg ? {
                    streetType: onDemandAgg.streetType,
                    avgOverallRating: onDemandAgg.ratingOverall || s.avgOverallRating,
                    categoryAverages: onDemandAgg.categoryAverages,
                    roadObstacles: onDemandAgg.roadObstacles,
                  } : {}),
                  ...(onDemandGuardian && onDemandGuardian.guardianId ? {
                    guardianId: onDemandGuardian.guardianId,
                    guardianName: onDemandGuardian.guardianName,
                    guardianAvatar: onDemandGuardian.guardianAvatar,
                    guardianLevel: onDemandGuardian.guardianLevel || s.guardianLevel || 1,
                    guardianScore: onDemandGuardian.guardianScore || 0,
                  } : {}),
                  reviews: formattedReviews,
                  reviewsCount: Math.max(s.reviewsCount || 0, formattedReviews.length),
                  reviewsLoaded: true,
                };
              }
              return s;
            });
            streetsRef.current = next;
            return next;
          });

          setSelectedStreet(prevSel => {
            if (!prevSel) return prevSel;
            if ((prevSel.streetKey && prevSel.streetKey === targetStreetKey) || isSameStreet(prevSel, targetStreet)) {
              return {
                ...prevSel,
                streetKey: targetStreetKey,
                ...(onDemandAgg ? {
                  streetType: onDemandAgg.streetType,
                  avgOverallRating: onDemandAgg.ratingOverall || prevSel.avgOverallRating,
                  categoryAverages: onDemandAgg.categoryAverages,
                  roadObstacles: onDemandAgg.roadObstacles,
                } : {}),
                ...(onDemandGuardian && onDemandGuardian.guardianId ? {
                  guardianId: onDemandGuardian.guardianId,
                  guardianName: onDemandGuardian.guardianName,
                  guardianAvatar: onDemandGuardian.guardianAvatar,
                  guardianLevel: onDemandGuardian.guardianLevel || prevSel.guardianLevel || 1,
                  guardianScore: onDemandGuardian.guardianScore || 0,
                } : {}),
                reviews: formattedReviews,
                reviewsCount: Math.max(prevSel.reviewsCount || 0, formattedReviews.length),
                reviewsLoaded: true,
              };
            }
            return prevSel;
          });
        } catch (err) {
          console.error('Errore caricamento commenti on-demand per la strada:', targetStreetKey, err);
        } finally {
          setIsLoadingComments(false);
        }
      };

      // Trigger automatico del caricamento commenti On-Demand quando l'utente apre la Scheda della Strada
      useEffect(() => {
        if (!selectedStreet || sheetSnap === 'hidden') return;
        if (!selectedStreet.reviewsLoaded && (selectedStreet.reviewsCount || 0) > 0) {
          fetchReviewsForStreetOnDemand(selectedStreet);
        }
      }, [selectedStreet?.id, selectedStreet?.streetKey, sheetSnap]);

      // Mantieni allineata la scheda della strada attualmente aperta con i dati in tempo reale
      useEffect(() => {
        if (!selectedStreet) return;
        const matching = (streets || []).find(s =>
          areStreetKeysEquivalent(s.streetKey || s.id, selectedStreet.streetKey || selectedStreet.id)
        ) || findExistingStreetInList(streets, selectedStreet);

        if (matching && (
          matching.id !== selectedStreet.id ||
          matching.streetType !== selectedStreet.streetType ||
          matching.reviewsCount !== selectedStreet.reviewsCount ||
          matching.avgOverallRating !== selectedStreet.avgOverallRating ||
          (matching.reviews?.length || 0) !== (selectedStreet.reviews?.length || 0) ||
          matching.latitude !== selectedStreet.latitude ||
          matching.longitude !== selectedStreet.longitude
        )) {
          setSelectedStreet(matching);
        }
      }, [streets]);

      // Rilevamento automatico del Deep Link all'avvio (?street=...)
      const deepLinkProcessedRef = useRef(false);
      useEffect(() => {
        if (deepLinkProcessedRef.current) return;
        const urlParams = new URLSearchParams(window.location.search);
        const targetStreetKey = urlParams.get('street');
        if (!targetStreetKey) {
          deepLinkProcessedRef.current = true;
          return;
        }

        // Attendiamo che il motore mappa sia inizializzato
        if (!mapEngine || (!googleMapRef.current && !leafletMapRef.current)) return;

        let isMounted = true;

        const processDeepLink = async () => {
          const decodedTarget = decodeURIComponent(targetStreetKey).trim();
          if (!decodedTarget) {
            deepLinkProcessedRef.current = true;
            return;
          }

          // 1. Cerca prima nelle strade già caricate in memoria (streetsRef.current)
          let target = (streetsRef.current || []).find(s =>
            (s.id && s.id === decodedTarget) ||
            (s.streetKey && s.streetKey === decodedTarget) ||
            (s.id && s.id.replace(/^street-/, '') === decodedTarget.replace(/^street-/, '')) ||
            (s.streetKey && s.streetKey.toLowerCase() === decodedTarget.toLowerCase()) ||
            (s.name && s.name.toLowerCase() === decodedTarget.toLowerCase())
          );

          // 2. Se non ancora in memoria, interroga Firestore on-demand
          if (!target && window.firebase && window.firebase.firestore) {
            try {
              const db = window.firebase.firestore();
              let docSnap = await db.collection('streets').doc(decodedTarget).get();
              if (!docSnap.exists) {
                const cleanKey = decodedTarget.replace(/^street-/, '');
                docSnap = await db.collection('streets').doc(cleanKey).get();
              }
              if (!docSnap.exists) {
