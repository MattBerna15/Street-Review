                        </span>
                      </h4>
                      <p className="text-[11px] text-amber-50">
                        {selectedCityKey === 'ALL'
                          ? 'Classifica nazionale calcolata in tempo reale dalle recensioni pubblicate su Firestore'
                          : `Punti XP e strade recensite nel Comune di ${selectedCityDisplayName}`}
                      </p>
                    </div>
                    <div className="bg-white/20 backdrop-blur-xs px-3 py-1.5 rounded-2xl text-right shrink-0">
                      <p className="text-[10px] uppercase font-bold text-amber-100">Esploratori</p>
                      <p className="text-lg font-black">{activeLeaderboardList.length}</p>
                    </div>
                  </div>

                  {/* Podio "🎩 Sindaco di [Città]" quando una città è selezionata */}
                  {selectedCityKey !== 'ALL' && (
                    cityMayorEntry ? (
                      <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-100/90 via-yellow-50 to-amber-100/80 border-2 border-amber-400 shadow-xs flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <div className="w-11 h-11 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center text-2xl shrink-0 shadow-xs">
                            🎩
                          </div>
                          <div className="min-w-0">
                            <span className="text-[10px] font-black uppercase tracking-wider text-amber-800 block">
                              Titolo Onorario Cittadino Attivo
                            </span>
                            <p className="text-sm font-black text-slate-900 truncate">
                              🎩 Sindaco di {selectedCityDisplayName}: <span className="text-amber-900">{cityMayorEntry.name}</span>
                            </p>
                            <p className="text-[11px] text-slate-600 font-semibold">
                              1° posto con <strong>{cityMayorEntry.xp} XP</strong> e <strong>{cityMayorEntry.uniqueStreetsCount} vie</strong> recensite a {selectedCityDisplayName}
                            </p>
                          </div>
                        </div>
                        <span className="hidden sm:inline-block px-3 py-1 rounded-full bg-amber-900 text-amber-200 font-black text-[11px] shrink-0">
                          🥇 1° Posto
                        </span>
                      </div>
                    ) : (
                      <div className="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200 text-amber-900 flex items-center gap-2.5 text-xs">
                        <span className="text-lg">🎩</span>
                        <span>
                          Il titolo di <strong>🎩 Sindaco di {selectedCityDisplayName}</strong> è vacante! Recensisci almeno <strong>2 strade</strong> in questo Comune e conquista il 1° posto.
                        </span>
                      </div>
                    )
                  )}

                  {activeLeaderboardList.length === 0 ? (
                    <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 space-y-2">
                      <div className="text-3xl">🧭</div>
                      <p className="text-sm font-bold text-slate-800">Nessun esploratore ancora in questa classifica</p>
                      <p className="text-xs text-slate-500">Pubblica la prima recensione per conquistare il 1° posto!</p>
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {activeLeaderboardList.map((entry, idx) => {
                        const isMe = currentUser && (entry.authorId === currentUser.id || entry.name.toLowerCase() === currentUser.name.toLowerCase());
                        const rankMedal = entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : `#${entry.rank}`;
                        const entryLvl = entry.levelInfo;
                        const entryPinnedBadge = entry.favoriteBadge
                          ? GAMIFICATION_BADGES.find(b => b.id === entry.favoriteBadge && (entry.unlockedBadgeIds || []).includes(b.id))
                          : null;
                        const entryMayorTitles = Array.isArray(entry.mayorTitles) ? entry.mayorTitles : [];

                        return (
                          <div
                            key={`${selectedCityKey}-${entry.authorId || entry.id || idx}`}
                            className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 transition-all ${
                              isMe
                                ? 'bg-blue-50/70 border-blue-400 ring-2 ring-blue-500/20 shadow-sm'
                                : entry.rank === 1
                                ? 'bg-gradient-to-r from-amber-50/90 via-white to-yellow-50/80 border-amber-300 shadow-xs'
                                : 'bg-white border-slate-200/90 hover:border-slate-300'
                            }`}
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-sm shrink-0 ${
                                entry.rank === 1 ? 'bg-amber-400 text-slate-950 shadow-xs' :
                                entry.rank === 2 ? 'bg-slate-200 text-slate-800' :
                                entry.rank === 3 ? 'bg-amber-700/20 text-amber-900' :
                                'bg-slate-100 text-slate-500 text-xs'
                              }`}>
                                {rankMedal}
                              </div>

                              <div className="relative shrink-0">
                                {entry.avatarUrl ? (
                                  <img
                                    src={entry.avatarUrl}
                                    alt={entry.name}
                                    className={`w-10 h-10 rounded-full border-2 object-cover ${entryLvl.avatarBorderClass}`}
                                    referrerPolicy="no-referrer"
                                  />
                                ) : (
                                  <div className={`w-10 h-10 rounded-full bg-slate-100 text-slate-800 border-2 flex items-center justify-center font-black text-sm ${entryLvl.avatarBorderClass}`}>
                                    {entry.name ? entry.name.charAt(0).toUpperCase() : 'U'}
                                  </div>
                                )}
                                <span className="absolute -bottom-1 -right-1 text-xs bg-white rounded-full px-0.5 shadow-2xs border border-slate-200">
                                  {entryLvl.icon}
                                </span>
                              </div>

                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <p className="font-black text-slate-900 text-xs sm:text-sm truncate">{entry.name}</p>
                                  {isMe && (
                                    <span className="text-[10px] font-extrabold bg-blue-600 text-white px-2 py-0.5 rounded-full">
                                      Tu
                                    </span>
                                  )}
                                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${entryLvl.badgeClass}`}>
                                    Liv. {entryLvl.level} · {entryLvl.fullTitle}
                                  </span>
                                  {entryPinnedBadge && (
                                    <span
                                      title={`Spilla in Vetrina: ${entryPinnedBadge.name}`}
                                      className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-indigo-50 text-indigo-800 border border-indigo-200"
                                    >
                                      <span>{entryPinnedBadge.icon}</span>
                                      <span className="hidden sm:inline">{entryPinnedBadge.name}</span>
                                    </span>
                                  )}
                                  {selectedCityKey !== 'ALL' && (entry.isCityMayor || entry.isMayorOfSelectedCity) && (
                                    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-300/90 text-amber-950 border border-amber-500">
                                      🎩 Sindaco di {selectedCityDisplayName}
                                    </span>
                                  )}
                                  {selectedCityKey === 'ALL' && entryMayorTitles.length > 0 && (
                                    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-200/90 text-amber-950 border border-amber-400">
                                      {entryMayorTitles[0]}{entryMayorTitles.length > 1 ? ` +${entryMayorTitles.length - 1}` : ''}
                                    </span>
                                  )}
                                </div>
                                <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-500 font-semibold mt-0.5">
                                  <span>🛣️ {entry.uniqueStreetsCount} {entry.uniqueStreetsCount === 1 ? 'via' : 'vie'}{selectedCityKey !== 'ALL' ? ` a ${selectedCityDisplayName}` : ''}</span>
                                  {entry.pioneerCount > 0 && (
                                    <span className="text-amber-700 font-bold">· 🧭 {entry.pioneerCount} da Pioniere</span>
                                  )}
                                  {selectedCityKey === 'ALL' && (
                                    <span>· 🏅 {entry.unlockedBadgesCount} badge</span>
                                  )}
                                </div>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="inline-block px-3 py-1 rounded-xl bg-slate-900 text-amber-300 font-black text-xs sm:text-sm shadow-2xs">
                                {entry.xp} XP
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SOTTORAPPRESENTAZIONE MODALE RECENSIONE INTERATTIVA ---
    function ReviewModal({ streetName, currentUser, initialData, defaultStreetSegment = '', isPioneerCandidate, onClose, onSubmit, onDelete, onOpenPrivacy }) {
      const isEditing = Boolean(initialData);

      // Risoluzione iniziale tipologia strada (priorità: dato salvato in precedenza, altrimenti rilevamento da nome via)
      const resolveInitialStreetType = () => {
        if (initialData?.streetType) {
          return normalizeStreetTypeLabel(initialData.streetType) || detectStreetTypeFromStreetName(streetName);
        }
        return detectStreetTypeFromStreetName(streetName);
      };

      const [streetType, setStreetType] = useState(resolveInitialStreetType);

      // Voto complessivo Google Places style (1 a 5)
      const [overallRating, setOverallRating] = useState(() => {
        if (initialData) {
          const rawStars = Number(initialData.rawOverallRating);
          if (!isNaN(rawStars) && rawStars >= 1 && rawStars <= 5) return Math.round(rawStars);
          const old = getSingleReviewOverallScore(initialData);
          if (old >= 1 && old <= 5) return Math.round(old);
        }
        return 0;
      });
      const [hoverRating, setHoverRating] = useState(0);

      // Accordion parametri tecnici e tracciamento compilazione Flash vs Approfondita
      const [isAccordionOpen, setIsAccordionOpen] = useState(false);
      const [hasTouchedTechnical, setHasTouchedTechnical] = useState(Boolean(initialData));

      // Generazione ratings tecnici iniziali
      const buildRatingsState = () => {
        if (initialData?.ratings && typeof initialData.ratings === 'object') {
          const hasAnyNumericRating = TECHNICAL_CATEGORIES.some(cat => {
            const v = initialData.ratings[cat.key];
            return v !== null && v !== undefined && v !== 'N/A' && v !== '' && !isNaN(Number(v)) && Number(v) >= 1;
          });

          const res = {};
          TECHNICAL_CATEGORIES.forEach(cat => {
            const v = initialData.ratings[cat.key];
            if (v !== null && v !== undefined && v !== 'N/A' && v !== '' && !isNaN(Number(v)) && Number(v) >= 1 && Number(v) <= 5) {
              res[cat.key] = Number(v);
            } else if (hasAnyNumericRating || v === 'N/A') {
              res[cat.key] = 'N/A';
            } else {
              res[cat.key] = null;
            }
          });
          return res;
        }

        // Per NUOVE recensioni: stato neutro e non valutato per tutte le 13 voci (nessuna stella, nessun N/A)
        const res = {};
        TECHNICAL_CATEGORIES.forEach(cat => {
          res[cat.key] = null;
        });
        return res;
      };

      const [ratings, setRatings] = useState(buildRatingsState);
      const [parkingTypes, setParkingTypes] = useState(initialData?.parkingTypes || ['FREE']);
      const [hasCyclePath, setHasCyclePath] = useState(initialData?.hasCyclePath || false);
      const [amenities, setAmenities] = useState(initialData?.amenities || []);
      const [roadObstacles, setRoadObstacles] = useState(() => Array.isArray(initialData?.roadObstacles) ? initialData.roadObstacles : []);
      const [streetSegment, setStreetSegment] = useState(initialData?.streetSegment || '');
      const [comment, setComment] = useState(initialData?.comment || '');
      const [moderationError, setModerationError] = useState('');
      const [isCheckingModeration, setIsCheckingModeration] = useState(false);

      // Verifica se una categoria ha uno stato valido (voto 1-5 oppure N/A esplicito)
      const isCategoryCompleted = (val) => {
        if (val === 'N/A') return true;
        const num = Number(val);
        return !isNaN(num) && num >= 1 && num <= 5;
      };

      const completedCategoriesCount = TECHNICAL_CATEGORIES.filter(cat => isCategoryCompleted(ratings[cat.key])).length;
      const areAllCategoriesCompleted = completedCategoriesCount === TECHNICAL_CATEGORIES.length;

      // Calcolo dinamico del voto bilanciato (40% sintetico + 60% categorie tecniche)
      const balancedScore = useMemo(() => {
        return computeWeightedReviewRating(overallRating, ratings, isAccordionOpen);
      }, [overallRating, ratings, isAccordionOpen]);

      const isPublishDisabled =
        overallRating === 0 ||
        isCheckingModeration ||
        (isAccordionOpen && !areAllCategoriesCompleted);

      useEffect(() => {
        setModerationError('');
        setIsCheckingModeration(false);
        if (initialData) {
          const loadedType = resolveInitialStreetType();
          setStreetType(loadedType);
          const rawStars = Number(initialData.rawOverallRating);
          const old = (!isNaN(rawStars) && rawStars >= 1 && rawStars <= 5) ? rawStars : getSingleReviewOverallScore(initialData);
          setOverallRating(old >= 1 && old <= 5 ? Math.round(old) : 0);
          setRatings(buildRatingsState());
          const hadTechnical = TECHNICAL_CATEGORIES.some(cat => {
            const v = initialData.ratings?.[cat.key];
            return v !== null && v !== undefined && v !== 'N/A' && v !== '' && !isNaN(Number(v)) && Number(v) >= 1;
          });
          setHasTouchedTechnical(hadTechnical);
          setIsAccordionOpen(hadTechnical);
          setParkingTypes(initialData.parkingTypes || []);
          setHasCyclePath(initialData.hasCyclePath || false);
          setAmenities(initialData.amenities || []);
          setRoadObstacles(Array.isArray(initialData.roadObstacles) ? initialData.roadObstacles : []);
          setStreetSegment(initialData.streetSegment || '');
          setComment(initialData.comment || '');
        } else {
          const autoType = detectStreetTypeFromStreetName(streetName);
          setStreetType(autoType);
          setOverallRating(0);
          setRatings(buildRatingsState());
          setHasTouchedTechnical(false);
          setIsAccordionOpen(false);
          setParkingTypes(['FREE']);
          setHasCyclePath(false);
          setAmenities([]);
          setRoadObstacles([]);
          setStreetSegment('');
          setComment('');
        }
      }, [initialData, streetName]);

      // Cambio tipologia strada (non altera le valutazioni tecniche)
      const handleSelectStreetType = (newType) => {
        setStreetType(newType);
      };

      // Toggle pulsante N/A per parametro tecnico (se attivo, torna a null neutro; se non attivo, imposta a 'N/A')
      const toggleNA = (catKey) => {
        setHasTouchedTechnical(true);
        setRatings(prev => ({
          ...prev,
          [catKey]: prev[catKey] === 'N/A' ? null : 'N/A',
        }));
      };

      // Click stella categoria tecnica
      const handleCategoryStarClick = (catKey, starVal) => {
        setHasTouchedTechnical(true);
        setRatings(prev => ({
          ...prev,
          [catKey]: starVal,
        }));
      };

      const toggleParking = (type) => {
        setParkingTypes(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
      };

      const toggleAmenity = (val) => {
        setAmenities(prev => prev.includes(val) ? prev.filter(a => a !== val) : [...prev, val]);
      };

      const toggleRoadObstacle = (obs) => {
        setHasTouchedTechnical(true);
        setRoadObstacles(prev => prev.includes(obs) ? prev.filter(o => o !== obs) : [...prev, obs]);
      };

      // Calcolo live degli XP guadagnati (da +50 XP fino a +130 XP)
      const liveXP = computeSingleReviewXP(
        {
          comment,
          ratings,
          parkingTypes: isAccordionOpen ? parkingTypes : [],
          amenities: isAccordionOpen ? amenities : [],
          roadObstacles: isAccordionOpen ? roadObstacles : [],
          hasCyclePath: isAccordionOpen ? hasCyclePath : false,
          isFlashOnly: !isAccordionOpen,
        },
        Boolean(isPioneerCandidate)
      );
      const commentChars = comment.trim().length;

      const handleFormSubmit = async (e) => {
        if (e) e.preventDefault();
        if (isCheckingModeration) return;
        if (overallRating === 0) {
          setModerationError('Seleziona un voto a stelle complessivo (da 1 a 5) prima di pubblicare.');
          return;
        }

        if (isAccordionOpen && !areAllCategoriesCompleted) {
          setModerationError('Completa tutti i 13 parametri tecnici (con voto da 1 a 5 o [N/A]) prima di pubblicare.');
          return;
        }
        const finalComment = (comment || '').trim();
        const finalSegment = (streetSegment || '').trim().slice(0, 60);
        const textToCheck = `${finalSegment} ${finalComment}`.trim();

        // 1. Bypass del controllo di moderazione se il campo commento è vuoto (es. voto flash a stelle o solo parametri)
        if (finalComment.length > 0 || finalSegment.length > 0) {
          // Controllo sincrono locale rapido
          const check = validateReviewComment(textToCheck);
          if (!check.valid) {
            setModerationError(check.message);
            return;
          }
          setModerationError('');

          // Moderazione AI multilingua in tempo reale (Google Gemini) con timeout di salvaguardia
          setIsCheckingModeration(true);
          try {
            const aiResult = await moderateWithGemini(textToCheck);
            if (aiResult && aiResult.allowed === false) {
              const errorMsg = "Recensione non ammessa: " + (aiResult.reason || "il testo viola le linee guida della community.");
              setModerationError(errorMsg);
              alert(errorMsg);
              setIsCheckingModeration(false);
              return;
            }
          } catch (err) {
            console.warn('[ReviewModal] Moderazione AI gestita con fallback:', err);
          } finally {
            setIsCheckingModeration(false);
          }
        }

        const hasExistingTechnicalRatings = Boolean(initialData?.ratings && TECHNICAL_CATEGORIES.some(cat => {
          const v = initialData.ratings[cat.key];
          return v !== null && v !== undefined && v !== 'N/A' && v !== '' && !isNaN(Number(v)) && Number(v) >= 1;
        }));

        // Se l'accordion è aperto al momento dell'invio (o stiamo modificando una recensione che aveva già parametri tecnici),
        // salva i voti validi (1-5) e null per le voci N/A. Se l'accordion è chiuso, salva null per tutti (recensione flash).
        const finalRatings = {};
        const includeTechnical = isAccordionOpen || (isEditing && hasExistingTechnicalRatings);
        TECHNICAL_CATEGORIES.forEach(cat => {
          if (!includeTechnical) {
            finalRatings[cat.key] = null;
          } else {
            const v = ratings[cat.key];
            const num = Number(v);
            finalRatings[cat.key] = (!isNaN(num) && num >= 1 && num <= 5) ? num : null;
          }
        });

        // Calcola il punteggio finale di ratingOverall: 100% sintetico se flash, oppure media ponderata (40% sintetico + 60% categorie) se approfondita
        const finalCalculatedRating = computeWeightedReviewRating(overallRating, finalRatings, includeTechnical);

        try {
          await onSubmit({
            userName: currentUser ? currentUser.name : 'Tu (Cittadino)',
            streetType: streetType,
            overallRating: finalCalculatedRating,
            rawOverallRating: overallRating,
            ratings: finalRatings,
            includeTechnical,
            comment: finalComment,
            streetSegment: finalSegment,
            parkingTypes: includeTechnical ? parkingTypes : (isEditing ? (initialData?.parkingTypes || []) : []),
            hasCyclePath: includeTechnical ? hasCyclePath : (isEditing ? Boolean(initialData?.hasCyclePath) : false),
            amenities: includeTechnical ? amenities : (isEditing ? (initialData?.amenities || []) : []),
            roadObstacles: includeTechnical ? roadObstacles : (isEditing ? (initialData?.roadObstacles || []) : []),
          });
        } catch (err) {
          console.warn('[ReviewModal] Errore invio recensione:', err);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
            {/* Header Modale */}
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-bold text-slate-900">
                    {isEditing ? 'Modifica la tua recensione' : 'Nuova Recensione'}
                  </h3>
                  {isEditing && (
                    <span className="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                      ✏️ Modifica
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-500 font-medium truncate max-w-[260px]">{streetName}</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-black bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-full">
                  ⚡ +{liveXP.activeReviewXP} XP
                </span>
                {(() => {
                  const displayScore = isAccordionOpen && overallRating > 0 ? balancedScore : overallRating;
                  const hasScore = displayScore > 0;
                  const modalBg = hasScore ? getRatingColor(displayScore) : '#808080';
                  const modalText = hasScore ? getRatingTextColor(displayScore) : '#FFFFFF';
                  const modalShadow = modalText === '#FFFFFF' ? '0 1px 2px rgba(0,0,0,0.45)' : 'none';
                  const modalBorder = modalText === '#FFFFFF' ? 'rgba(255,255,255,0.3)' : 'rgba(15,23,42,0.25)';
                  return (
                    <span
                      className="text-xs font-extrabold px-2.5 py-0.5 rounded-full border shadow-2xs inline-flex items-center gap-1"
                      style={{
                        backgroundColor: modalBg,
                        color: modalText,
                        borderColor: modalBorder,
                        textShadow: modalShadow
                      }}
                      title="Anteprima voto complessivo"
                    >
                      <span>★</span>
                      <span>{hasScore ? (typeof displayScore === 'number' ? displayScore.toFixed(1) : displayScore) : '-'}</span>
                    </span>
                  );
                })()}
                <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 cursor-pointer">
                  <IconClose size={20} />
                </button>
              </div>
            </div>

            {currentUser && (
              <div className="px-6 py-2 bg-blue-50/70 border-b border-blue-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div className="flex items-center gap-2 min-w-0">
                  <img
                    src={currentUser.avatarUrl}
                    alt={currentUser.name}
                    className="w-5 h-5 rounded-full border border-blue-400 object-cover shrink-0"
                    referrerPolicy="no-referrer"
                  />
                  <span className="text-slate-600 truncate">
                    Pubblichi come: <strong className="text-slate-900">{currentUser.name}</strong>
                  </span>
                </div>
                <div className="flex flex-wrap items-center gap-1 shrink-0 text-[10px] font-bold">

    function ReportModal({ reportData, onClose, currentUser, onReportSuccess }) {
      const REPORT_REASONS = [
        '👤 Violazione Privacy / Doxxing residenti',
        '🤬 Linguaggio volgare, offensivo o sessuale',
        '⚠️ Calunnia, reati o diffamazione',
        '🚫 Odio, razzismo o discriminazione',
        '📢 Spam o contenuto non pertinente',
      ];

      const [reason, setReason] = useState(REPORT_REASONS[0]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (reportData) {
          setReason(REPORT_REASONS[0]);
          setIsSubmitting(false);
        }
      }, [reportData]);

      if (!reportData || !reportData.review) return null;

      const { review, streetKey, streetName, streetCity, streetProvince } = reportData;
      const locationStr = `${streetName || 'Via'}${streetCity ? ` (${streetCity}${streetProvince ? ` - ${streetProvince}` : ''})` : ''}`;
      const subject = `Segnalazione Recensione - ${streetName || 'Strada'}`;
      const mailtoHref = `mailto:streetreview.app@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(
        `Segnalazione Recensione su Street Review\n` +
        `-----------------------------------------\n` +
        `Strada: ${locationStr}\n` +
        `Motivo: ${reason}\n` +
        `ID Recensione: ${review.id || 'N/D'}\n` +
        `Autore Segnalato: ${review.user || review.userName || 'Utente'} (ID: ${review.authorId || review.userId || 'N/D'})\n` +
        `Testo Segnalato: "${review.comment || ''}"\n` +
        `-----------------------------------------\n` +
        `Segnalato da: ${currentUser?.email || 'N/D'} (ID: ${currentUser?.id || 'N/D'})`
      )}`;

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (isSubmitting) return;

        setIsSubmitting(true);
        try {
          const firestore = window.db;
          if (!firestore) {
            alert("Database Firestore non disponibile. Verifica la connessione a internet.");
            setIsSubmitting(false);
            return;
          }

          const serverTimestamp = (window.firebase && window.firebase.firestore && window.firebase.firestore.FieldValue && window.firebase.firestore.FieldValue.serverTimestamp()) || new Date().toISOString();

          const payload = {
            reviewId: String(review.id || '').trim(),
            streetKey: String(streetKey || review.streetKey || '').trim(),
            streetName: String(streetName || review.streetName || '').trim(),
            streetCity: String(streetCity || review.streetCity || '').trim(),
            streetProvince: String(streetProvince || review.streetProvince || '').trim(),
            reportedAuthorId: String(review.authorId || review.userId || '').trim(),
            reportedAuthorName: String(review.user || review.userName || 'Utente').trim(),
            reportedText: String(review.comment || '').trim(),
            reason: reason,
            reporterId: String(currentUser?.id || currentUser?.uid || '').trim(),
            reporterEmail: String(currentUser?.email || '').trim(),
            createdAt: serverTimestamp,
            status: 'pending',
          };

          await firestore.collection('reports').add(payload);
          if (onReportSuccess) {
            onReportSuccess();
          }
          onClose();
        } catch (err) {
          console.error("Errore salvataggio segnalazione su Firestore:", err);
          alert("Impossibile inviare la segnalazione: " + (err.message || err));
          setIsSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[75] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fade-in">
          <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-slide-up border border-slate-100 flex flex-col max-h-[92vh]">
            {/* Header */}
            <div className="px-5 py-4 bg-rose-50 border-b border-rose-100 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-2.5">
                <span className="text-xl">🚩</span>
                <div>
                  <h3 className="text-sm font-black text-slate-900">Segnala questa recensione</h3>
                  <p className="text-[11px] text-rose-700 font-semibold truncate max-w-[240px] sm:max-w-[280px]">
                    {locationStr}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-white/80 cursor-pointer transition-colors"
              >
                <IconClose size={18} />
              </button>
            </div>

            {/* Form & Content */}
            <form onSubmit={handleSubmit} className="p-5 sm:p-6 space-y-4 text-xs overflow-y-auto flex-1">
              {/* Anteprima del testo segnalato e nome autore */}
              <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-1.5">
                <div className="flex items-center justify-between text-[11px]">
                  <span className="text-slate-500 font-semibold">Autore recensione:</span>
                  <span className="font-extrabold text-slate-800">{review.user || review.userName || 'Utente'}</span>
                </div>
                <div className="pt-1 border-t border-slate-200/60">
                  <p className="text-slate-700 italic leading-relaxed text-[11px]">
                    "{review.comment || 'Nessun testo registrato.'}"
                  </p>
                </div>
              </div>

              {/* Selezione del motivo */}
              <div className="space-y-2">
                <p className="font-extrabold text-slate-800 text-[11px] uppercase tracking-wider">
                  Seleziona il motivo:
                </p>
                <div className="space-y-1.5">
                  {REPORT_REASONS.map((opt) => {
                    const isSelected = reason === opt;
                    return (
                      <label
                        key={opt}
                        className={`flex items-center gap-2.5 p-2.5 rounded-xl border cursor-pointer transition-all ${
                          isSelected
                            ? 'bg-rose-50/80 border-rose-300 text-rose-950 font-bold shadow-2xs'
                            : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                        }`}
                      >
                        <input
                          type="radio"
                          name="reportReasonOption"
                          value={opt}
                          checked={isSelected}
                          onChange={() => setReason(opt)}
                          className="accent-rose-600"
                        />
                        <span className="text-xs">{opt}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* Opzione Notifica Mail Diretta */}
              <div className="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-2 text-[11px] text-slate-600">
                <span>Notifica immediata via mail:</span>
                <a
                  href={mailtoHref}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-rose-600 font-bold hover:underline shrink-0 flex items-center gap-1"
                >
                  <span>✉️ Apri client mail</span>
                </a>
              </div>

              {/* Bottoni Azione */}
              <div className="flex items-center gap-2.5 pt-1">
                <button
                  type="button"
                  onClick={onClose}
                  disabled={isSubmitting}
                  className="flex-1 py-2.5 rounded-2xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"
                >
                  Annulla
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="flex-1 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-center shadow-lg shadow-rose-500/25 cursor-pointer transition-all disabled:opacity-50 flex items-center justify-center gap-1.5"
                >
                  {isSubmitting ? (
                    <span>Invio in corso...</span>
                  ) : (
                    <>
                      <span>🚩</span>
                      <span>Invia segnalazione</span>
                    </>
                  )}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

                          <span>ID: <code className="text-[9px] bg-slate-200 px-1 py-0.5 rounded">{rep.reviewId}</code></span>
                        </div>
                        <p className="text-xs text-slate-800 italic leading-relaxed pt-1">
                          "{rep.reportedText}"
                        </p>
                      </div>

                      {/* Action buttons */}
                      <div className="flex flex-wrap items-center justify-end gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => onGoToStreet(rep)}
                          className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-200 transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Centra la mappa e visualizza la scheda della via"
                        >
                          <span>📍</span>
                          <span>Vai alla Via</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => onDeleteReview(rep)}
                          className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl border border-rose-700 shadow-sm transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Elimina definitivamente la recensione su Firestore e archivia la segnalazione"
                        >
                          <span>🗑️</span>
                          <span>Elimina Recensione</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => onDismissReport(rep)}
                          className="px-3 py-1.5 bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 text-xs font-bold rounded-xl border border-slate-200 hover:border-emerald-200 transition-colors flex items-center gap-1.5 cursor-pointer"
                          title="Ignora la segnalazione e conservala come archiviata"
                        >
                          <span>📁</span>
                          <span>Archivia / Ignora</span>
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {/* Footer */}
            <div className="px-6 py-3 bg-slate-100 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 shrink-0">
              <div className="flex flex-wrap items-center gap-3">
                <span className="text-[11px]">Le eliminazioni ricalcolano medie, punteggi XP e classifiche.</span>
                {onRecalculateRatings && (
                  <button
                    type="button"
                    disabled={isRecalculatingRatings}
                    onClick={onRecalculateRatings}
                    className="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-bold rounded-lg text-[11px] flex items-center gap-1.5 cursor-pointer disabled:opacity-50 transition-colors"
                    title="Ricalcola le medie ponderate (40/60) di tutte le recensioni storiche e strade"
                  >
                    <span>⚖️</span>
                    <span>{isRecalculatingRatings ? 'Ricalcolo in corso...' : 'Ricalcola Medie (40/60)'}</span>
                    {isRecalculatingRatings && (
                      <span className="inline-block w-2.5 h-2.5 border-2 border-amber-700 border-t-transparent rounded-full animate-spin"></span>
                    )}
                  </button>
                )}
              </div>
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-1.5 bg-white border border-slate-300 font-bold text-slate-700 rounded-xl hover:bg-slate-50 cursor-pointer"
              >
                Chiudi
              </button>
            </div>
          </div>
        </div>
      );
    }

                  <a href="mailto:streetreview.app@gmail.com" className="text-blue-600 font-bold hover:underline">

                <ul className="list-disc pl-5 space-y-1 text-slate-700 font-medium">
